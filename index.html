<style>
:root{--bg:#171411;--panel:#231d18;--panel2:#302821;--ink:#f2e7d8;--muted:#c7b59f;--accent:#c48546;--accent2:#e0b36d;--bad:#b85f5f;--good:#74a36f;--line:#5b4635;--field:#120f0d;--white:#fff8eb;--blue:#7ea0bc}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(140deg,#120f0d,#201812 42%,#14100d);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;line-height:1.35}
header{position:sticky;top:0;z-index:50;background:rgba(23,20,17,.97);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between;backdrop-filter:blur(8px)}
h1{font-size:20px;margin:0;letter-spacing:.035em}.sub{color:var(--muted);font-size:13px}.wrap{display:grid;grid-template-columns:270px minmax(520px,1fr) 430px;gap:14px;padding:14px;align-items:start}.card{background:rgba(35,29,24,.96);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.22);overflow:hidden}.card h2{font-size:16px;margin:0;padding:12px 14px;background:var(--panel2);border-bottom:1px solid var(--line)}.card h3{font-size:14px;margin:14px 0 8px;color:var(--accent2)}.inner{padding:12px}.nav{position:sticky;top:68px}.nav button{display:block;width:100%;text-align:left;margin:5px 0;padding:10px;border:1px solid var(--line);border-radius:10px;background:#1a1512;color:var(--ink);cursor:pointer}.nav button:hover,.nav button.active{background:var(--accent);color:#17100a}.section{display:none}.section.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}input,select,textarea{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px;font:inherit}textarea{min-height:84px;resize:vertical}.btn{background:var(--accent);color:#1a1008;border:0;border-radius:10px;padding:8px 11px;font-weight:700;cursor:pointer}.btn:hover{background:var(--accent2)}.btn.secondary{background:#372c24;color:var(--ink);border:1px solid var(--line)}.btn.danger{background:var(--bad);color:#fff}.btn.good{background:var(--good);color:#10200e}.btn.tiny{padding:4px 7px;border-radius:8px;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 8px;margin:2px;background:#1b1511;color:var(--muted);font-size:12px}.statbox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{border:1px solid var(--line);border-radius:12px;background:#17120f;padding:9px;text-align:center}.stat b{display:block;font-size:21px;color:var(--white)}.stat span{font-size:11px;color:var(--muted)}.list{display:flex;flex-direction:column;gap:8px;max-height:540px;overflow:auto;padding-right:4px}.item{border:1px solid var(--line);border-radius:12px;background:#1a1512;padding:10px}.item strong{color:var(--accent2)}.item small{display:block;color:var(--muted);margin-top:4px}.item .txt{white-space:pre-wrap;color:#dfcfbb;font-size:12px;max-height:52px;overflow:hidden;margin-top:6px}.summary{position:sticky;top:68px}.summaryList{max-height:390px;overflow:auto;padding-right:4px}.sel{border:1px solid var(--line);border-radius:10px;margin:6px 0;padding:8px;background:#16110e}.sel .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.sel small{display:block;color:var(--muted)}.hr{border-top:1px solid var(--line);margin:12px 0}.muted{color:var(--muted)}.bad{color:#ffb0a8}.ok{color:#aee2aa}.warn{color:#ffd18d}.hidden{display:none!important}.mini{font-size:12px}.exportBox{min-height:520px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap}.attrLine{display:grid;grid-template-columns:1fr 48px 48px 48px;gap:8px;align-items:center;margin:8px 0}.attrLine b{font-size:18px}.badge{background:#2a211b;border:1px solid var(--line);border-radius:7px;padding:2px 6px;color:var(--muted);font-size:11px}
@media(max-width:1220px){.wrap{grid-template-columns:1fr}.nav,.summary{position:static}.list{max-height:360px}.summaryList{max-height:none}}
</style>

<header><div><h1>Creador de Criaturas PAPA</h1><div class="sub">Ficha viva: Atributos, Resistencia, Defensa, Movimiento, PR, PC, ataques por equipo y exportación se actualizan solos.</div></div><div class="row"><button class="btn secondary" id="saveJson">Exportar JSON</button><button class="btn secondary" id="loadJsonBtn">Importar JSON</button><input id="loadJson" type="file" accept="application/json" class="hidden"></div></header>
<div class="wrap">
  <aside class="card nav"><h2>Secciones</h2><div class="inner" id="nav"></div></aside>
  <main class="card"><h2 id="sectionTitle">Identidad</h2><div class="inner" id="sections"></div></main>
  <aside class="card summary"><h2>Ficha final</h2><div class="inner"><div class="statbox" id="quickStats"></div><div class="hr"></div><div id="liveSummary" class="summaryList"></div></div></aside>
</div>
<script>
const DATA = {"traits": [{"name": "Vitalidad Aumentada", "cost": 1, "costText": "1 PR", "category": "1. Rasgos de Desarrollo, Conceptos y Naturalezas", "text": "La criatura posee una constitución más resistente que la media de su ND.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: Aumenta la Resistencia máxima de la criatura en +10.\nPuede comprarse varias veces.\nDESCRIPCIÓN:\nEl cuerpo de la criatura soporta más castigo del esperado. Puede deberse a masa corporal, órganos redundantes, grasa, placas internas, energía vital abundante o entrenamiento físico."}, {"name": "Concepto Adicional", "cost": 2, "costText": "2 PR", "category": "1. Rasgos de Desarrollo, Conceptos y Naturalezas", "text": "La criatura posee un campo de experiencia adicional además de su Tipo.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: La criatura obtiene un Concepto adicional.\nCuando ese Concepto aplica a una acción, la criatura puede usarlo según las reglas normales del sistema.\nRestricción:\nEl Concepto debe definirse al crear la criatura y debe tener sentido para su identidad.\nDESCRIPCIÓN:\nEste rasgo representa aprendizaje, oficio, entrenamiento, memoria heredada, programación, instinto especializado o conocimiento adquirido."}, {"name": "Especialización de Concepto", "cost": 2, "costText": "2 PR", "category": "1. Rasgos de Desarrollo, Conceptos y Naturalezas", "text": "La criatura destaca especialmente en un Concepto que posee.\nCUÁNDO: Cuando usa el Concepto elegido en una tirada.\nQUÉ HACE: Obtiene +1 a esa tirada.\nRestricción:\nEl Concepto debe definirse al crear la criatura.\nEste rasgo no puede aplicarse al Concepto innato otorgado por su Tipo de criatura. Debe aplicarse a un Concepto obtenido por Herencia, rasgo, equipo, formación, diseño o función específica.\nDESCRIPCIÓN:\nLa criatura no solo posee ese campo de experiencia: lo usa con una precisión superior a la media."}, {"name": "Naturaleza Adicional", "cost": 1, "costText": "1 PR", "category": "1. Rasgos de Desarrollo, Conceptos y Naturalezas", "text": "La criatura puede actuar de forma coherente usando más de una Naturaleza.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: La criatura obtiene una Naturaleza adicional.\nPuede usar esa Naturaleza cuando describa acciones que encajen con ella, siguiendo las reglas normales del sistema.\nRestricción:\nLa Naturaleza debe tener sentido para la criatura.\nDESCRIPCIÓN:\nEste rasgo representa una criatura con un rango conductual más amplio. Puede ser una bestia que alterna entre ferocidad y cautela, un NPC entrenado para mantener la calma, un espíritu que actúa con frialdad o un monstruo capaz de pasar del sigilo a la brutalidad."}, {"name": "Naturaleza Dominante", "cost": 2, "costText": "2 PR", "category": "1. Rasgos de Desarrollo, Conceptos y Naturalezas", "text": "La criatura encarna una Naturaleza con fuerza inusual.\nCUÁNDO: Una vez por ronda, cuando realiza una tirada usando la Naturaleza elegida.\nQUÉ HACE: Obtiene +1 al resultado de esa tirada.\nRestricción:\nLa Naturaleza debe definirse al crear la criatura.\nLímite:\nSolo puede comprarse una vez para una misma Naturaleza.\nDESCRIPCIÓN:\nLa criatura actúa de esa forma con una intensidad marcada. No solo es feroz, cautelosa, metódica o siniestra: esa forma de actuar domina su cuerpo y decisiones."}, {"name": "Sinergia de Concepto y Naturaleza", "cost": 3, "costText": "3 PR", "category": "1. Rasgos de Desarrollo, Conceptos y Naturalezas", "text": "La criatura tiene una combinación especialmente fuerte entre lo que sabe hacer y la forma en que actúa.\nCUÁNDO: Una vez por ronda, cuando una tirada use al mismo tiempo un Concepto definido y una Naturaleza definida.\nQUÉ HACE: Obtiene +2 al resultado de esa tirada.\nRestricción:\nEl Concepto y la Naturaleza deben definirse al crear la criatura.\nNota:\nEste rasgo no se acumula con Especialización de Concepto ni Naturaleza Dominante en la misma tirada. Si más de uno aplicaría, usa solo el mayor bono.\nDESCRIPCIÓN:\nLa criatura tiene una identidad muy enfocada. Caza Silenciosamente, combate Brutalmente, custodia Tenazmente, engaña Astutamente o ejecuta órdenes Metódicamente."}, {"name": "Instinto Experto", "cost": 2, "costText": "2 PR", "category": "1. Rasgos de Desarrollo, Conceptos y Naturalezas", "text": "La criatura aplica su Tipo como Concepto innato con especial claridad.\nCUÁNDO: Una vez por ronda, cuando realiza una tirada usando su Tipo como Concepto innato.\nQUÉ HACE: Obtiene +1 al resultado de esa tirada.\nRestricción:\nSolo aplica al Tipo de criatura, no a Conceptos adicionales.\nDESCRIPCIÓN:\nLa criatura expresa su naturaleza con una precisión excepcional. Una Bestia rastrea mejor, un Elemental reconoce mejor su elemento, un Artificial ejecuta mejor su función y un Espíritu se mueve con más claridad dentro de su lógica invisible."}, {"name": "Afinidad con Técnicas", "cost": 1, "costText": "1 PR por rango", "category": "1. Rasgos de Desarrollo, Conceptos y Naturalezas", "text": "La criatura posee entrenamiento, instinto, poder interno o estructura sobrenatural suficiente para desarrollar Técnicas propias.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: La criatura obtiene 5 PC adicionales para diseñar Técnicas.\nPuede comprarse varias veces. Cada compra otorga +5 PC.\nLos PC obtenidos por este rasgo se suman a los PC gratuitos que la criatura reciba por ND.\nDESCRIPCIÓN:\nEste rasgo representa criaturas con maniobras, poderes, ataques especiales, dones espirituales, entrenamiento marcial, programación avanzada o capacidades sobrenaturales que van más allá de sus ataques naturales."}, {"name": "Persistencia Instintiva", "cost": 2, "costText": "2 PR", "category": "1. Rasgos de Desarrollo, Conceptos y Naturalezas", "text": "La criatura insiste, repite patrones o arrastra ecos de memoria que le permiten corregir un fallo.\nCUÁNDO: Cuando falla una tirada relacionada directamente con su identidad o función principal.\nQUÉ HACE: Una vez por combate, puede repetir esa tirada y quedarse con el segundo resultado.\nRestricción:\nLa función debe definirse al crear la criatura.\nEjemplos: custodiar una puerta, perseguir una presa, proteger a su manada, ejecutar una orden, mantener un ritual, cazar en oscuridad.\nDESCRIPCIÓN:\nLa criatura vuelve a intentar aquello para lo que fue hecha. No se rinde ante el primer fallo cuando actúa dentro de su función central.\n2. Rasgos de Tipo y Escala\nEstos rasgos modifican la relación de la criatura con su Tipo o su peso general dentro del sistema.\nNo indican si la criatura será usada como jefe, amenaza menor o criatura común. Eso lo decide el Director de Juego al usarla. Estos rasgos solo indican que la criatura tiene una relación especial con su Tipo o que está por encima o por debajo del ejemplar estándar de su ND."}, {"name": "Habilidad de Tipo Adicional", "cost": 2, "costText": "2 PR", "category": "2. Rasgos de Tipo y Escala", "text": "La criatura desarrolla una segunda capacidad propia de su Tipo.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: La criatura obtiene una Habilidad de Tipo adicional de su mismo Tipo.\nLa habilidad elegida debe pertenecer al Tipo de la criatura.\nEjemplos:\nUna Bestia puede adquirir otra habilidad de Bestia.\nUn Elemental puede adquirir otra habilidad de Elemental.\nUn NPC puede adquirir otra habilidad de NPC.\nUn Artificial puede adquirir otra habilidad de Artificial.\nLímite:\nEste rasgo puede comprarse hasta dos veces.\nUna criatura no puede tener más de tres Habilidades de Tipo en total: la gratuita inicial y hasta dos adicionales compradas con este rasgo.\nRestricción:\nLa criatura no puede elegir Habilidades de Tipo de otro Tipo mediante este rasgo.\nDESCRIPCIÓN:\nAlgunas criaturas expresan su naturaleza con más fuerza que otras. Un depredador puede ser instintivo y también actuar en manada. Un constructo puede tener mente mecánica y además un protocolo de combate. Un NPC puede tener vocación y también entrenamiento de veterano."}, {"name": "Hibridación de Tipo", "cost": 3, "costText": "3 PR", "category": "2. Rasgos de Tipo y Escala", "text": "La criatura posee una naturaleza híbrida, contaminada, alterada o construida a partir de más de una lógica biológica o sobrenatural.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: La criatura obtiene una Habilidad de Tipo perteneciente a un Tipo distinto al suyo.\nLa elección debe justificarse en la identidad de la criatura.\nLímite:\nEste rasgo solo puede comprarse una vez.\nRestricción:\nLa criatura no cambia su Tipo principal. El nuevo Tipo solo sirve para la Habilidad de Tipo adquirida.\nEjemplos:\nUna Bestia corrompida puede adquirir una habilidad de Corrupto.\nUn Artificial poseído puede adquirir una habilidad de Espíritu.\nUn Monstruo de origen divino puede adquirir una habilidad de Exaltado.\nUn NPC transformado por energía elemental puede adquirir una habilidad de Elemental.\nDESCRIPCIÓN:\nEste rasgo sirve para criaturas mixtas, contaminadas, bendecidas, poseídas, modificadas o nacidas de cruces raros entre naturalezas incompatibles."}, {"name": "Criatura Superior", "cost": 3, "costText": "3 PR", "category": "2. Rasgos de Tipo y Escala", "text": "La criatura es una versión excepcional de su especie: más fuerte, más vieja, mejor adaptada, bendecida, mutada, entrenada o simplemente más peligrosa que un ejemplar común.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: La criatura obtiene todos estos beneficios:\n+15 a su Resistencia máxima.\n+1 a Defensa.\n+5 PC para Técnicas.\nVentaja en Salvaciones contra el estado Asustado.\nRestricción:\nLa criatura debe tener al menos ND 1. No puede tomarse en criaturas de ND 1/8, ND 1/4 o ND 1/2 salvo autorización expresa del Diseñador.\nLímite:\nEste rasgo solo puede tomarse una vez.\nDESCRIPCIÓN:\nEste rasgo representa campeones naturales, variantes antiguas, mutaciones superiores, depredadores alfa, guardianes consagrados o individuos especialmente desarrollados.\n3. Rasgos Ofensivos\nEstos rasgos aumentan la capacidad de una criatura para herir, presionar, perseguir, apresar, desgastar o castigar a sus enemigos.\nUn rasgo ofensivo debe estar ligado a una parte clara de la criatura: garras, colmillos, masa corporal, aguijón, tentáculos, cuernos, secreciones, veneno, calor interno, hambre sobrenatural, entrenamiento de combate o capacidad equivalente.\nLos rasgos ofensivos no deben elegirse solo para aumentar números. Deben expresar cómo ataca la criatura."}, {"name": "Alcance Mejorado", "cost": 1, "costText": "1 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura posee extremidades, cuello, cola, lengua, tentáculos, ramas, látigos corporales u otros apéndices capaces de golpear más lejos de lo normal.\nCUÁNDO: Siempre activa.\nQUÉ HACE: El alcance de sus ataques cuerpo a cuerpo naturales aumenta en 3 metros.\nEste rasgo solo aplica a ataques realizados con partes del propio cuerpo. No aumenta el alcance de armas fabricadas, salvo que el arma forme parte integrada del cuerpo de la criatura.\nDESCRIPCIÓN:\nLa criatura no necesita acercarse del todo para herir. Su anatomía le permite mantener distancia mientras golpea, muerde, arrastra o perfora."}, {"name": "Alcance Mejorado Superior", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura puede golpear a una distancia muy superior a la de una criatura común de su tamaño.\nCUÁNDO: Siempre activa.\nQUÉ HACE: El alcance de sus ataques cuerpo a cuerpo naturales aumenta en 6 metros.\nEste rasgo reemplaza Alcance Mejorado, no se suma con él.\nRestricción:\nDebe existir una justificación anatómica clara: cuello largo, látigo corporal, tentáculos extensos, ramas, lengua proyectable, cola descomunal u otra estructura equivalente.\nDESCRIPCIÓN:\nLa criatura mantiene a sus enemigos lejos de su cuerpo principal. Puede azotar, morder o arrastrar desde una distancia que vuelve peligroso acercarse."}, {"name": "Arrollar", "cost": 1, "costText": "1 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura usa su peso, impulso o volumen para abrirse paso entre enemigos más pequeños.\nCUÁNDO: Cuando se mueve a través del espacio ocupado por una criatura de tamaño inferior.\nQUÉ HACE: La criatura puede atravesar el espacio de criaturas de menor tamaño. Cada criatura atravesada debe superar una Salvación de Destreza contra ND 10 o queda Derribada.\nUna criatura solo puede ser afectada por este rasgo una vez por turno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nRestricción:\nLa criatura debe ser al menos de tamaño Grande o tener una justificación anatómica clara, como cuerpo rodante, masa gelatinosa, enjambre compacto, carga sobrenatural o impulso extraordinario.\nDESCRIPCIÓN:\nLa criatura no esquiva. Pasa por encima, empuja, barre piernas o aplasta con su propio cuerpo."}, {"name": "Ataque Adicional", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura puede atacar más de una vez en su turno.\nCUÁNDO: En su turno, cuando realiza una acción de ataque.\nQUÉ HACE: Puede realizar un ataque adicional.\nEl ataque adicional no suma Atributo al daño.\nLímite:\nEste rasgo puede comprarse varias veces. Cada compra permite realizar un ataque adicional más durante el turno.\nUna criatura no puede realizar más ataques adicionales mediante este rasgo que el número de veces que lo haya comprado.\nNota:\nSi la criatura obtiene ataques adicionales por Técnicas, Comportamiento u otros rasgos, el Diseñador debe revisar que no se generen cadenas de ataques sin límite.\nDESCRIPCIÓN:\nLa criatura posee más miembros, más bocas, más entrenamiento o más capacidad de coordinación que un atacante común."}, {"name": "Ataque Poderoso", "cost": 1, "costText": "1 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura puede golpear con más fuerza a cambio de perder precisión.\nCUÁNDO: Antes de realizar un ataque cuerpo a cuerpo.\nQUÉ HACE: La criatura sufre −2 a la tirada de ataque. Si el ataque impacta, inflige +3 de daño.\nDebe declararse antes de tirar.\nDESCRIPCIÓN:\nLa criatura carga todo su peso en el golpe. No busca precisión: busca romper."}, {"name": "Ataque Vorpal", "cost": 4, "costText": "4 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura causa heridas catastróficas cuando conecta un golpe crítico limpio.\nCUÁNDO: Cuando obtiene un golpe crítico con un ataque natural y la suma supera la Defensa del objetivo.\nQUÉ HACE: El ataque hace daño máximo según las reglas normales de crítico. Además, añade +6 de daño adicional.\nSi el crítico no supera la Defensa del objetivo, no se añade este daño adicional. Se aplica el crítico normal.\nDESCRIPCIÓN:\nCuando el golpe entra en el punto exacto, la herida no es normal. Algo se parte, se abre o queda inútil."}, {"name": "Carga Imparable", "cost": 1, "costText": "1 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura convierte el movimiento en fuerza de impacto.\nCUÁNDO: Cuando se mueve al menos 6 metros en línea recta antes de realizar un ataque cuerpo a cuerpo.\nQUÉ HACE: Si el ataque impacta, inflige +1d6 de daño adicional.\nSolo puede aplicarse una vez por turno.\nDESCRIPCIÓN:\nEl daño no viene solo del músculo, sino de la carrera. La criatura baja la cabeza, extiende las garras, clava los cuernos o cae sobre su objetivo con todo su peso."}, {"name": "Combate a Ciegas", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura puede combatir sin depender de la vista.\nCUÁNDO: Cuando ataca a una criatura que no puede ver, pero que puede detectar mediante otro sentido.\nQUÉ HACE: No sufre penalizaciones a sus ataques por no poder ver a su objetivo.\nRestricción:\nDebe definirse el sentido alternativo que usa: ecolocalización, vibración, calor, olor, presión del aire, percepción espiritual u otro mecanismo equivalente.\nEste rasgo no permite atacar objetivos que la criatura no pueda detectar de ninguna forma.\nDESCRIPCIÓN:\nLa criatura no necesita ojos para encontrar carne, calor, alma, movimiento o respiración."}, {"name": "Corrosión", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura posee ácido, saliva corrosiva, enzimas, óxido vivo, fuego digestivo, secreciones o energía capaz de degradar protecciones físicas.\nCUÁNDO: Cuando impacta con un ataque Corrosivo.\nQUÉ HACE: Además del daño normal, el objetivo reduce en 1 el bono de Armadura otorgado por la armadura portada.\nEste rasgo no reduce escudos, Defensa natural ni bonificadores que no provengan de armadura portada.\nLa reducción dura hasta que la armadura sea reparada.\nSi el bono de Armadura de la armadura portada llega a 0 por efecto de este rasgo, la armadura se rompe. Una armadura rota de esta forma queda inutilizable y no puede repararse.\nDESCRIPCIÓN:\nLa mordida no solo abre carne. Deja metal opaco, cuero comido, placas agrietadas y correas deshechas."}, {"name": "Crítico Mejorado", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura aprovecha mejor las aberturas cuando obtiene un golpe crítico.\nCUÁNDO: Cuando obtiene un golpe crítico con un ataque y la suma supera la Defensa del objetivo.\nQUÉ HACE: El ataque hace daño máximo según las reglas normales de crítico. Además, añade +2 de daño adicional.\nSi el crítico no supera la Defensa del objetivo, no se añade este daño adicional. Se aplica el crítico normal.\nDESCRIPCIÓN:\nLa criatura no solo acierta. Sabe abrir la herida donde duele."}, {"name": "Drenaje Menor", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura recupera parte de su energía al dañar a otros.\nCUÁNDO: Cuando inflige daño directo con uno de sus ataques.\nQUÉ HACE: Recupera Resistencia igual a la mitad del daño infligido, redondeando hacia abajo.\nSolo puede beneficiarse de este rasgo una vez por turno.\nLa recuperación no puede superar su Resistencia máxima.\nEl daño persistente, como Sangrado, Veneno o Quemadura de Contacto, no activa este rasgo salvo que otro rasgo indique lo contrario.\nDESCRIPCIÓN:\nLa criatura bebe sangre, calor, fuerza vital, memoria, humedad, energía espiritual o cualquier otra sustancia que su cuerpo pueda convertir en recuperación inmediata."}, {"name": "Drenaje", "cost": 4, "costText": "4 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura convierte el daño causado en recuperación inmediata.\nCUÁNDO: Cuando inflige daño directo con uno de sus ataques.\nQUÉ HACE: Recupera Resistencia igual al daño infligido.\nSolo puede beneficiarse de este rasgo una vez por turno.\nLa recuperación no puede superar su Resistencia máxima.\nEl daño persistente, como Sangrado, Veneno o Quemadura de Contacto, no activa este rasgo salvo que otro rasgo indique lo contrario.\nPrerequisito:\nDrenaje Menor.\nDESCRIPCIÓN:\nCada herida alimenta a la criatura. La sangre, el alma, la sombra o el calor robado cierran sus propias grietas."}, {"name": "Engarro", "cost": 1, "costText": "1 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura posee garras, pinzas, mandíbulas, tentáculos, lengua, cola u otras extremidades diseñadas para sujetar presas.\nCUÁNDO: Cuando impacta con un ataque cuerpo a cuerpo.\nQUÉ HACE: Después de impactar, puede intentar una maniobra de Apresar como Acción Rápida.\nDebe tener una extremidad, mandíbula o apéndice capaz de mantener la presa.\nDESCRIPCIÓN:\nLa criatura no solo hiere. Se queda pegada a su víctima, hunde las garras, cierra las mandíbulas o enrolla sus miembros para impedir la huida."}, {"name": "Estado Añadido", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "Los ataques de la criatura pueden imponer un estado alterado físico que no sea Envenenado.\nCUÁNDO: Cuando impacta con un ataque definido al crear la criatura.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o sufrir el estado alterado físico elegido.\nEl estado debe provenir de un mecanismo corporal o físico claro: parálisis muscular, dolor intenso, rigidez, espasmos, agotamiento, daño interno, presión corporal, frío físico, descarga nerviosa, secreción entumecedora u otro efecto similar.\nDuración:\nEl estado dura hasta el final del próximo turno del objetivo, salvo que el estado elegido tenga una duración menor o una condición de cierre más específica.\nRestricción:\nEl estado y el mecanismo deben definirse al crear la criatura.\nEste rasgo no puede usarse para aplicar Envenenado ni estados mentales como miedo, confusión, compulsión, fascinación o control mental. Esos efectos deben cubrirse con rasgos específicos.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDESCRIPCIÓN:\nEl golpe no solo hiere. El cuerpo se traba, se entumece, se dobla o pierde respuesta."}, {"name": "Influencia Mental", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "Los ataques, mirada, voz, aura, presencia, canto, feromonas, contacto espiritual o poder psíquico de la criatura pueden imponer un estado alterado mental.\nCUÁNDO: Cuando impacta con un ataque definido al crear la criatura o cuando una criatura entra en contacto con el mecanismo mental definido.\nQUÉ HACE: El objetivo debe superar una Salvación de Aura contra ND 10 o sufrir el estado alterado mental elegido.\nEl estado debe provenir de un mecanismo mental, emocional, espiritual o perceptivo claro: miedo, encanto, fascinación, confusión, compulsión, sugestión, presión espiritual, canto hipnótico, mirada paralizante, aura inquietante, perfume embriagador u otro efecto similar.\nDuración:\nEl estado dura hasta el final del próximo turno del objetivo, salvo que el estado elegido tenga una duración menor o una condición de cierre más específica.\nRestricción:\nEl estado y el mecanismo deben definirse al crear la criatura.\nEste rasgo no puede usarse para aplicar estados físicos como Derribado, Inmovilizado, Aturdido físico, Envenenado, Quemado, Fatiga o efectos causados por daño corporal directo. Esos efectos deben cubrirse con rasgos específicos.\nLímite:\nUna misma criatura solo puede sufrir este rasgo una vez por ronda por parte del mismo atacante.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDESCRIPCIÓN:\nEl ataque no solo toca el cuerpo. Entra por miedo, deseo, voz, memoria o presión espiritual."}, {"name": "Francotirador", "cost": 1, "costText": "1 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura está adaptada o entrenada para atacar a larga distancia.\nCUÁNDO: Cuando ataca a larga distancia con un arma de rango, proyectil natural, descarga, escupitajo, espina, aguijón lanzado u otro ataque a distancia definido.\nQUÉ HACE: No sufre penalizadores por distancia, viento, lluvia, clima adverso, humo ligero u otras condiciones ambientales menores que dificulten ataques a distancia.\nEste rasgo no permite ignorar cobertura sólida, oscuridad total, invisibilidad, barreras físicas ni la imposibilidad de detectar al objetivo.\nDESCRIPCIÓN:\nLa criatura corrige el tiro por instinto, entrenamiento o anatomía. La distancia y el clima le importan menos que a otros."}, {"name": "Furia", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura se vuelve más peligrosa cuando está herida.\nCUÁNDO: Mientras tenga la mitad o menos de su Resistencia máxima.\nQUÉ HACE: Sus ataques infligen +1d6 de daño adicional.\nEste daño adicional solo puede aplicarse una vez por turno.\nDESCRIPCIÓN:\nCuanto más cerca está de caer, más peligroso se vuelve su cuerpo. Ya no pelea para vencer. Pelea para no morir."}, {"name": "Golpe Debilitante", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "Los ataques de la criatura entorpecen al objetivo mediante toxina, descarga nerviosa, frío, presión espiritual, dolor intenso o daño muscular.\nCUÁNDO: Cuando impacta con un ataque.\nQUÉ HACE: El objetivo sufre −1 a todas sus tiradas hasta el final de su próximo turno.\nLímite:\nUna misma criatura solo puede sufrir este penalizador una vez por ronda por parte del mismo atacante.\nDESCRIPCIÓN:\nEl golpe deja algo atrás: temblor, espasmo, dolor o una presión que vuelve torpes las siguientes acciones."}, {"name": "Inducir Fatiga", "cost": 3, "costText": "3 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura puede agotar físicamente a sus víctimas.\nCUÁNDO: Cuando inflige daño con un ataque definido al crear la criatura.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o gana 1 nivel de Fatiga.\nLímite:\nUna misma criatura solo puede ganar Fatiga por este rasgo una vez por combate.\nRestricción:\nEl mecanismo debe definirse al crear la criatura: veneno, absorción vital, frío extremo, enfermedad, presión espiritual, pérdida de sangre u otro efecto equivalente.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDESCRIPCIÓN:\nLa herida pesa más de lo normal. El cuerpo pierde aire, calor, sangre o fuerza."}, {"name": "Ráfaga", "cost": 3, "costText": "3 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura puede encadenar un ataque cuando derriba a una presa.\nCUÁNDO: Cuando reduce a una criatura enemiga a 0 de Resistencia con un ataque.\nQUÉ HACE: Puede realizar un ataque adicional como Acción Rápida contra otra criatura a su alcance.\nEl ataque adicional no suma Atributo al daño.\nLímite:\nEste rasgo solo puede activarse una vez por turno.\nDESCRIPCIÓN:\nLa caída de una presa no detiene a la criatura. La anima. Salta sobre el siguiente cuerpo antes de que la sangre del primero toque el suelo."}, {"name": "Sangrado", "cost": 1, "costText": "1 PR", "category": "3. Rasgos Ofensivos", "text": "Los ataques Cortantes o Penetrantes de la criatura abren heridas difíciles de cerrar.\nCUÁNDO: Cuando impacta con un ataque Cortante o Penetrante.\nQUÉ HACE: El objetivo sufre 1d6 de daño al inicio de su próximo turno.\nLímite:\nUna misma criatura solo puede sufrir este daño una vez por ronda por parte del mismo atacante.\nEste daño no se acumula consigo mismo por impactos múltiples del mismo atacante durante la misma ronda.\nDESCRIPCIÓN:\nSus colmillos, garras o espinas no hacen cortes limpios. Rasgan carne, rompen vasos y dejan heridas que siguen perdiendo sangre después del impacto."}, {"name": "Veneno de Contacto", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura produce veneno mediante colmillos, aguijón, piel, saliva, secreciones, esporas, sangre contaminada u otro mecanismo definido.\nCUÁNDO: Cuando impacta con un ataque capaz de transmitir el veneno.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o queda Envenenado.\nMientras esté Envenenado por este rasgo, sufre 1d6 de daño Corrosivo al inicio de su turno.\nAl final de cada uno de sus turnos puede repetir la Salvación. Si tiene éxito, el efecto termina.\nRestricción:\nEl método de transmisión debe definirse al crear la criatura.\nLímite:\nUna criatura puede sufrir más de una instancia de Veneno de Contacto a la vez solo si provienen de fuentes diferentes.\nDos impactos de la misma criatura, veneno o fuente no crean instancias separadas del mismo veneno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDESCRIPCIÓN:\nEl veneno entra por mordida, aguijón, piel abierta o esporas. No siempre mata rápido, pero obliga al cuerpo a pelear contra sí mismo."}, {"name": "Quemadura de Contacto", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura transmite fuego, hielo extremo, escarcha abrasiva, calor interno, contacto ígneo, frío sobrenatural o energía térmica dañina mediante su cuerpo o ataques.\nCUÁNDO: Cuando impacta con un ataque capaz de transmitir la quemadura.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o queda Quemado.\nMientras esté Quemado por este rasgo, sufre 1d6 de daño al inicio de su turno. El tipo de daño debe definirse al crear la criatura: Fuego o Hielo.\nAl final de cada uno de sus turnos puede repetir la Salvación. Si tiene éxito, el efecto termina.\nRestricción:\nEl método de transmisión debe definirse al crear la criatura.\nLímite:\nUna misma criatura puede sufrir más de una instancia de Quemadura de Contacto a la vez solo si provienen de fuentes diferentes.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDESCRIPCIÓN:\nEl contacto deja una marca que sigue quemando o congelando después del golpe."}, {"name": "Presa Marcada", "cost": 1, "costText": "1 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura fija su atención en una presa concreta y se vuelve más peligrosa contra ella.\nCUÁNDO: Al inicio de su turno, como Acción Rápida.\nQUÉ HACE: Elige una criatura visible o detectable a 12 metros o menos. Hasta el inicio del próximo turno de la criatura, obtiene +1 a sus tiradas de ataque contra ese objetivo.\nLímite:\nSolo puede tener una Presa Marcada a la vez.\nCierre:\nEl efecto termina si la presa deja de ser visible o detectable para la criatura.\nDESCRIPCIÓN:\nLa criatura elige a quién va a matar primero. Todo su cuerpo se orienta hacia esa presa."}, {"name": "Daño Energético Añadido", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "Los ataques de la criatura están cargados con energía elemental, divina, corrupta, espiritual o sobrenatural.\nCUÁNDO: Cuando impacta con un ataque definido al crear la criatura.\nQUÉ HACE: El ataque inflige +1d6 de daño adicional de un tipo elegido al crear la criatura.\nEjemplos: Fuego, Hielo, Corrosivo, Radiante, Sombra, Mental u otro tipo permitido por el sistema.\nLímite:\nEste daño adicional solo puede aplicarse una vez por turno.\nRestricción:\nEl tipo de daño y el mecanismo deben definirse al crear la criatura.\nDESCRIPCIÓN:\nEl ataque lleva algo más que fuerza física: fuego, hielo, luz, sombra, corrupción, pensamiento o poder espiritual."}, {"name": "Hambre Insaciable", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura recupera fuerzas al abatir a una presa.\nCUÁNDO: Cuando reduce a una criatura enemiga a 0 de Resistencia con un ataque cuerpo a cuerpo.\nQUÉ HACE: Recupera 1d6 de Resistencia.\nLa recuperación no puede superar su Resistencia máxima.\nLímite:\nSolo puede activarse una vez por turno.\nDESCRIPCIÓN:\nCuando una presa cae, la criatura se alimenta del momento: sangre, carne, miedo, calor o pura satisfacción depredadora."}, {"name": "Explosión de Impacto", "cost": 2, "costText": "2 PR", "category": "3. Rasgos Ofensivos", "text": "La criatura libera una descarga secundaria cuando conecta un golpe.\nCUÁNDO: Una vez por turno, cuando impacta con un ataque definido al crear la criatura.\nQUÉ HACE: Todas las criaturas adyacentes al objetivo principal sufren 1d6 de daño del tipo elegido al crear la criatura.\nRestricción:\nEl tipo de daño y el mecanismo deben definirse al crear la criatura.\nNota:\nEste rasgo no afecta al objetivo principal dos veces. El objetivo principal recibe solo el daño normal del ataque.\nDESCRIPCIÓN:\nEl golpe estalla, salpica, descarga o libera una onda que castiga a quienes estén demasiado cerca.\n4. Rasgos Defensivos\nEstos rasgos aumentan la supervivencia de una criatura, reducen daño, dificultan que sea controlada, le permiten recuperarse o castigan a quienes la atacan.\nUn rasgo defensivo debe explicar por qué la criatura resiste: piel gruesa, placas óseas, núcleo vital redundante, instinto de evasión, magia protectora, armadura natural, regeneración, fisiología extraña o voluntad sobrenatural."}, {"name": "Absorción de Daño", "cost": 3, "costText": "3 PR", "category": "4. Rasgos Defensivos", "text": "La criatura no solo ignora un tipo de daño: lo convierte parcialmente en recuperación.\nCUÁNDO: Cuando recibe daño de un tipo elegido al crear la criatura.\nQUÉ HACE: La criatura es inmune al tipo de daño elegido. Además, recupera Resistencia igual a la mitad del daño que habría recibido, redondeando hacia abajo.\nLa recuperación no puede superar su Resistencia máxima.\nRestricción:\nEl tipo de daño debe definirse al crear la criatura.\nDESCRIPCIÓN:\nLa criatura se alimenta de aquello que debería dañarla. Puede absorber fuego, electricidad, corrupción, hielo, veneno, sombra u otra energía compatible con su naturaleza."}, {"name": "Armadura Natural", "cost": 1, "costText": "1 PR", "category": "4. Rasgos Defensivos", "text": "La criatura posee placas, escamas, caparazón, hueso externo, piel endurecida, corteza, metal orgánico o una protección equivalente.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Aumenta su Defensa en +1.\nPuede comprarse varias veces.\nLímite:\nLa Defensa final de una criatura no puede superar 16.\nDESCRIPCIÓN:\nLa protección forma parte del cuerpo de la criatura. No puede quitarse como una armadura equipada común."}, {"name": "Corazón Doble", "cost": 3, "costText": "3 PR", "category": "4. Rasgos Defensivos", "text": "La criatura posee un segundo corazón, núcleo redundante, alma fragmentada, reserva vital o sistema interno capaz de mantenerla en pie cuando debería caer.\nCUÁNDO: La primera vez en un combate que la criatura llegaría a 0 de Resistencia.\nQUÉ HACE: En lugar de caer a 0, queda con Resistencia igual a la mitad de su Resistencia máxima, redondeando hacia abajo.\nLímite:\nUna vez por combate.\nDESCRIPCIÓN:\nLa criatura no cae cuando se rompe el primer centro vital. Otro órgano, núcleo o impulso toma el control."}, {"name": "Desplazamiento Cuerpo a Cuerpo", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura distorsiona su posición, se mueve con reflejos extraños o vuelve difícil alcanzarla en combate cercano.\nCUÁNDO: Siempre activa mientras la criatura esté consciente y pueda moverse.\nQUÉ HACE: Los ataques cuerpo a cuerpo contra la criatura tienen Desventaja.\nSi un ataque cuerpo a cuerpo impacta a la criatura, este rasgo se desactiva hasta el inicio del próximo turno de la criatura.\nCierre:\nEl rasgo no funciona mientras la criatura esté Inmovilizada, Aturdida, Inconsciente o no pueda moverse por una condición equivalente.\nDESCRIPCIÓN:\nSu cuerpo no está donde parecía estar. Un paso corto, una vibración, una imagen falsa o un reflejo extraño desvían los golpes cercanos."}, {"name": "Desplazamiento a Distancia", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura se mueve de forma errática, borra su silueta, vibra, genera imágenes falsas o altera la percepción de quienes intentan atacarla desde lejos.\nCUÁNDO: Siempre activa mientras la criatura esté consciente y pueda moverse.\nQUÉ HACE: Los ataques a distancia contra la criatura tienen Desventaja.\nSi un ataque a distancia impacta a la criatura, este rasgo se desactiva hasta el inicio del próximo turno de la criatura.\nCierre:\nEl rasgo no funciona mientras la criatura esté Inmovilizada, Aturdida, Inconsciente o no pueda moverse por una condición equivalente.\nDESCRIPCIÓN:\nLas flechas, disparos, espinas y proyectiles siguen una silueta que ya no coincide del todo con su cuerpo."}, {"name": "Desplazamiento contra Técnicas", "cost": 3, "costText": "3 PR", "category": "4. Rasgos Defensivos", "text": "La criatura distorsiona su posición frente a Técnicas, poderes, descargas, sellos, maldiciones o efectos dirigidos.\nCUÁNDO: Cuando una Técnica o efecto dirigido exige una tirada de ataque contra la criatura.\nQUÉ HACE: Esa tirada de ataque tiene Desventaja.\nSi una Técnica o efecto dirigido impacta a la criatura, este rasgo se desactiva hasta el inicio del próximo turno de la criatura.\nCierre:\nEl rasgo no funciona mientras la criatura esté Inmovilizada, Aturdida, Inconsciente o no pueda moverse por una condición equivalente.\nNota:\nEste rasgo no afecta Técnicas de área que no requieran tirada de ataque contra la criatura.\nDESCRIPCIÓN:\nLa criatura no solo esquiva cuerpos y proyectiles. También se aparta del punto donde una Técnica intenta cerrarse."}, {"name": "Duro de Matar", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura sigue actuando unos segundos después de recibir una herida que debería derribarla.\nCUÁNDO: Cuando llega a 0 de Resistencia.\nQUÉ HACE: No cae inmediatamente. Puede actuar normalmente en su próximo turno. Al final de ese turno cae a 0 de Resistencia y queda fuera de combate.\nLímite:\nUna vez por combate.\nCierre:\nSi recupera Resistencia antes del final de ese turno, no cae.\nDESCRIPCIÓN:\nLa criatura ya está vencida, pero su cuerpo tarda un turno más en aceptarlo."}, {"name": "Escurridizo", "cost": 1, "costText": "1 PR", "category": "4. Rasgos Defensivos", "text": "La criatura se mueve de forma difícil de interceptar.\nCUÁNDO: Cuando se mueve fuera del alcance cuerpo a cuerpo de un enemigo.\nQUÉ HACE: No provoca Ataques de Oportunidad por ese movimiento.\nDESCRIPCIÓN:\nLa criatura se desliza, se agacha, rueda, se retuerce o se aparta justo antes de que el golpe pueda alcanzarla."}, {"name": "Fortaleza Interior", "cost": 1, "costText": "1 PR", "category": "4. Rasgos Defensivos", "text": "La criatura posee un cuerpo resistente a toxinas, infecciones y deterioro biológico.\nCUÁNDO: Cuando realiza Salvaciones contra venenos o enfermedades.\nQUÉ HACE: Tiene Ventaja en esas Salvaciones.\nDESCRIPCIÓN:\nSu sangre, órganos, metabolismo, energía interna o composición corporal resisten aquello que corrompe cuerpos comunes."}, {"name": "Indomable", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura posee voluntad férrea, mente simple, fanatismo, programación rígida, instinto absoluto o una conciencia difícil de doblegar.\nCUÁNDO: Cuando realiza Salvaciones contra efectos que intenten causarle Asustado, Controlado, Encantado, Confundido, Compulsión o efectos mentales equivalentes.\nQUÉ HACE: Tiene Ventaja en esas Salvaciones.\nDESCRIPCIÓN:\nNo es fácil quebrar su voluntad. Ya sea por disciplina, vacío mental, instinto o programación, la criatura se resiste a obedecer impulsos ajenos."}, {"name": "Inmune", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura no recibe daño de un tipo concreto.\nCUÁNDO: Cuando recibiría daño del tipo elegido.\nQUÉ HACE: El daño de ese tipo se reduce a 0.\nRestricción:\nEl tipo de daño debe definirse al crear la criatura.\nDESCRIPCIÓN:\nEse daño no encuentra forma de afectarla. Puede ser por cuerpo elemental, fisiología imposible, bendición, corrupción, construcción artificial o naturaleza espiritual."}, {"name": "Inmunidad a Estado", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura no puede sufrir un estado alterado concreto.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Elige un estado alterado al crear la criatura. La criatura es inmune a ese estado.\nRestricción:\nEl estado debe definirse al crear la criatura.\nDESCRIPCIÓN:\nSu cuerpo o mente no responde a ese tipo de alteración. No se paraliza, no se asusta, no se envenena, no se duerme o no se deja controlar por ese mecanismo."}, {"name": "Muerte Explosiva", "cost": 1, "costText": "1 PR", "category": "4. Rasgos Defensivos", "text": "El cuerpo de la criatura libera energía, gas, fuego, espinas, ácido, electricidad o fragmentos al caer.\nCUÁNDO: Cuando la criatura es reducida a 0 de Resistencia.\nQUÉ HACE: Todas las criaturas a 3 metros o menos sufren 1d6 de daño.\nEl tipo de daño debe definirse al crear la criatura.\nLímite:\nUna vez. No se activa si el cuerpo de la criatura fue destruido, desintegrado o neutralizado de una forma que impida la explosión.\nDESCRIPCIÓN:\nLa criatura no cae limpia. Revienta, salpica, libera gas, fuego, espinas o restos peligrosos."}, {"name": "Muerte Explosiva Mayor", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura detona violentamente al caer.\nCUÁNDO: Cuando la criatura es reducida a 0 de Resistencia.\nQUÉ HACE: Todas las criaturas a 6 metros o menos sufren 2d6 de daño.\nEl tipo de daño debe definirse al crear la criatura.\nLímite:\nUna vez. No se activa si el cuerpo de la criatura fue destruido, desintegrado o neutralizado de una forma que impida la explosión.\nDESCRIPCIÓN:\nSu muerte ocupa espacio. El cuerpo se abre con fuerza suficiente para volver peligroso el terreno cercano."}, {"name": "Muerte Explosiva Superior", "cost": 3, "costText": "3 PR", "category": "4. Rasgos Defensivos", "text": "La criatura libera una detonación masiva al morir.\nCUÁNDO: Cuando la criatura es reducida a 0 de Resistencia.\nQUÉ HACE: Todas las criaturas a 9 metros o menos sufren 3d6 de daño.\nEl tipo de daño debe definirse al crear la criatura.\nLímite:\nUna vez. No se activa si el cuerpo de la criatura fue destruido, desintegrado o neutralizado de una forma que impida la explosión.\nDESCRIPCIÓN:\nLa criatura convierte su caída en un último peligro. Su muerte rompe el espacio a su alrededor."}, {"name": "Piel de Espinas", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura está cubierta de púas, espinas, placas cortantes, escamas quebradizas, huesos expuestos u otra defensa física dañina.\nCUÁNDO: Cuando una criatura la impacta con un ataque cuerpo a cuerpo.\nQUÉ HACE: El atacante sufre 1d6 de daño físico.\nEl tipo de daño debe elegirse al crear la criatura: Contundente, Cortante o Penetrante.\nLímite:\nUna misma criatura solo puede sufrir este daño una vez por ronda.\nDESCRIPCIÓN:\nGolpearla también duele. Su cuerpo castiga el contacto."}, {"name": "Piel Elemental", "cost": 3, "costText": "3 PR", "category": "4. Rasgos Defensivos", "text": "La criatura está cubierta de fuego, hielo, energía corrupta, electricidad, ácido, sombra, luz hiriente u otra sustancia dañina no física.\nCUÁNDO: Cuando una criatura la impacta con un ataque cuerpo a cuerpo.\nQUÉ HACE: El atacante sufre 1d6 de daño no físico.\nEl tipo de daño debe elegirse al crear la criatura: Fuego, Hielo, Corrosivo, Radiante, Mental, Sombra u otro tipo de daño permitido por el sistema.\nLímite:\nUna misma criatura solo puede sufrir este daño una vez por ronda.\nDESCRIPCIÓN:\nNo basta con herirla. Quien toca su cuerpo también recibe aquello que la recubre."}, {"name": "Piel Gruesa", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura ignora parte del daño recibido.\nCUÁNDO: Cuando recibe daño.\nQUÉ HACE: Ignora 1 punto de daño de todas las fuentes.\nPuede comprarse varias veces.\nDESCRIPCIÓN:\nLa piel, carne, placas o estructura de la criatura absorben golpes menores antes de que lleguen a algo importante."}, {"name": "Piel Resbaladiza", "cost": 1, "costText": "1 PR", "category": "4. Rasgos Defensivos", "text": "La criatura está cubierta de mucosa, aceite, escamas lisas, barro, grasa, piel flexible o una sustancia que dificulta sujetarla.\nCUÁNDO: Cuando intenta evitar o escapar de una presa.\nQUÉ HACE: Tiene Ventaja en tiradas o Salvaciones para evitar o escapar de Apresar.\nDESCRIPCIÓN:\nAgarrarla es difícil. La presa se escurre entre dedos, garras, cadenas o tentáculos."}, {"name": "Recuperación Menor", "cost": 1, "costText": "1 PR", "category": "4. Rasgos Defensivos", "text": "La criatura puede recuperar fuerzas si dedica su acción a ello.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Recupera 1d6 de Resistencia.\nLa recuperación no puede superar su Resistencia máxima.\nDESCRIPCIÓN:\nLa criatura se recompone, respira, se cierra, se ordena o activa una reserva interna."}, {"name": "Recuperación", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura puede recuperarse de forma más eficaz.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Recupera 2d6 + 1 de Resistencia.\nLa recuperación no puede superar su Resistencia máxima.\nDESCRIPCIÓN:\nLa criatura dedica un momento completo a restaurar su cuerpo, núcleo o energía vital."}, {"name": "Recuperación Mayor", "cost": 3, "costText": "3 PR", "category": "4. Rasgos Defensivos", "text": "La criatura posee una reserva profunda de recuperación.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Recupera 3d6 + 1 de Resistencia.\nLa recuperación no puede superar su Resistencia máxima.\nDESCRIPCIÓN:\nEl cuerpo de la criatura vuelve a cerrarse con una fuerza difícil de ignorar."}, {"name": "Regeneración Menor", "cost": 1, "costText": "1 PR", "category": "4. Rasgos Defensivos", "text": "La criatura recupera daño de forma pasiva.\nCUÁNDO: Al inicio de su turno.\nQUÉ HACE: Recupera 3 de Resistencia.\nLa recuperación no puede superar su Resistencia máxima.\nRestricción recomendada:\nEl Diseñador puede definir un tipo de daño o condición que detenga esta regeneración hasta el inicio del próximo turno de la criatura.\nDESCRIPCIÓN:\nLa criatura se repara sin detenerse. Carne, madera, metal vivo, sombra o energía vuelven a su sitio."}, {"name": "Regeneración Mayor", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura se regenera con rapidez.\nCUÁNDO: Al inicio de su turno.\nQUÉ HACE: Recupera 5 de Resistencia.\nLa recuperación no puede superar su Resistencia máxima.\nRestricción recomendada:\nEl Diseñador puede definir un tipo de daño o condición que detenga esta regeneración hasta el inicio del próximo turno de la criatura.\nDESCRIPCIÓN:\nLas heridas no permanecen abiertas mucho tiempo. El cuerpo insiste en volver a su forma."}, {"name": "Resistencia a Críticos", "cost": 3, "costText": "3 PR", "category": "4. Rasgos Defensivos", "text": "La criatura posee cuerpo amorfo, protección interna, anatomía redundante, órganos dispersos o una estructura que vuelve inútiles los golpes precisos.\nCUÁNDO: Cuando recibe un golpe crítico.\nQUÉ HACE: El golpe crítico se resuelve como un golpe normal.\nNo hace daño máximo por superar Defensa, ni daño mínimo especial si no supera Defensa, ni ignora reducción, resistencia, inmunidad o absorción de daño.\nAdemás, la criatura tiene Ventaja en tiradas o Salvaciones para evitar o escapar de Apresar si su cuerpo es líquido, gelatinoso, gaseoso, disperso o amorfo.\nDESCRIPCIÓN:\nLa criatura no tiene puntos vitales claros o sus partes importantes no están donde deberían. Golpear “bien” no sirve tanto como contra un cuerpo común."}, {"name": "Resistente", "cost": 1, "costText": "1 PR", "category": "4. Rasgos Defensivos", "text": "La criatura resiste un tipo de daño específico.\nCUÁNDO: Cuando recibe daño del tipo elegido.\nQUÉ HACE: Gana Resistencia a ese tipo de daño.\nRestricción:\nEl tipo de daño debe definirse al crear la criatura.\nDESCRIPCIÓN:\nEse tipo de daño le afecta menos de lo normal. Su cuerpo, energía o naturaleza lo soportan mejor."}, {"name": "Resistencia Física", "cost": 3, "costText": "3 PR", "category": "4. Rasgos Defensivos", "text": "La criatura posee piel, placas, masa, escamas, hueso externo, cuerpo mineral, cuerpo artificial o constitución capaz de soportar daño físico común.\nCUÁNDO: Cuando recibe daño Contundente, Cortante o Penetrante.\nQUÉ HACE: Gana Resistencia contra los tres tipos de daño físico: Contundente, Cortante y Penetrante.\nDESCRIPCIÓN:\nGolpes, cortes y perforaciones comunes pierden fuerza contra su cuerpo."}, {"name": "Memoria de Dolor", "cost": 2, "costText": "2 PR", "category": "4. Rasgos Defensivos", "text": "La criatura aprende rápidamente de aquello que la hiere.\nCUÁNDO: Después de recibir daño de una criatura enemiga.\nQUÉ HACE: Hasta el inicio del próximo turno de la criatura, obtiene +1 a Defensa contra ataques realizados por esa misma criatura enemiga.\nLímite:\nSolo puede beneficiarse de este rasgo contra una criatura enemiga a la vez. Si recibe daño de otra fuente, puede cambiar el objetivo de este rasgo.\nDESCRIPCIÓN:\nLa criatura recuerda el ángulo del golpe, el olor del atacante o la forma del dolor. La próxima vez se protege mejor.\n5. Rasgos de Movimiento y Terreno\nEstos rasgos modifican la forma en que una criatura se desplaza por el mundo.\nPueden representar alas, aletas, patas especializadas, cuerpo serpentino, desplazamiento sobrenatural, extremidades adhesivas, túneles, flotación, nado, salto, vuelo, cuerpo amorfo o cualquier adaptación que cambie su relación con el terreno.\nUn rasgo de movimiento debe indicar qué tipo de desplazamiento permite, cuándo funciona y qué limitaciones tiene."}, {"name": "Velocidad Mejorada", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura se mueve más rápido que otras criaturas de su tamaño y ND.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Su movimiento aumenta en 3 metros.\nPuede comprarse varias veces.\nDESCRIPCIÓN:\nLa criatura corre, repta, salta, rueda o se desplaza con una velocidad superior a la esperada."}, {"name": "Trepador", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura está adaptada para trepar mediante garras, ventosas, patas adhesivas, cuerpo segmentado, cola, fuerza corporal o técnica natural.\nCUÁNDO: Siempre activa.\nQUÉ HACE: La criatura puede trepar superficies verticales a su velocidad normal de movimiento, siempre que exista algún tipo de apoyo físico.\nNo puede trepar superficies completamente lisas, pulidas o imposibles de sujetar salvo que posea otro rasgo que lo permita.\nDESCRIPCIÓN:\nLa criatura no necesita escaleras ni caminos. Usa garras, patas, ventosas, cola o fuerza para subir donde otros se detienen."}, {"name": "Caminar por los Muros", "cost": 2, "costText": "2 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura puede desplazarse por muros, techos y superficies verticales sin necesidad de usar las manos.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Puede moverse por superficies verticales y techos a su velocidad normal.\nPuede detenerse en esas superficies sin caer mientras esté consciente y no esté Inmovilizada, Aturdida o Inconsciente.\nRestricción:\nDebe tener una justificación clara: patas adhesivas, ventosas, garras microscópicas, magia, control gravitatorio, cuerpo arácnido, mucosa adherente o equivalente.\nDESCRIPCIÓN:\nEl suelo no es su única superficie. La criatura se mueve por paredes y techos como si fueran camino."}, {"name": "Nadador", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura está adaptada para desplazarse en agua.\nCUÁNDO: Mientras se mueve en agua, ríos, lagos, mares, pantanos profundos u otro medio líquido apropiado.\nQUÉ HACE: La criatura puede nadar a su velocidad normal y no sufre penalizadores normales por moverse en agua.\nEste rasgo no permite respirar bajo el agua. Para eso se requiere Anfibio u otro rasgo equivalente.\nDESCRIPCIÓN:\nEl agua no la frena. Su cuerpo corta la corriente, flota, ondula o se impulsa con naturalidad."}, {"name": "Anfibio", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura puede vivir y actuar tanto en aire como bajo el agua.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Puede respirar aire y agua. Además, puede hablar, atacar y actuar bajo el agua sin penalizadores derivados de la respiración.\nEste rasgo no otorga velocidad de nado por sí mismo. Si la criatura nada con especial eficacia, debe comprar Nadador.\nDESCRIPCIÓN:\nLa criatura no pertenece solo a un medio. Puede respirar y actuar en agua o aire sin cambiar de cuerpo."}, {"name": "Excavador", "cost": 2, "costText": "2 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura puede desplazarse excavando tierra, arena, barro, nieve compacta o material blando.\nCUÁNDO: Durante su movimiento.\nQUÉ HACE: Puede excavar y desplazarse bajo tierra blanda a la mitad de su velocidad normal.\nNo puede atravesar piedra sólida, metal, madera trabajada, muros, pisos reforzados ni superficies selladas, salvo que otro rasgo o Técnica lo permita.\nCierre:\nSi el terreno no puede excavarse, este rasgo no puede usarse.\nDESCRIPCIÓN:\nLa criatura no solo camina sobre el suelo. Puede abrirse paso por debajo de él."}, {"name": "Excavador Superior", "cost": 3, "costText": "3 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura está hecha para moverse bajo la tierra con gran eficacia.\nCUÁNDO: Durante su movimiento.\nQUÉ HACE: Puede excavar y desplazarse bajo tierra blanda a su velocidad normal.\nAdemás, puede atravesar piedra natural no trabajada a la mitad de su velocidad normal.\nNo puede atravesar metal, muros reforzados, pisos encantados, estructuras selladas ni materiales imposibles de perforar sin una Técnica o rasgo específico.\nDESCRIPCIÓN:\nLa tierra es otro camino. La criatura cava con fuerza suficiente para entrar, salir y cambiar de posición sin quedar atrapada."}, {"name": "Planeo", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura posee alas pequeñas, membranas, piel extendida, plumas, aletas o una forma corporal que le permite caer lentamente y desplazarse por el aire sin volar de forma sostenida.\nCUÁNDO: Cuando cae desde una altura o se lanza desde una posición elevada.\nQUÉ HACE: Puede desplazarse hasta 6 metros horizontales por cada 3 metros de caída.\nAdemás, reduce a la mitad el daño por caída.\nEste rasgo no permite ganar altura ni mantenerse en el aire indefinidamente.\nDESCRIPCIÓN:\nLa criatura no vuela, pero tampoco cae como un cuerpo común. Abre membranas, plumas, aletas o piel extendida y transforma la caída en avance."}, {"name": "Vuelo", "cost": 2, "costText": "2 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura puede volar de forma sostenida.\nCUÁNDO: Durante su movimiento.\nQUÉ HACE: Obtiene velocidad de vuelo igual a su velocidad terrestre.\nPuede elevarse, descender y mantenerse en el aire mientras pueda mover sus alas, flotar o sostener el mecanismo de vuelo definido.\nCierre:\nSi queda Inmovilizada, Aturdida, Inconsciente, Derribada en el aire o pierde el mecanismo que le permite volar, cae.\nDESCRIPCIÓN:\nLa criatura no depende del suelo. Alas, gas, magia, viento, espíritu o fuerza propia la mantienen en el aire."}, {"name": "Vuelo Superior", "cost": 3, "costText": "3 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura vuela con gran velocidad y control.\nCUÁNDO: Durante su movimiento.\nQUÉ HACE: Obtiene velocidad de vuelo igual a su velocidad terrestre +6 metros.\nAdemás, tiene Ventaja en tiradas para maniobrar en el aire, evitar caídas, mantenerse estable con viento o realizar movimientos aéreos complejos.\nPrerequisito:\nVuelo.\nDESCRIPCIÓN:\nLa criatura no solo vuela. Domina el aire, cambia de dirección, gana altura y corrige el movimiento con precisión."}, {"name": "Salto Potente", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura posee patas fuertes, tendones elásticos, musculatura explosiva, cola impulsora o una estructura corporal diseñada para saltar.\nCUÁNDO: Cuando salta.\nQUÉ HACE: Duplica la distancia que puede saltar.\nAdemás, tiene Ventaja en tiradas relacionadas con saltos largos, saltos altos o caídas controladas.\nDESCRIPCIÓN:\nLa criatura usa el salto como forma de avance, escape, emboscada o desplazamiento vertical."}, {"name": "Movimiento Acuático", "cost": 2, "costText": "2 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura no solo nada: domina el movimiento bajo el agua.\nCUÁNDO: Mientras está bajo el agua.\nQUÉ HACE: Obtiene +3 metros de movimiento mientras nada y tiene Ventaja en tiradas para maniobrar, perseguir, escapar o luchar contra corrientes.\nPrerequisito:\nNadador.\nDESCRIPCIÓN:\nEl agua es su terreno favorable. Gira, acelera, se esconde y persigue con una soltura que otros cuerpos no tienen."}, {"name": "Cuerpo Serpentino", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura se desplaza mediante ondulación, reptación, arrastre o torsión corporal.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Tiene Ventaja en tiradas para moverse por espacios estrechos, arrastrarse, deslizarse bajo obstáculos o evitar ser Derribada.\nRestricción:\nEste rasgo no permite pasar por aberturas imposibles para su masa. Para deformarse y atravesar rendijas, usa Cuerpo Amorfo.\nDESCRIPCIÓN:\nEl cuerpo de la criatura se dobla y desliza donde otros cuerpos tropiezan."}, {"name": "Cuerpo Amorfo", "cost": 2, "costText": "2 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura posee un cuerpo líquido, gelatinoso, gaseoso, blando, disperso, flexible o capaz de deformarse sin una estructura rígida clara.\nCUÁNDO: Siempre activa.\nQUÉ HACE: La criatura puede pasar por aberturas estrechas, grietas, barrotes separados, rendijas o espacios reducidos por donde una criatura de su tamaño normalmente no podría pasar, siempre que exista espacio suficiente para que su masa atraviese lentamente.\nAdemás, tiene Ventaja en tiradas o Salvaciones para evitar o escapar de Apresar.\nRestricción:\nEste rasgo no permite atravesar muros sólidos, puertas cerradas, barreras herméticas ni superficies sin abertura.\nCierre:\nSi la criatura está congelada, solidificada, petrificada, contenida en un recipiente hermético o afectada por un efecto que impida deformar su cuerpo, no puede beneficiarse de este rasgo mientras dure esa condición.\nDESCRIPCIÓN:\nEl cuerpo de la criatura no conserva una forma fija. Se comprime, estira, filtra o derrama por espacios imposibles para huesos y carne común."}, {"name": "Paso Etéreo", "cost": 3, "costText": "3 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura puede moverse brevemente a través de cuerpos, obstáculos delgados o materia parcialmente permeable.\nCUÁNDO: Durante su movimiento.\nQUÉ HACE: Una vez por turno, puede atravesar hasta 3 metros de materia sólida no sellada mágicamente.\nNo puede terminar su movimiento dentro de un objeto, muro, criatura o superficie sólida.\nSi no tiene espacio libre al final del movimiento, retrocede hasta el último espacio válido.\nRestricción:\nDebe tener una justificación sobrenatural clara: cuerpo espiritual, fase, sombra, distorsión espacial, niebla viva o equivalente.\nDESCRIPCIÓN:\nPor un instante, la criatura deja de obedecer del todo a la materia."}, {"name": "Paso de Maleza", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura está adaptada a moverse entre plantas, raíces, ramas bajas, lianas, arbustos, hongos altos o vegetación cerrada.\nCUÁNDO: Mientras se mueve por Terreno Difícil causado por vegetación natural.\nQUÉ HACE: La criatura ignora la reducción de movimiento causada por ese terreno.\nAdemás, no sufre el −1 a Defensa por estar parada sobre ese terreno.\nRestricción:\nNo funciona contra escombros, hielo, barro profundo, arena suelta, ruinas, terreno artificial ni Terreno Peligroso, salvo que el peligro provenga solo de vegetación no dañina.\nDESCRIPCIÓN:\nLa criatura se abre paso entre ramas y raíces sin perder equilibrio. Su cuerpo está hecho para ese entorno."}, {"name": "Paso de Roca", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura está adaptada a moverse por piedra irregular, pendientes, grava, riscos, escombros naturales, cavernas o terreno montañoso.\nCUÁNDO: Mientras se mueve por Terreno Difícil causado por roca, piedra, grava, escombros naturales o pendientes irregulares.\nQUÉ HACE: La criatura ignora la reducción de movimiento causada por ese terreno.\nAdemás, no sufre el −1 a Defensa por estar parada sobre ese terreno.\nRestricción:\nNo permite trepar muros verticales por sí mismo. Para eso se requiere Trepador, Caminar por los Muros u otro rasgo equivalente.\nDESCRIPCIÓN:\nPatas anchas, garras duras, equilibrio bajo o simple costumbre de montaña le permiten avanzar donde otros resbalan."}, {"name": "Paso de Barro", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura está adaptada a pantanos, ciénagas, lodo, fango, turba, orillas blandas o suelos saturados de agua.\nCUÁNDO: Mientras se mueve por Terreno Difícil causado por barro, lodo, pantano, fango o suelo blando.\nQUÉ HACE: La criatura ignora la reducción de movimiento causada por ese terreno.\nAdemás, no sufre el −1 a Defensa por estar parada sobre ese terreno.\nRestricción:\nNo permite ignorar venenos, ácido, gases, agua profunda ni otros peligros del terreno. Si el barro también es Terreno Peligroso, solo ignora la parte de Terreno Difícil.\nDESCRIPCIÓN:\nSus patas, cuerpo bajo, membranas, peso distribuido o costumbre de pantano impiden que se hunda como lo haría otra criatura."}, {"name": "Paso de Arena", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura está adaptada a dunas, arena suelta, polvo profundo, grava fina, ceniza blanda o suelos que ceden bajo el peso.\nCUÁNDO: Mientras se mueve por Terreno Difícil causado por arena, polvo, ceniza o suelo suelto similar.\nQUÉ HACE: La criatura ignora la reducción de movimiento causada por ese terreno.\nAdemás, no sufre el −1 a Defensa por estar parada sobre ese terreno.\nRestricción:\nNo protege contra calor, asfixia, tormentas de arena, ceniza ardiente ni Terreno Peligroso.\nDESCRIPCIÓN:\nLa criatura reparte su peso, se desliza, hunde poco las patas o avanza con movimientos cortos y precisos."}, {"name": "Paso de Hielo", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura está adaptada a hielo, nieve dura, nieve profunda, escarcha, suelo resbaladizo o superficies congeladas.\nCUÁNDO: Mientras se mueve por Terreno Difícil causado por hielo, nieve, escarcha o superficies congeladas.\nQUÉ HACE: La criatura ignora la reducción de movimiento causada por ese terreno.\nAdemás, no sufre el −1 a Defensa por estar parada sobre ese terreno.\nRestricción:\nNo otorga Resistencia al daño de Hielo ni protege contra frío extremo. Si el hielo causa daño o se considera Terreno Peligroso, solo ignora la parte de Terreno Difícil.\nDESCRIPCIÓN:\nGarras finas, almohadillas rugosas, peso ligero o equilibrio natural le permiten moverse sobre hielo sin perder estabilidad."}, {"name": "Paso Seguro", "cost": 2, "costText": "2 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura está especialmente adaptada a moverse por casi cualquier terreno complicado.\nCUÁNDO: Mientras se mueve o permanece sobre Terreno Difícil.\nQUÉ HACE: La criatura ignora todo Terreno Difícil, sin importar si proviene de vegetación, roca, barro, arena, nieve, escombros, suelo irregular u obstáculos naturales o artificiales.\nAdemás, no sufre el −1 a Defensa por estar parada sobre Terreno Difícil.\nRestricción:\nEste rasgo no permite ignorar Terreno Peligroso. Si el terreno es peligroso, la criatura sigue recibiendo el daño o efecto correspondiente, aunque ignora la reducción de movimiento y el −1 a Defensa derivados de su parte de Terreno Difícil.\nDESCRIPCIÓN:\nNo importa si el suelo se hunde, corta, resbala o se rompe. La criatura encuentra apoyo, ritmo y salida."}, {"name": "Inmunidad al Terreno Peligroso", "cost": 3, "costText": "3 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura está adaptada a un tipo específico de terreno hostil.\nCUÁNDO: Mientras se mueve o permanece dentro del Terreno Peligroso o Terreno Difícil elegido.\nQUÉ HACE: Elige un tipo de terreno al crear la criatura: fuego, hielo, ácido, veneno, electricidad, espinas, sombra, radiación, corrupción, vegetación dañina, pantano tóxico, roca cortante u otro peligro concreto.\nLa criatura no recibe daño ni efectos negativos de ese tipo específico de Terreno Peligroso.\nAdemás, ignora la reducción de movimiento y el −1 a Defensa causados por el Terreno Difícil de ese mismo entorno o sustancia.\nRestricción:\nSolo funciona contra el tipo de terreno elegido. No protege contra otros peligros ni contra ataques directos del mismo tipo de daño, salvo que la criatura tenga otro rasgo de Resistencia, Inmunidad o Absorción.\nDESCRIPCIÓN:\nLa criatura nació, fue creada o se adaptó para caminar sobre aquello que mataría a otras. Fuego, ácido, hielo, corrupción o espinas no son obstáculo: son su suelo natural."}, {"name": "Instinto de Retirada", "cost": 1, "costText": "1 PR", "category": "5. Rasgos de Movimiento y Terreno", "text": "La criatura sabe retirarse cuando queda expuesta.\nCUÁNDO: Cuando queda por debajo de la mitad de su Resistencia máxima.\nQUÉ HACE: Una vez por combate, puede moverse 3 metros como Reacción sin provocar Ataques de Oportunidad.\nRestricción:\nNo puede usar este rasgo si está Inmovilizada, Apresada, Aturdida, Inconsciente o si no puede moverse.\nDESCRIPCIÓN:\nCuando el daño se acumula, el cuerpo de la criatura busca distancia antes de pensar.\n6. Rasgos de Aura y Percepción\nEstos rasgos representan sentidos especiales, presencia sobrenatural, campos de energía, emanaciones corporales, percepción avanzada o efectos pasivos que alteran el entorno cercano.\nUn rasgo de Aura y Percepción debe indicar:\nQué detecta o modifica.\nEn qué radio funciona.\nCuándo se activa.\nSi requiere Salvación.\nCuánto dura el efecto.\nCómo termina o bajo qué condiciones deja de funcionar.\nLas auras deben usarse con cuidado. Un efecto que afecta a muchas criaturas cada turno puede ralentizar la mesa si no está bien delimitado."}, {"name": "Aura Antimagia", "cost": 4, "costText": "4 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura emite un campo que perturba Técnicas, energía primigenia, conjuros, sellos o manifestaciones sobrenaturales.\nCUÁNDO: Cuando una criatura dentro de 12 metros intenta usar una Técnica.\nQUÉ HACE: La criatura que intenta usar la Técnica debe superar una Salvación de Aura contra ND 10 o la Técnica falla y no produce efecto.\nEl coste de Resistencia de la Técnica se paga igualmente.\nLímite:\nUna misma criatura solo puede ser afectada por esta aura una vez por turno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente.\nDESCRIPCIÓN:\nEl aire alrededor de la criatura se vuelve pesado. Las Técnicas se rompen antes de tomar forma, como si el mundo rechazara obedecerlas."}, {"name": "Aura de Lentitud", "cost": 2, "costText": "2 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La presencia de la criatura vuelve torpe el movimiento de sus enemigos.\nCUÁNDO: Siempre activa mientras la criatura esté consciente.\nQUÉ HACE: El área en un radio de 6 metros alrededor de la criatura cuenta como Terreno Difícil para sus enemigos.\nLos aliados de la criatura no se ven afectados.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente.\nDESCRIPCIÓN:\nEl suelo se vuelve pesado, el aire se espesa o la voluntad se arrastra. Quienes intentan acercarse sienten que cada paso cuesta más de lo normal."}, {"name": "Aura de Miedo", "cost": 3, "costText": "3 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura proyecta terror, autoridad depredadora, presión espiritual o presencia monstruosa.\nCUÁNDO: Cuando una criatura enemiga comienza su turno a 6 metros o menos de la criatura.\nQUÉ HACE: El objetivo debe superar una Salvación de Aura contra ND 10 o queda Asustado hasta el final de su turno.\nUna criatura que supere la Salvación no vuelve a ser afectada por esta aura hasta el inicio de su próximo turno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente.\nDESCRIPCIÓN:\nNo hace falta que grite. Su sola cercanía empuja al cuerpo a retroceder."}, {"name": "Aura Elemental", "cost": 2, "costText": "2 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura irradia fuego, hielo, electricidad, corrosión, sombra, luz hiriente u otro elemento dañino.\nCUÁNDO: Al inicio del turno de la criatura.\nQUÉ HACE: Todas las criaturas a 3 metros o menos sufren 1d6 de daño del tipo elegido al crear la criatura.\nRestricción:\nEl tipo de daño debe definirse al crear la criatura.\nLímite:\nUna criatura solo puede recibir daño de esta aura una vez por ronda.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente.\nDESCRIPCIÓN:\nEstar cerca de la criatura es peligroso. Su cuerpo quema, congela, corroe, descarga o pudre el aire a su alrededor."}, {"name": "Aura Inmovilizadora", "cost": 3, "costText": "3 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La presencia de la criatura dificulta el movimiento de quienes se acercan.\nCUÁNDO: Cuando una criatura enemiga comienza su turno a 3 metros o menos.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o queda Inmovilizado hasta el final de su turno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente.\nDESCRIPCIÓN:\nEl aire se espesa, las piernas se hunden, raíces invisibles se cierran o la presión del cuerpo enemigo vuelve pesado cada paso."}, {"name": "Aura Paralizante", "cost": 4, "costText": "4 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura emite una presión corporal, descarga, toxina aérea, campo nervioso o fuerza sobrenatural que bloquea el cuerpo de los enemigos cercanos.\nCUÁNDO: Cuando una criatura enemiga comienza su turno a 3 metros o menos.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o queda Aturdido hasta el final de su turno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nLímite:\nUna misma criatura solo puede ser afectada por esta aura una vez por ronda.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente.\nDESCRIPCIÓN:\nEl cuerpo no responde. Los músculos se traban, los nervios fallan y durante un instante la víctima queda atrapada dentro de su propia carne."}, {"name": "Aura Venenosa", "cost": 3, "costText": "3 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura emite gas, esporas, vapor químico, aliento contaminado, podredumbre o toxinas que envenenan a quienes permanecen demasiado cerca.\nCUÁNDO: Cuando una criatura enemiga comienza su turno a 3 metros o menos.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o queda Envenenado.\nMientras esté Envenenado por esta aura, sufre 1d6 de daño Corrosivo al inicio de su turno. Al final de cada uno de sus turnos puede repetir la Salvación. Si tiene éxito, el efecto termina.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nLímite:\nUna criatura puede sufrir más de una instancia de veneno a la vez solo si provienen de fuentes diferentes. Dos exposiciones a la misma Aura Venenosa no crean instancias separadas.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente o si el mecanismo tóxico queda neutralizado.\nDESCRIPCIÓN:\nRespirar cerca de la criatura es un error. La garganta arde, la piel suda frío y la sangre empieza a pelear contra sí misma."}, {"name": "Aura Encantadora", "cost": 3, "costText": "3 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura proyecta belleza antinatural, canto, feromonas inteligentes, calma sobrenatural, presencia hipnótica, autoridad emocional o presión espiritual.\nCUÁNDO: Cuando una criatura enemiga comienza su turno a 6 metros o menos y puede percibir el mecanismo del encanto.\nQUÉ HACE: El objetivo debe superar una Salvación de Aura contra ND 10 o queda Fascinado hasta el final de su turno.\nMientras esté Fascinado por esta aura, el objetivo tiene Desventaja en ataques contra la criatura que emite el aura y no puede alejarse voluntariamente de ella, salvo que hacerlo sea necesario para evitar daño evidente e inmediato.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente, si el objetivo deja de percibir el mecanismo del encanto o si la criatura daña directamente al objetivo.\nDESCRIPCIÓN:\nHay algo en ella que llama. No ordena, no domina, pero tira de la atención como un anzuelo suave."}, {"name": "Aroma Embriagador", "cost": 2, "costText": "2 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura emite un olor dulce, almizcle, perfume, vapor floral, feromona, resina, aliento químico o aroma narcótico que altera el cuerpo de quienes se acercan.\nCUÁNDO: Cuando una criatura comienza su turno a 3 metros o menos y puede oler o percibir el aroma.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o sufre −1 a sus tiradas de ataque y Percepción hasta el final de su turno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nCierre:\nUna criatura que no respire, que sea inmune a venenos, que no pueda percibir olores o que esté protegida contra gases no se ve afectada, salvo que el mecanismo definido no dependa del olfato.\nDESCRIPCIÓN:\nEl olor no enamora ni domina. Afloja el cuerpo, nubla los reflejos y deja la atención un segundo atrás."}, {"name": "Olor Nauseabundo", "cost": 1, "costText": "1 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura emite hedor, putrefacción, gas, almizcle, vapor químico o una secreción que entorpece a quienes se acercan.\nCUÁNDO: Cuando una criatura comienza su turno a 3 metros o menos.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o sufre Desventaja en su próxima tirada de ataque antes del final de su turno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nCierre:\nUna criatura que no respire, que sea inmune a venenos o que no pueda percibir olores no se ve afectada, salvo que el mecanismo definido no dependa del olfato.\nDESCRIPCIÓN:\nEl cuerpo rechaza acercarse. Los ojos llor
