<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Creador de Criaturas PAPA</title>
  <meta name="description" content="Sistema de creación y diseño de criaturas para el juego de rol PAPA, según las reglas oficiales." />
  <meta property="og:title" content="Creador de Criaturas PAPA" />
  <meta property="og:description" content="Sistema de creación y diseño de criaturas para el juego de rol PAPA, según las reglas oficiales." />
  <style>
    :root {
      --bg: #13100d;
      --panel: #1e1813;
      --panel2: #2a221b;
      --field: #120e0b;
      --line: #453629;
      --line-light: #5a4735;
      --ink: #f5ece1;
      --muted: #b8a692;
      --muted-dark: #8a7866;
      --accent: #c4823f;
      --accent2: #e2b067;
      --good: #6fa067;
      --bad: #c25e5e;
      --blue: #7aa5c7;
      --radius: 10px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background-color: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }

    /* Top Navigation Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(19, 16, 13, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: 12px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }

    .header-brand h1 {
      font-size: 19px;
      font-weight: 700;
      margin: 0;
      letter-spacing: 0.02em;
      color: var(--accent2);
    }

    .header-brand .sub {
      color: var(--muted);
      font-size: 12px;
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Buttons */
    .btn {
      background: var(--accent);
      color: #1a120b;
      border: 1px solid var(--accent2);
      border-radius: 6px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s ease, opacity 0.15s ease;
      white-space: nowrap;
    }
    .btn:hover {
      background: var(--accent2);
    }
    .btn.secondary {
      background: var(--panel2);
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .btn.secondary:hover {
      background: #362c22;
      border-color: var(--line-light);
    }
    .btn.danger {
      background: rgba(194, 94, 94, 0.15);
      color: #e58787;
      border: 1px solid rgba(194, 94, 94, 0.35);
    }
    .btn.danger:hover {
      background: var(--bad);
      color: #fff;
    }
    .btn-sm {
      padding: 4px 9px;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      background: var(--panel2);
      color: var(--ink);
      border: 1px solid var(--line);
      font-weight: 600;
      transition: all 0.15s ease;
    }
    .btn-sm:hover {
      background: var(--line);
      border-color: var(--accent);
    }
    .btn-sm.danger {
      background: rgba(194, 94, 94, 0.15);
      color: #e58787;
      border: 1px solid rgba(194, 94, 94, 0.3);
    }
    .btn-sm.danger:hover {
      background: var(--bad);
      color: #fff;
    }

    /* Inputs and Selects */
    input, select, textarea {
      width: 100%;
      background: var(--field);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 8px 11px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(196, 130, 63, 0.2);
    }
    textarea {
      resize: vertical;
      min-height: 64px;
      line-height: 1.45;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Layout Columns */
    .wrap {
      display: grid;
      grid-template-columns: 210px minmax(0, 1fr) 390px;
      gap: 16px;
      padding: 16px;
      max-width: 1720px;
      margin: 0 auto;
      align-items: start;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .card-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      background: rgba(26, 21, 16, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: var(--accent2);
    }

    .inner {
      padding: 16px;
    }

    /* Step Navigation (Left Panel) */
    .nav {
      position: sticky;
      top: 75px;
    }
    .nav button {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      margin-bottom: 3px;
    }
    .nav button:hover {
      background: var(--panel2);
      color: var(--ink);
    }
    .nav button.active {
      background: var(--panel2);
      color: var(--accent2);
      border-left: 3px solid var(--accent);
      padding-left: 9px;
    }

    /* Live Summary (Right Panel) */
    .summary {
      position: sticky;
      top: 75px;
      max-height: calc(100vh - 95px);
      overflow-y: auto;
    }

    .summary-section {
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
      margin-bottom: 12px;
    }
    .summary-section:last-child {
      border-bottom: none;
      padding-bottom: 0;
      margin-bottom: 0;
    }
    .summary-title {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
    }
    .summary-subtitle {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      margin-bottom: 5px;
    }

    /* Stat boxes */
    .statbox {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
    }
    .stat {
      text-align: center;
      padding: 4px;
    }
    .stat b {
      display: block;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.15;
    }
    .stat span {
      display: block;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      color: var(--muted);
      margin-top: 3px;
    }

    /* Grids */
    .grid2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .grid3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .grid4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Field Card Containers */
    .field-card {
      background: var(--panel);
      border-radius: 8px;
    }
    .field-card h3 {
      margin: 0 0 4px 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--accent2);
    }
    .field-card h4 {
      margin: 14px 0 6px 0;
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }

    /* Attribute Rows */
    .attr-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 6px;
      margin-bottom: 6px;
    }
    .attr-title strong {
      font-size: 15px;
      display: block;
    }
    .attr-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .attr-val {
      font-size: 18px;
      font-weight: 700;
      min-width: 24px;
      text-align: center;
    }
    .attr-cost {
      min-width: 100px;
      text-align: right;
    }

    /* Item Cards in Lists */
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .item-card {
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 10px 12px;
      transition: border-color 0.15s ease;
    }
    .item-card:hover {
      border-color: var(--line-light);
    }
    .item-card.selected {
      border-color: var(--accent);
      background: rgba(196, 130, 63, 0.05);
    }
    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .item-header strong {
      font-size: 14px;
      color: var(--ink);
    }
    .item-text {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
      white-space: pre-line;
      line-height: 1.4;
    }

    /* Checklist Cards */
    .check-pass {
      border-left: 3px solid var(--good);
    }
    .check-fail {
      border-left: 3px solid var(--bad);
      background: rgba(194, 94, 94, 0.06);
    }

    /* Badges */
    .badge {
      display: inline-block;
      padding: 2px 7px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--accent2);
      white-space: nowrap;
    }
    .badge.good {
      background: rgba(111, 160, 103, 0.15);
      border-color: rgba(111, 160, 103, 0.4);
      color: #9cd494;
    }
    .badge.bad {
      background: rgba(194, 94, 94, 0.15);
      border-color: rgba(194, 94, 94, 0.4);
      color: #e58787;
    }

    /* Helpers */
    .mini { font-size: 12px; }
    .muted { color: var(--muted); }
    .text-good { color: var(--good); }
    .text-bad { color: var(--bad); }
    .hr {
      height: 1px;
      background: var(--line);
      margin: 14px 0;
    }
    .hidden { display: none !important; }
    .exportBox {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12.5px;
      min-height: 400px;
      white-space: pre;
    }
    .mini-info {
      background: var(--field);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 12px;
    }
    .mini-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12.5px;
    }

    /* Sections show/hide */
    .section { display: none; }
    .section.active { display: block; }

    /* Responsive adjustments */
    @media (max-width: 1260px) {
      .wrap {
        grid-template-columns: 1fr 370px;
      }
      .nav {
        grid-column: span 2;
        position: static;
      }
      .nav .inner {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        padding: 10px 14px;
      }
      .nav button {
        width: auto;
        padding: 6px 12px;
        border-left: none;
        border-bottom: 2px solid transparent;
        margin-bottom: 0;
      }
      .nav button.active {
        border-left: none;
        border-bottom-color: var(--accent);
        padding-left: 12px;
      }
    }

    @media (max-width: 860px) {
      .wrap {
        grid-template-columns: 1fr;
      }
      .nav {
        grid-column: span 1;
      }
      .summary {
        position: static;
        max-height: none;
      }
      .grid2, .grid3, .grid4 {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <!-- Global App Header -->
  <header>
    <div class="header-brand">
      <h1 id="appTitle">Creador de Criaturas PAPA</h1>
      <div class="sub">Diseño técnico oficial: ND 1/8 a 15, Atributos, Bandas de Movimiento, Rasgos, Desventajas y Conjuros</div>
    </div>
    <div class="header-actions">
      <select id="presetSel" class="btn secondary" style="width: auto; padding: 6px 10px; font-size: 12px;" title="Cargar un monstruo o criatura prediseñada">
        <option value="">▼ Cargar Ejemplo...</option>
        <option value="lobo">Lobo de Cueva (ND 1)</option>
        <option value="golem">Gólem de Granito (ND 4)</option>
        <option value="piromante">Sacerdote Ígneo (ND 3)</option>
      </select>
      <button class="btn secondary" id="saveJson" title="Descarga la criatura en formato JSON para continuar más tarde">Guardar JSON</button>
      <button class="btn secondary" id="loadJsonBtn" title="Cargar archivo JSON previo">Cargar JSON</button>
      <input type="file" id="loadJson" accept=".json" class="hidden" />
      <button class="btn secondary" id="resetBtn" title="Crear una nueva criatura con todos los parámetros en blanco" style="font-weight:600;">+ Nuevo</button>
    </div>
  </header>

  <!-- Main 3-Column Workspace -->
  <div class="wrap">
    <!-- Left Navigation: Steps -->
    <aside class="card nav">
      <div class="card-header">
        <h2>Pasos de Creación</h2>
      </div>
      <div class="inner" id="nav"></div>
    </aside>

    <!-- Center Workspace: Active Section Form -->
    <main class="card">
      <div class="card-header">
        <h2 id="sectionTitle">1. Identidad</h2>
      </div>
      <div class="inner" id="sections"></div>
    </main>

    <!-- Right Column: Live Sheet and Budget Summary -->
    <aside class="card summary">
      <div class="card-header">
        <h2>Ficha en Tiempo Real</h2>
      </div>
      <div class="inner">
        <div class="statbox" id="quickStats" style="margin-bottom: 14px;"></div>
        <div id="summary"></div>
      </div>
    </aside>
  </div>

  <!-- Master Data & Application Script -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
