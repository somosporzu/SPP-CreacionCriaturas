const state={name:'',identity:'',description:'',role:'',notes:'',nd:'1',size:'Mediano',baseMove:6,type:'Bestia',tag:'',heritage:'',nature:'',behavior:'Sin comportamiento especial',typeAbility:'',customTypeAbility:{name:'',text:''},concepts:'',attrDelta:{Cuerpo:0,Destreza:0,Aura:0},selectedTraits:[],customTraits:[],selectedDisadvantages:[],customDisadvantages:[],equipment:[],customEquipment:[],manualAttacks:[],techniques:[],manualTechniques:[]};
const ATTRIBUTE_MANAGED_TRAITS=new Set(['Mejora de Atributo','Deficiencia de Atributo']);
DATA.traits=DATA.traits.filter(t=>!ATTRIBUTE_MANAGED_TRAITS.has(t.name));
function cloneState(obj){Object.assign(state,obj); for(const k of ['attrDelta']) state[k]=Object.assign({Cuerpo:0,Destreza:0,Aura:0},state[k]||{}); for(const k of ['selectedTraits','customTraits','selectedDisadvantages','customDisadvantages','equipment','customEquipment','manualAttacks','techniques','manualTechniques']) state[k]=Array.isArray(state[k])?state[k]:[]; state.selectedTraits=state.selectedTraits.filter(t=>!ATTRIBUTE_MANAGED_TRAITS.has(t.name));}
function ndObj(){const row=DATA.ndTable.find(x=>String(x[0])===String(state.nd))||DATA.ndTable.find(x=>String(x[0])==='1')||DATA.ndTable[0]||['1',26,8,2,'1d6',2,0]; return {nd:row[0],res:Number(row[1])||0,def:Number(row[2])||0,attr:Number(row[3])||0,damage:row[4]||'1d6',pr:Number(row[5])||0,pc:Number(row[6])||0};}
function opt(vals,sel){return vals.map(v=>`<option value="${esc(v)}" ${String(v)===String(sel)?'selected':''}>${esc(v)}</option>`).join('')}
function costNum(cost){let m=String(cost||'').match(/\d+/); return m?Number(m[0]):0}
function traitMod(name,q=1){let m={res:0,def:0,mov:0,pc:0,pr:0,notes:[]}; const add=(k,v)=>m[k]+=v*q;
 if(name==='Vitalidad Aumentada') add('res',10); if(name==='Afinidad con Técnicas') add('pc',5); if(name==='Criatura Superior'){add('res',15);add('def',1);add('pc',5)} if(name==='Armadura Natural') add('def',1); if(name==='Escudo Incorporado') add('def',1); if(name==='Piel Gruesa') m.notes.push(`Piel Gruesa x${q}: ignora ${q} punto(s) de daño si se interpreta acumulable.`); if(name==='Velocidad Mejorada') add('mov',3); if(name==='Canalización Eficiente') m.notes.push('Canalización Eficiente: reduce en 1 el coste de Resistencia de Técnicas, mínimo 1.'); if(name==='Canalización Superior') m.notes.push('Canalización Superior: reduce en 2 el coste de Resistencia de Técnicas, mínimo 1.'); if(name==='Potencia de Salvación') m.notes.push(`Potencia de Salvación x${q}: ND de rasgos aplicables ${q>=2?'14':'12'}.`); return m;}
function disadvantageMod(name,q=1){let m={res:0,def:0,mov:0,pc:0,halfRes:false,noReactions:false,notes:[]}; const add=(k,v)=>m[k]+=v*q;
 if(name==='Movimiento Lento') add('mov',-3); if(name==='Fragilidad Física') add('res',-10); if(name==='Defensa Deficiente') add('def',-2); if(name==='Cuerpo Quebradizo') add('res',-20); if(name==='Defensa Abierta') add('def',-3); if(name==='Criatura Menor'){m.halfRes=true; add('def',-1); add('mov',-3); m.noReactions=true;} if(name==='Sin Reacción') m.noReactions=true; if(name==='Canalización Costosa') m.notes.push('Canalización Costosa: aumenta en 1 el coste de Técnicas.'); if(name==='Canalización Agotadora') m.notes.push('Canalización Agotadora: aumenta en 2 el coste de Técnicas.'); return m;}
function calc(){const base=ndObj(), size=DATA.sizes[state.size]||[0,0], beh=DATA.behaviors[state.behavior]||DATA.behaviors['Sin comportamiento especial']; let C=base.attr+num(state.attrDelta.Cuerpo),D=base.attr+num(state.attrDelta.Destreza),A=base.attr+num(state.attrDelta.Aura); let res=base.res+size[0]+(beh.res||0),def=base.def+size[1]+(beh.def||0),mov=num(state.baseMove)+(beh.mov||0),pc=base.pc+(beh.pc||0),prTotal=base.pr; let prSpent=0,prGain=0,notes=[beh.note].filter(Boolean),noReactions=false,halfRes=false;
 for(const [k,v] of Object.entries(state.attrDelta)){ if(v>0) prSpent+=v*2; if(v<0) prGain+=Math.abs(v); }
 for(const st of state.selectedTraits){let q=num(st.qty)||1,t=DATA.traits.find(x=>x.name===st.name); if(!t) continue; prSpent+=(t.cost>0?t.cost:0)*q; let tm=traitMod(st.name,q); res+=tm.res;def+=tm.def;mov+=tm.mov;pc+=tm.pc;prTotal+=tm.pr;notes.push(...tm.notes)}
 for(const ct of state.customTraits){let q=num(ct.qty)||1; prSpent+=num(ct.cost)*q; C+=num(ct.C)*q;D+=num(ct.D)*q;A+=num(ct.A)*q;res+=num(ct.res)*q;def+=num(ct.def)*q;mov+=num(ct.mov)*q;pc+=num(ct.pc)*q;}
 for(const sd of state.selectedDisadvantages){let q=num(sd.qty)||1,d=DATA.disadvantages.find(x=>x.name===sd.name); if(!d) continue; prGain+=num(d.pr)*q; let dm=disadvantageMod(sd.name,q); res+=dm.res;def+=dm.def;mov+=dm.mov;pc+=dm.pc; if(dm.halfRes) halfRes=true; if(dm.noReactions) noReactions=true; notes.push(...dm.notes)}
 for(const cd of state.customDisadvantages){let q=num(cd.qty)||1; prGain+=num(cd.pr)*q; C+=num(cd.C)*q;D+=num(cd.D)*q;A+=num(cd.A)*q;res+=num(cd.res)*q;def+=num(cd.def)*q;mov+=num(cd.mov)*q;pc+=num(cd.pc)*q; if(cd.noReactions) noReactions=true;}
 for(const eq of state.equipment){let e=DATA.equipment.find(x=>x.name===eq.name); if(e){def+=num(e.defense);}}
 for(const ce of state.customEquipment){def+=num(ce.def); C+=num(ce.C); D+=num(ce.D); A+=num(ce.A); res+=num(ce.res); mov+=num(ce.mov); pc+=num(ce.pc);}
 if(halfRes) res=Math.floor(res/2); res=Math.max(5,Math.floor(res)); def=Math.min(16,Math.floor(def)); mov=Math.max(3,Math.floor(mov)); prTotal+=prGain; const techUsed=[...state.techniques,...state.manualTechniques].reduce((a,t)=>a+num(t.pc),0); return {base,C,D,A,res,def,mov,pc,pcRemaining:pc-techUsed,prTotal,prSpent,prGain,prRemaining:prTotal-prSpent,notes,noReactions,techUsed};}
function saveField(path,value){let parts=path.split('.'),o=state; while(parts.length>1)o=o[parts.shift()]; o[parts[0]]=value; refresh(false)}

ma.">${esc(state.concepts)}</textarea></section>

function bindStaticEvents(){document.querySelectorAll('[data-bind]').forEach(el=>{el.oninput=()=>saveField(el.dataset.bind,el.value)}); $('ndSel').onchange=e=>{state.nd=e.target.value; refresh(false)}; $('sizeSel').onchange=e=>{state.size=e.target.value; refresh(false)}; $('baseMove').oninput=e=>saveField('baseMove',Number(e.target.value)); $('typeSel').onchange=e=>{state.type=e.target.value; state.typeAbility=''; renderTypeAbility(); refresh(false)}; $('natureSel').onchange=e=>{state.nature=e.target.value; renderNatureInfo(); refresh(false)}; $('behaviorSel').onchange=e=>{state.behavior=e.target.value; buildSections(); switchSection('base')}; $('typeAbilitySel').onchange=e=>{state.typeAbility=e.target.value; renderTypeAbility(); refresh(false)}; $('traitSearch').oninput=renderTraitList; $('traitCat').onchange=renderTraitList; $('disSearch').oninput=renderDisList; $('disCat').onchange=renderDisList; $('eqSearch').oninput=renderEquipmentList; $('eqCat').onchange=renderEquipmentList; $('techSearch').oninput=renderTechList; $('techLevel').onchange=renderTechList; $('exportMode').onchange=()=>refresh(false); $('copyText').onclick=copyExport; $('downloadTxt').onclick=downloadTxt;}

function renderEquipmentList(){let cat=$('eqCat')?.value||'', search=($('eqSearch')?.value||'').toLowerCase(); if($('customEqBox')){$('customEqBox').classList.toggle('hidden',cat!=='__custom__');$('eqCatalogBox').classList.toggle('hidden',cat==='__custom__')} if(cat==='__custom__'){bindCustomButtons();return;} let arr=DATA.equipment.filter(e=>(!cat||e.type===cat)&&(!search||(e.name+e.type+e.notes).toLowerCase().includes(search))).slice(0,300); $('eqList').innerHTML=arr.map(e=>`<div class="item"><div class="row" style="justify-content:space-between"><strong>${esc(e.name)}</strong><span class="badge">${esc(e.type)}</span></div><small>${[e.cost,e.damage,e.dmgType,e.defense?`Def +${e.defense}`:''].filter(Boolean).join(' · ')}</small><div class="txt">${esc(e.notes||'')}</div><button class="btn tiny" data-add-eq="${esc(e.name)}">Añadir</button></div>`).join('')||'<p class="muted">Sin resultados.</p>'; bindCustomButtons();}
function renderTechList(){let lvl=$('techLevel')?.value||'', search=($('techSearch')?.value||'').toLowerCase(); if($('manualTechBox')){$('manualTechBox').classList.toggle('hidden',lvl!=='__manual__');$('techCatalogBox').classList.toggle('hidden',lvl==='__manual__')} if(lvl==='__manual__'){bindCustomButtons();return;} let arr=DATA.techniquesCatalog.filter(t=>(lvl===''||String(t.level)===String(lvl))&&(!search||(t.name+t.type+t.force+t.effect+t.req).toLowerCase().includes(search))); $('techList').innerHTML=arr.map(t=>`<div class="item"><div class="row" style="justify-content:space-between"><strong>${esc(t.name)}</strong><span class="badge">Nivel ${t.level} · ${esc(t.cost)}</span></div><small>${esc(t.type)} · ${esc(t.force)}</small><div class="txt">${esc(t.effect)}</div><button class="btn tiny" data-add-tech="${esc(t.name)}">Añadir</button></div>`).join('')||'<p class="muted">Sin resultados.</p>'; bindCustomButtons();}
function bindCustomButtons(){ if($('addCustomTrait')) $('addCustomTrait').onclick=()=>{if(!$('ctName').value.trim())return; state.customTraits.push({id:uid(),name:$('ctName').value.trim(),cost:num($('ctCost').value),text:$('ctText').value,qty:1,C:num($('ctC').value),D:num($('ctD').value),A:num($('ctA').value),res:num($('ctRes').value),def:num($('ctDef').value),mov:num($('ctMov').value),pc:num($('ctPC').value)}); ['ctName','ctText'].forEach(id=>$(id).value=''); refresh(false)}; if($('addCustomDis')) $('addCustomDis').onclick=()=>{if(!$('cdName').value.trim())return; state.customDisadvantages.push({id:uid(),name:$('cdName').value.trim(),pr:num($('cdPR').value),text:$('cdText').value,qty:1,C:num($('cdC').value),D:num($('cdD').value),A:num($('cdA').value),res:num($('cdRes').value),def:num($('cdDef').value),mov:num($('cdMov').value),pc:num($('cdPC').value),noReactions:$('cdNoReact').checked}); ['cdName','cdText'].forEach(id=>$(id).value=''); refresh(false)}; if($('addCustomEq')) $('addCustomEq').onclick=()=>{if(!$('ceName').value.trim())return; state.customEquipment.push({id:uid(),name:$('ceName').value.trim(),type:$('ceType').value,damage:$('ceDamage').value,dmgType:$('ceDmgType').value,def:num($('ceDef').value),C:num($('ceC').value),D:num($('ceD').value),A:num($('ceA').value),res:num($('ceRes').value),mov:num($('ceMov').value),pc:num($('cePC').value),notes:$('ceNotes').value}); ['ceName','ceType','ceDamage','ceDmgType','ceNotes'].forEach(id=>$(id).value=''); refresh(false)}; if($('addManualAttack')) $('addManualAttack').onclick=()=>{if(!$('atkName').value.trim())return; state.manualAttacks.push({id:uid(),name:$('atkName').value.trim(),attr:$('atkAttr').value,range:$('atkRange').value,damage:$('atkDamage').value,type:$('atkType').value,effect:$('atkEffect').value}); ['atkName','atkDamage','atkType','atkEffect'].forEach(id=>$(id).value=''); refresh(false)}; if($('addManualTech')) $('addManualTech').onclick=()=>{if(!$('mtName').value.trim())return; state.manualTechniques.push({id:uid(),name:$('mtName').value.trim(),cost:$('mtCost').value,action:$('mtAction').value,force:$('mtForce').value,pc:num($('mtPC').value),range:$('mtRange').value,save:$('mtSave').value,effect:$('mtEffect').value,duration:$('mtDuration').value,close:$('mtClose').value}); ['mtName','mtCost','mtForce','mtRange','mtSave','mtEffect','mtDuration','mtClose'].forEach(id=>$(id).value=''); refresh(false)}; }
function addBuilt(type,name){ if(type==='trait')state.selectedTraits.push({id:uid(),name,qty:1,note:''}); if(type==='dis')state.selectedDisadvantages.push({id:uid(),name,qty:1,note:''}); if(type==='eq')state.equipment.push({id:uid(),name,note:''}); if(type==='tech'){let t=DATA.techniquesCatalog.find(x=>x.name===name); state.techniques.push({id:uid(),name,level:t.level,cost:t.cost,action:t.when,force:t.force,pc:t.level===0?1:t.level===1?2:4,range:'',save:'',effect:t.effect,duration:'',close:'',req:t.req});} refresh(false);}
function allAttacks(){const c=calc(); let attacks=[{id:'base',name:'Golpe',attr:'Cuerpo',range:'cuerpo a cuerpo',damage:c.base.damage,type:'Contundente',effect:'Ataque básico generado por el ND.'}]; for(const x of state.equipment){let e=DATA.equipment.find(z=>z.name===x.name); if(e && /arma/i.test(e.type)) attacks.push({id:'eq'+x.id,name:e.name,attr:'Cuerpo o Destreza',range:'según arma',damage:e.damage||c.base.damage,type:e.dmgType||'según arma',effect:e.notes||'Arma del catálogo.'});} for(const x of state.customEquipment){if(/arma/i.test(x.type)) attacks.push({id:'ce'+x.id,name:x.name,attr:'Cuerpo o Destreza',range:'según arma',damage:x.damage||c.base.damage,type:x.dmgType||'según arma',effect:x.notes||'Arma personalizada.'});} return attacks.concat(state.manualAttacks);}
function renderStats(){let c=calc(); $('quickStats').innerHTML=`<div class="stat"><b>${c.res}</b><span>Resistencia</span></div><div class="stat"><b>${c.def}</b><span>Defensa</span></div><div class="stat"><b>${c.mov}</b><span>Movimiento</span></div><div class="stat"><b>${c.C}</b><span>Cuerpo</span></div><div class="stat"><b>${c.D}</b><span>Destreza</span></div><div class="stat"><b>${c.A}</b><span>Aura</span></div><div class="stat"><b class="${c.prRemaining<0?'bad':'ok'}">${c.prRemaining}</b><span>PR restantes</span></div><div class="stat"><b class="${c.pcRemaining<0?'bad':'ok'}">${c.pcRemaining}</b><span>PC restantes</span></div><div class="stat"><b>${c.base.damage}</b><span>Daño Base</span></div>`; if($('attackList')) $('attackList').innerHTML=allAttacks().map(a=>`<div class="sel"><div class="top"><strong>${esc(a.name)}</strong>${a.id==='base'||String(a.id).startsWith('eq')||String(a.id).startsWith('ce')?'<span class="badge">automático</span>':`<button class="btn tiny danger" data-del-manual-attack="${a.id}">Eliminar</button>`}</div><small>${esc(a.attr)} · ${esc(a.range)} · ${esc(a.damage)} · ${esc(a.type)}</small><small>${esc(a.effect||'')}</small></div>`).join('');}
function renderSummary(){let c=calc(); const ability=selectedAbilityText(); let html=`<div class="item"><strong>${esc(state.name||'Criatura sin nombre')}</strong><small>ND ${esc(state.nd)} · ${esc(state.type)}${state.tag?` (${esc(state.tag)})`:''} · ${esc(state.size)} · ${esc(state.nature||'sin Naturaleza')}</small></div>`; if(ability) html+=`<h3>Habilidad de Tipo</h3><div class="sel"><strong>${esc(ability.name)}</strong><small>${esc(ability.text)}</small></div>`; html+=`<h3>Rasgos a favor</h3>${selectedBlock('trait')}<h3>Desventajas</h3>${selectedBlock('dis')}<h3>Equipo</h3>${selectedBlock('eq')}<h3>Ataques</h3>${allAttacks().map(a=>`<div class="sel"><strong>${esc(a.name)}</strong><small>${esc(a.damage)} · ${esc(a.type)} · ${esc(a.range)}</small></div>`).join('')}<h3>Técnicas</h3>${selectedBlock('tech')}<h3>Notas automáticas</h3>${c.notes.length?c.notes.map(n=>`<div class="sel"><small>${esc(n)}</small></div>`).join(''):'<p class="muted mini">Sin notas automáticas.</p>'}`; $('liveSummary').innerHTML=html;}
function selectedBlock(kind){let arr=[]; if(kind==='trait') arr=[...state.selectedTraits.map(x=>({...x,custom:false})),...state.customTraits.map(x=>({...x,custom:true}))]; if(kind==='dis') arr=[...state.selectedDisadvantages.map(x=>({...x,custom:false})),...state.customDisadvantages.map(x=>({...x,custom:true}))]; if(kind==='eq') arr=[...state.equipment.map(x=>({...x,custom:false})),...state.customEquipment.map(x=>({...x,custom:true}))]; if(kind==='tech') arr=[...state.techniques.map(x=>({...x,custom:false})),...state.manualTechniques.map(x=>({...x,custom:true}))]; if(!arr.length)return '<p class="muted mini">Nada agregado.</p>'; return arr.map(x=>`<div class="sel"><div class="top"><div><strong>${esc(x.name)}</strong><small>${kind==='trait'?traitSmall(x):kind==='dis'?disSmall(x):kind==='eq'?eqSmall(x):techSmall(x)}</small></div><div class="row"><button class="btn tiny secondary" data-dup="${kind}:${x.id}">Duplicar</button><button class="btn tiny danger" data-del="${kind}:${x.id}">Eliminar</button></div></div>${kind==='trait'||kind==='dis'?`<label>Nota breve</label><input value="${esc(x.note||'')}" data-note="${kind}:${x.id}">`:''}</div>`).join('')}
function traitSmall(x){let t=DATA.traits.find(z=>z.name===x.name); return x.custom?`coste ${x.cost} PR${x.qty>1?` · x${x.qty}`:''}`:`${t?.costText||''}${x.qty>1?` · x${x.qty}`:''} · ${first(t?.text||'')}`}
function disSmall(x){let d=DATA.disadvantages.find(z=>z.name===x.name); return x.custom?`+${x.pr} PR${x.qty>1?` · x${x.qty}`:''}`:`+${d?.pr||0} PR${x.qty>1?` · x${x.qty}`:''} · ${first(d?.text||'')}`}
function eqSmall(x){let e=x.custom?x:DATA.equipment.find(z=>z.name===x.name)||{}; return [e.type,e.damage,e.dmgType,e.defense||e.def?`Def +${e.defense||e.def}`:'',e.notes||x.note].filter(Boolean).join(' · ')}
function techSmall(x){return x.custom?`${x.cost||'sin coste'} · PC ${x.pc||0}`:`Nivel ${x.level} · ${x.cost} · PC ${x.pc}`}
function selectedAbilityText(){if(state.typeAbility==='__custom__')return {name:state.customTypeAbility.name||'Habilidad personalizada',text:state.customTypeAbility.text||''}; let a=(DATA.typeAbilities[state.type]||[]).find(x=>x[0]===state.typeAbility); return a?{name:a[0],text:a[1]}:null;}
function traitLines(){return state.selectedTraits.map(x=>{let t=DATA.traits.find(z=>z.name===x.name); return `- ${x.name}${x.qty>1?` x${x.qty}`:''} (${t?.costText||'rasgo'}): ${x.note||first(t?.text||'')}`}).concat(state.customTraits.map(x=>`- ${x.name}${x.qty>1?` x${x.qty}`:''} (coste ${x.cost} PR): ${x.text||''}`));}
function disLines(){return state.selectedDisadvantages.map(x=>{let d=DATA.disadvantages.find(z=>z.name===x.name); return `- ${x.name}${x.qty>1?` x${x.qty}`:''} (+${d?.pr||0} PR): ${x.note||first(d?.text||'')}`}).concat(state.customDisadvantages.map(x=>`- ${x.name}${x.qty>1?` x${x.qty}`:''} (+${x.pr} PR): ${x.text||''}`));}
function eqLines(){return state.equipment.map(x=>{let e=DATA.equipment.find(z=>z.name===x.name)||{};return `- ${x.name}: ${eqSmall({...x,...e})}`}).concat(state.customEquipment.map(x=>`- ${x.name}: ${eqSmall({...x,custom:true})}`));}
function techLines(compact=false){return [...state.techniques,...state.manualTechniques].map(t=>compact?`- ${t.name}: Coste ${t.cost||'—'}, ${t.action||'Acción Principal'}, ${t.effect||'—'}.`:`### ${t.name}\n**Coste:** ${t.cost||'—'}\n**Acción:** ${t.action||'Acción Principal'}\n**Fuerza:** ${t.force||'—'}\n**Requisito:** ${t.req||'—'}\n**Efecto:** ${t.effect||'—'}\n**Duración:** ${t.duration||'—'}\n**Cierre:** ${t.close||'—'}`);}
function exportText(mode='complete'){let c=calc(), name=state.name||'[Nombre de la criatura]', identity=state.identity||`${name} es [clase de criatura] que [rasgo distintivo] y sirve como ${state.role||'[herramienta de juego]'}.`; let attacks=allAttacks(); if(mode==='bestiary') return [`## ${name}`,`**ND:** ${state.nd}`,`**Tipo:** ${state.type}${state.tag?` (${state.tag})`:''}`,state.heritage?`**Herencia:** ${state.heritage}`:'',`**Naturaleza:** ${state.nature||'—'}`,`**Comportamiento:** ${state.behavior}`,`**Tamaño:** ${state.size}`,`**Movimiento:** ${c.mov} m`,`**Resistencia:** ${c.res}`,`**Defensa:** ${c.def}`,`**Cuerpo:** ${c.C}  **Destreza:** ${c.D}  **Aura:** ${c.A}`,'','### Ataques',...attacks.map(a=>`- **${a.name}:** ${a.attr}, ${a.range}, ${a.damage}, ${a.type}. ${a.effect||''}`),'','### Técnicas',...(techLines(true).length?techLines(true):['- Ninguna.']),'','### Rasgos y pasivas',...(traitLines().length?traitLines():['- Ninguno.']),'','### Equipo',...(eqLines().length?eqLines():['- Ninguno.']),'','### Desventajas',...(disLines().length?disLines():['- Ninguna.']),'','### Nota de uso',state.notes||'—'].filter(Boolean).join('\n');
 return [`# ${name}`,'',`**Frase de identidad:** ${identity}`,state.description?`**Descripción:** ${state.description}`:'','',`## Datos generales`,`**ND:** ${state.nd}`,`**Tipo:** ${state.type}`,`**Etiqueta:** ${state.tag||'—'}`,`**Herencia:** ${state.heritage||'—'}`,`**Naturaleza:** ${state.nature||'—'}`,`**Comportamiento:** ${state.behavior}`,`**Tamaño:** ${state.size}`,`**Movimiento:** ${c.mov} m`,'',`## Estadísticas`,`**Resistencia base:** ${c.base.res}`,`**Resistencia final:** ${c.res}`,`**Defensa base:** ${c.base.def}`,`**Defensa final:** ${c.def}`,`**Cuerpo base:** ${c.base.attr}`,`**Cuerpo final:** ${c.C}`,`**Destreza base:** ${c.base.attr}`,`**Destreza final:** ${c.D}`,`**Aura base:** ${c.base.attr}`,`**Aura final:** ${c.A}`,`**Daño Base:** ${c.base.damage}`,'',`## Presupuesto`,`**PR totales:** ${c.prTotal}`,`**PR usados:** ${c.prSpent}`,`**PR restantes:** ${c.prRemaining}`,`**PC totales:** ${c.pc}`,`**PC usados:** ${c.techUsed}`,`**PC restantes:** ${c.pcRemaining}`,'',`## Habilidad de Tipo`,selectedAbilityText()?`- **${selectedAbilityText().name}:** ${selectedAbilityText().text}`:'- —','',`## Conceptos`,state.concepts||'—','',`## Rasgos a favor`,...(traitLines().length?traitLines():['- Ninguno.']),'',`## Desventajas`,...(disLines().length?disLines():['- Ninguna.']),'',`## Ataques`,...attacks.map(a=>`### ${a.name}\n**Tirada:** ${a.attr}\n**Alcance / Distancia:** ${a.range}\n**Daño:** ${a.damage}\n**Tipo de daño:** ${a.type}\n**Efecto:** ${a.effect||'—'}`),'',`## Técnicas`,...(techLines(false).length?techLines(false):['- Ninguna.']),'',`## Reacciones`,c.noReactions?'- No puede usar Reacciones.':'- Anotar Reacciones obtenidas por rasgos o Técnicas.','',`## Pasivas, auras e inicio/final de turno`,...(c.notes.length?c.notes.map(n=>`- ${n}`):['- Sin notas automáticas.']),'',`## Equipo`,...(eqLines().length?eqLines():['- Ninguno.']),'',`## Nota de uso`,state.notes||'—'].filter(Boolean).join('\n');}
function exportExplain(){let mode=$('exportMode')?.value||'complete'; if($('exportExplainTitle')) $('exportExplainTitle').textContent=mode==='complete'?'Ficha completa':'Ficha de bestiario'; if($('exportExplain')) $('exportExplain').textContent=mode==='complete'?'Formato de trabajo para Diseñadores. Incluye presupuesto de PR/PC, bases, ajustes y todos los elementos de revisión.':'Formato compacto para manuales, suplementos y bestiarios. Omite el proceso de diseño y deja solo lo necesario para dirigir la criatura.';}
function copyExport(){navigator.clipboard.writeText($('exportText').value)}
function downloadTxt(){let blob=new Blob([$('exportText').value],{type:'text/plain;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.name||'criatura_papa').replace(/\W+/g,'_')+'.txt';a.click();URL.revokeObjectURL(a.href)}
function downloadJSON(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(state.name||'criatura_papa')+'_proyecto.json';a.click();URL.revokeObjectURL(a.href)}
document.addEventListener('click',e=>{let nav=e.target.closest('.nav button'); if(nav){switchSection(nav.dataset.sec);return} let b=e.target.closest('button'); if(!b)return; if(b.dataset.addTrait)addBuilt('trait',b.dataset.addTrait); if(b.dataset.addDis)addBuilt('dis',b.dataset.addDis); if(b.dataset.addEq)addBuilt('eq',b.dataset.addEq); if(b.dataset.addTech)addBuilt('tech',b.dataset.addTech); if(b.dataset.del){let [kind,id]=b.dataset.del.split(':'); let map={trait:['selectedTraits','customTraits'],dis:['selectedDisadvantages','customDisadvantages'],eq:['equipment','customEquipment'],tech:['techniques','manualTechniques']}; for(const arr of map[kind]) state[arr]=state[arr].filter(x=>x.id!==id); refresh(false)} if(b.dataset.dup){let [kind,id]=b.dataset.dup.split(':'); let map={trait:['selectedTraits','customTraits'],dis:['selectedDisadvantages','customDisadvantages'],eq:['equipment','customEquipment'],tech:['techniques','manualTechniques']}; for(const arrName of map[kind]){let arr=state[arrName], x=arr.find(y=>y.id===id); if(x){arr.push({...x,id:uid()});break}} refresh(false)} if(b.dataset.delManualAttack){state.manualAttacks=state.manualAttacks.filter(x=>x.id!==b.dataset.delManualAttack); refresh(false)}});
document.addEventListener('input',e=>{let n=e.target.dataset.note; if(n){let [kind,id]=n.split(':'); let arrs=kind==='trait'?['selectedTraits','customTraits']:['selectedDisadvantages','customDisadvantages']; for(const arrName of arrs){let x=state[arrName].find(y=>y.id===id); if(x){x.note=e.target.value;break}} refresh(false)}});
$('saveJson').onclick=downloadJSON; $('loadJsonBtn').onclick=()=>$('loadJson').click(); $('loadJson').onchange=e=>{let f=e.target.files[0]; if(!f)return; let r=new FileReader(); r.onload=()=>{try{cloneState(JSON.parse(r.result)); rebuild()}catch(err){alert('JSON inválido')}}; r.readAsText(f)};
function init(){buildNav(); buildSections(); renderTraitList();renderDisList();renderEquipmentList();renderTechList();refresh(false); exportExplain();}
init();
</script>
</body>
</html>
