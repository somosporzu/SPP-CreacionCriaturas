an, la garganta se cierra y el golpe sale mal."}, {"name": "Camuflaje", "cost": 1, "costText": "1 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura posee coloración, textura, postura o hábitos que la ayudan a mezclarse con su entorno.\nCUÁNDO: Cuando realiza una tirada de Sigilo en un entorno donde su cuerpo pueda confundirse con el fondo.\nQUÉ HACE: Obtiene +1 a esa tirada de Sigilo.\nRestricción:\nDebe definirse el entorno o mecanismo del camuflaje al crear la criatura: bosque, roca, nieve, arena, sombra, coral, barro, ruinas, corteza, vegetación u otro equivalente.\nDESCRIPCIÓN:\nNo desaparece. Su cuerpo solo sabe parecer parte del lugar."}, {"name": "Mimetismo", "cost": 2, "costText": "2 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura puede confundirse con el entorno de forma mucho más precisa que una criatura común.\nCUÁNDO: Cuando realiza una tirada de Sigilo en un entorno donde su cuerpo pueda imitar el fondo.\nQUÉ HACE: Tiene Ventaja en esa tirada de Sigilo.\nRestricción:\nDebe definirse el entorno o mecanismo del mimetismo al crear la criatura.\nCierre:\nEl beneficio puede perderse si la criatura se mueve de forma brusca, ataca, usa una Técnica visible, emite luz, hace ruido evidente o queda expuesta por un cambio del entorno.\nDESCRIPCIÓN:\nLa piel copia la piedra, las escamas rompen la silueta, el pelaje se vuelve maleza o el cuerpo aprende a parecer una sombra quieta."}, {"name": "Sigilo Superior", "cost": 3, "costText": "3 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura está hecha para desaparecer antes de atacar, huir o acechar.\nCUÁNDO: Cuando realiza una tirada de Sigilo.\nQUÉ HACE: Tiene Ventaja en la tirada y además obtiene +1 al resultado.\nRestricción:\nDebe tener una justificación clara: anatomía silenciosa, control de respiración, entrenamiento, cuerpo ligero, piel absorbente de sonido, instinto depredador, sombras naturales o magia de ocultamiento.\nDESCRIPCIÓN:\nNo solo se oculta bien. Se mueve como si el mundo hiciera menos ruido alrededor de ella."}, {"name": "Percepción Sísmica", "cost": 1, "costText": "1 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura detecta vibraciones a través del suelo.\nCUÁNDO: Siempre activa mientras la criatura esté en contacto con el suelo o una superficie capaz de transmitir vibraciones.\nQUÉ HACE: Siente la ubicación de criaturas en contacto con la misma superficie dentro de 12 metros.\nEste rasgo no revela detalles visuales, identidad, color, expresiones, escritura ni objetos que no produzcan vibración suficiente.\nCierre:\nNo funciona contra criaturas voladoras, suspendidas, incorpóreas o separadas de la superficie que transmite las vibraciones.\nDESCRIPCIÓN:\nNo necesita ver pasos. Los siente en la tierra, la piedra o la madera bajo su cuerpo."}, {"name": "Sentido Ciego", "cost": 2, "costText": "2 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura percibe su entorno sin depender de la vista.\nCUÁNDO: Siempre activa.\nQUÉ HACE: La criatura puede percibir criaturas, obstáculos y movimiento dentro de 12 metros sin usar los ojos.\nNo puede ser Cegada dentro de ese radio por efectos que solo anulen la vista.\nRestricción:\nDebe definirse el mecanismo: ecolocalización, vibración, calor, presión del aire, olor, percepción espiritual, humedad, electricidad u otro sentido equivalente.\nCierre:\nSi el mecanismo sensorial es anulado, el rasgo deja de funcionar mientras dure esa condición.\nDESCRIPCIÓN:\nLa criatura ve con otra cosa: oído, piel, lengua, calor, huesos, electricidad o espíritu."}, {"name": "Sentido del Peligro", "cost": 2, "costText": "2 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura detecta amenazas antes de que el golpe caiga.\nCUÁNDO: Siempre activa mientras la criatura esté consciente.\nQUÉ HACE: No puede ser Sorprendida.\nAdemás, tiene Ventaja en tiradas para detectar emboscadas, trampas inmediatas o amenazas a punto de activarse.\nCierre:\nNo funciona si la criatura está Inconsciente, dormida, incapacitada o bajo un efecto que anule su percepción.\nDESCRIPCIÓN:\nAlgo en su cuerpo reacciona antes que su mente. Orejas, piel, instinto o alma se tensan justo antes del peligro."}, {"name": "Sentidos Agudos", "cost": 1, "costText": "1 PR", "category": "6. Rasgos de Aura y Percepción", "text": "Uno de los sentidos de la criatura está especialmente desarrollado.\nCUÁNDO: Cuando realiza tiradas de Percepción usando el sentido elegido.\nQUÉ HACE: Tiene Ventaja en esas tiradas.\nRestricción:\nEl sentido debe definirse al crear la criatura: vista, oído, olfato, tacto, gusto, percepción espiritual, percepción térmica u otro sentido concreto.\nDESCRIPCIÓN:\nLa criatura capta detalles que otras pasan por alto: respiraciones, olores viejos, calor bajo la piel, vibraciones o cambios mínimos de luz."}, {"name": "Visión en la Oscuridad", "cost": 1, "costText": "1 PR", "category": "6. Rasgos de Aura y Percepción", "text": "Los ojos de la criatura están adaptados a la falta de luz.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Puede ver en oscuridad total como si fuera penumbra, hasta 15 metros.\nNo distingue colores en oscuridad total, solo formas, contraste y movimiento.\nCierre:\nNo permite ver a través de muros, humo denso, niebla espesa, invisibilidad ni oscuridad sobrenatural que bloquee expresamente este rasgo.\nDESCRIPCIÓN:\nSus ojos beben la poca luz que queda. Donde otros tantean, ella distingue siluetas."}, {"name": "Visión Verdadera", "cost": 3, "costText": "3 PR", "category": "6. Rasgos de Aura y Percepción", "text": "La criatura percibe aquello que otros sentidos no pueden atravesar.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Puede ver criaturas invisibles y reconocer ilusiones visuales dentro de 15 metros.\nUna ilusión reconocida no desaparece, pero la criatura sabe que no es real.\nRestricción:\nEste rasgo afecta invisibilidad e ilusiones visuales. No revela mentiras, emociones, intenciones, criaturas ocultas por cobertura física ni efectos que no dependan de engaño visual.\nCierre:\nNo funciona si la criatura está Cegada por un efecto que anule también percepción sobrenatural, o si el efecto ilusorio indica expresamente que bloquea Visión Verdadera.\nDESCRIPCIÓN:\nLa criatura mira y el disfraz del mundo se agrieta. Lo falso sigue ahí, pero ya no engaña.\n7. Rasgos de Soporte\nEstos rasgos permiten que una criatura ayude a otras criaturas, mejore sus acciones, reparta protección, entregue Resistencia, invoque apoyo o mantenga con vida a sus aliados.\nUn rasgo de soporte debe indicar:\nQuién puede beneficiarse.\nEn qué distancia funciona.\nCuándo se activa.\nSi requiere Acción Principal, Acción Rápida o Reacción.\nCuánto dura.\nSi puede afectar varias veces al mismo objetivo."}, {"name": "Aura Curativa Menor", "cost": 1, "costText": "1 PR", "category": "7. Rasgos de Soporte", "text": "La criatura emite una presencia leve que ayuda a cerrar heridas menores.\nCUÁNDO: Al inicio del turno de cada aliado dentro de 3 metros.\nQUÉ HACE: El aliado recupera 2 puntos de Resistencia.\nLa recuperación no puede superar la Resistencia máxima del aliado.\nLímite:\nUna criatura solo puede beneficiarse de una Aura Curativa Menor por ronda.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente.\nDESCRIPCIÓN:\nCerca de la criatura, las heridas menores cierran, el pulso se estabiliza o la energía vital vuelve con lentitud."}, {"name": "Aura Curativa", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura emite energía vital, luz sanadora, esporas medicinales, calor interno o una presencia que sostiene a sus aliados.\nCUÁNDO: Al inicio del turno de cada aliado dentro de 6 metros.\nQUÉ HACE: El aliado recupera 1d6 de Resistencia.\nLa recuperación no puede superar la Resistencia máxima del aliado.\nLímite:\nUna criatura solo puede beneficiarse de una Aura Curativa por ronda.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente.\nDESCRIPCIÓN:\nCerca de la criatura, las heridas cierran con torpeza, la respiración vuelve y el cuerpo recuerda cómo seguir de pie."}, {"name": "Escudo Viviente", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura puede interponerse para proteger a otra.\nCUÁNDO: Como Reacción, cuando un aliado adyacente recibe un ataque.\nQUÉ HACE: La criatura se convierte en el nuevo objetivo del ataque.\nDebe estar consciente y poder moverse o interponerse físicamente.\nLímite:\nRequiere gastar su Reacción.\nDESCRIPCIÓN:\nLa criatura se cruza entre el golpe y su aliado. Puede hacerlo con cuerpo, escudo, caparazón, alas, tentáculos o barrera propia."}, {"name": "Potenciador", "cost": 1, "costText": "1 PR", "category": "7. Rasgos de Soporte", "text": "La criatura guía, empuja, inspira, coordina o altera a un aliado cercano.\nCUÁNDO: En su turno, como Acción Rápida.\nQUÉ HACE: Un aliado visible a 6 metros o menos obtiene +1 a su próxima tirada antes del inicio del próximo turno de la criatura que otorgó el bono.\nSi el bono no se usa antes de ese momento, se pierde.\nDESCRIPCIÓN:\nLa criatura da una señal, abre una oportunidad, empuja el cuerpo correcto o marca el instante exacto para actuar."}, {"name": "Aura de Velocidad", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura acelera a sus aliados mediante gritos, feromonas, viento, ritmo, magia, señales o energía compartida.\nCUÁNDO: Siempre activa mientras la criatura esté consciente.\nQUÉ HACE: Los aliados dentro de 6 metros aumentan su movimiento en 3 metros.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente.\nDESCRIPCIÓN:\nLos aliados cercanos se mueven con un ritmo que no tendrían solos. El grupo avanza como si compartiera impulso."}, {"name": "Resucitador", "cost": 4, "costText": "4 PR", "category": "7. Rasgos de Soporte", "text": "La criatura puede levantar a un aliado recién caído mediante energía vital, necromancia, descarga, mandato espiritual, alquimia o reparación inmediata.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Elige un aliado a 3 metros o menos que haya sido reducido a 0 de Resistencia desde el final del último turno de la criatura.\nEse aliado recupera 1d6 de Resistencia y puede actuar normalmente en su próximo turno.\nLímite:\nUna vez por combate.\nRestricción:\nNo funciona si el cuerpo del aliado fue destruido, desintegrado, separado de su fuente vital o si el tipo de criatura no puede ser restaurado por el mecanismo definido.\nDESCRIPCIÓN:\nLa criatura devuelve movimiento a lo que acaba de caer. No siempre es curación limpia; a veces es una orden, una descarga o una deuda con la muerte."}, {"name": "Amplificador de Fuerza", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura aumenta la fuerza de sus aliados mediante aura, canto, feromonas, grito de guerra, energía compartida o coordinación.\nCUÁNDO: En su turno, como Acción Rápida.\nQUÉ HACE: Un aliado visible a 6 metros o menos inflige +1d6 de daño en su próximo ataque antes del inicio del próximo turno de la criatura que otorgó el bono.\nSi el aliado no ataca antes de ese momento, el bono se pierde.\nLímite:\nUna misma criatura solo puede beneficiarse de un Amplificador de Fuerza a la vez.\nDESCRIPCIÓN:\nEl golpe del aliado cae con más peso porque la criatura lo empuja, lo carga de poder o le da la apertura correcta."}, {"name": "Barrera Compartida", "cost": 3, "costText": "3 PR", "category": "7. Rasgos de Soporte", "text": "La criatura proyecta una protección sobre sus aliados cercanos.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: La criatura y todos los aliados dentro de 6 metros obtienen +1 a Defensa hasta el inicio del próximo turno de la criatura.\nLa Defensa final de una criatura no puede superar 16.\nCierre:\nEl efecto termina antes si la criatura cae Inconsciente.\nDESCRIPCIÓN:\nUna barrera, formación, sombra, canto, escudo común o impulso protector cubre al grupo durante unos segundos."}, {"name": "Invocar Refuerzos", "cost": 3, "costText": "3 PR", "category": "7. Rasgos de Soporte", "text": "La criatura puede llamar, crear, vomitar, liberar o convocar criaturas menores.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Invoca o llama hasta 2 criaturas de ND 1/4 o menor en espacios libres a 6 metros o menos.\nLas criaturas invocadas actúan después del turno de la criatura que las invocó.\nDuración:\nDuran 3 rondas o hasta ser reducidas a 0 de Resistencia.\nLímite:\nUna vez por combate.\nRestricción:\nEl tipo de criatura invocada debe definirse al crear la criatura.\nDESCRIPCIÓN:\nLa criatura no combate sola. Llama crías, larvas, sombras, drones, espíritus menores, cadáveres o servidores ligados a su cuerpo."}, {"name": "Transferencia de Resistencia", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura puede entregar parte de su propia Resistencia a un aliado.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: La criatura pierde hasta 10 puntos de Resistencia. Un aliado a 3 metros o menos recupera la misma cantidad.\nLa criatura no puede reducirse a 0 de Resistencia mediante este rasgo.\nLa recuperación del aliado no puede superar su Resistencia máxima.\nDESCRIPCIÓN:\nLa criatura entrega carne, sangre, energía, piezas, savia, luz o fuerza vital. Lo que uno recupera, el otro lo pierde."}, {"name": "Comando Instintivo", "cost": 1, "costText": "1 PR", "category": "7. Rasgos de Soporte", "text": "La criatura coordina a otras mediante gestos, feromonas, chillidos, mirada, señales, vibraciones o vínculo de grupo.\nCUÁNDO: En su turno, como Acción Rápida.\nQUÉ HACE: Un aliado visible o detectable a 6 metros o menos puede moverse 3 metros inmediatamente.\nEste movimiento no provoca Ataques de Oportunidad.\nLímite:\nUna vez por ronda.\nDESCRIPCIÓN:\nUna señal corta basta para que otro cuerpo se aparte, avance o tome posición."}, {"name": "Guardaespaldas Natural", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura está diseñada o entrenada para proteger a otra criatura.\nCUÁNDO: Cuando un aliado a 3 metros o menos recibe daño.\nQUÉ HACE: Como Reacción, la criatura reduce ese daño en 1d6.\nLímite:\nRequiere gastar su Reacción.\nRestricción:\nDebe existir un mecanismo claro: interponerse, cubrir con caparazón, emitir barrera, absorber parte del golpe, desviar con tentáculos o proteger con escudo natural.\nDESCRIPCIÓN:\nLa criatura no toma todo el golpe, pero lo amortigua lo suficiente para que el aliado siga de pie."}, {"name": "Purga Menor", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura puede eliminar efectos dañinos menores de un aliado.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Elige un aliado a 3 metros o menos. Ese aliado puede repetir una Salvación contra un estado o efecto activo que permita Salvación para terminar.\nSi tiene éxito, el efecto termina.\nLímite:\nUna vez por ronda.\nRestricción:\nEl mecanismo debe definirse al crear la criatura: saliva curativa, luz, canto, hierbas, reparación, calor vital, limpieza espiritual, esporas medicinales u otro efecto equivalente.\nDESCRIPCIÓN:\nLa criatura no cura una herida: limpia aquello que mantiene al cuerpo atrapado."}, {"name": "Repartir Daño", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura puede compartir el daño recibido por un aliado cercano.\nCUÁNDO: Como Reacción, cuando un aliado a 3 metros o menos recibe daño.\nQUÉ HACE: La criatura reduce ese daño a la mitad, redondeando hacia abajo. Luego la criatura recibe la misma cantidad reducida.\nEjemplo: si el aliado recibiría 9 de daño, recibe 5 y la criatura recibe 4.\nLímite:\nRequiere gastar su Reacción.\nRestricción:\nLa criatura no puede reducir a 0 el daño recibido por el aliado mediante este rasgo. Si el daño original ya era 1, no puede usarlo.\nDESCRIPCIÓN:\nEl golpe se reparte entre cuerpos, vínculos, placas, sangre o energía compartida."}, {"name": "Vínculo de Manada", "cost": 1, "costText": "1 PR", "category": "7. Rasgos de Soporte", "text": "La criatura pelea mejor cuando actúa junto a otras de su grupo.\nCUÁNDO: Siempre activa mientras tenga al menos un aliado consciente a 3 metros o menos.\nQUÉ HACE: La criatura obtiene +1 a sus tiradas de ataque.\nCierre:\nEl beneficio termina si no hay aliados conscientes a 3 metros o menos.\nDESCRIPCIÓN:\nSola es peligrosa. En grupo, su cuerpo entiende mejor cuándo morder, empujar o cerrar el paso."}, {"name": "Marcar Presa", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura señala, expone, distrae o marca a un objetivo para que otros lo ataquen.\nCUÁNDO: En su turno, como Acción Rápida.\nQUÉ HACE: Elige una criatura enemiga visible a 6 metros o menos. Hasta el inicio del próximo turno de la criatura que marcó, el primer aliado que ataque a ese objetivo obtiene +1 a la tirada de ataque.\nLímite:\nSolo puede haber una presa marcada por esta criatura a la vez.\nDESCRIPCIÓN:\nLa criatura muestra dónde golpear. Puede hacerlo con una marca, rugido, olor, luz, gesto o apertura táctica."}, {"name": "Barrera de Paso", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura puede bloquear una zona cercana con cuerpo, escudo, energía, tentáculos, ramas, espinas o presencia protectora.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Elige un espacio de 3 metros adyacente a la criatura. Hasta el inicio de su próximo turno, ese espacio cuenta como Terreno Difícil para enemigos.\nSi un enemigo intenta atravesar ese espacio, debe superar una Salvación de Cuerpo contra ND 10 o su movimiento termina al entrar.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nCierre:\nEl efecto termina si la criatura se mueve, queda Inconsciente o no puede seguir bloqueando el paso.\nDESCRIPCIÓN:\nLa criatura convierte su presencia en una puerta cerrada. Pasar junto a ella exige fuerza, equilibrio o suerte."}, {"name": "Sacrificio Protector", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura puede destruir parte de sí misma o exponerse gravemente para salvar a otra.\nCUÁNDO: Como Reacción, cuando un aliado a 3 metros o menos sería reducido a 0 de Resistencia.\nQUÉ HACE: El aliado queda en 1 de Resistencia. La criatura que usa este rasgo recibe 2d6 de daño que no puede reducirse, resistirse ni absorberse.\nLímite:\nUna vez por combate.\nDESCRIPCIÓN:\nLa criatura paga el golpe con su propio cuerpo. Algo se rompe, se quema, se arranca o se entrega para que otro no caiga."}, {"name": "Reparador", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura puede reparar cuerpos artificiales, armaduras vivientes, constructos o criaturas mecánicas.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Elige una criatura Artificial, constructo, gólem, armadura viviente o criatura compatible a 3 metros o menos. El objetivo recupera 2d6 + 1 de Resistencia.\nLa recuperación no puede superar su Resistencia máxima.\nRestricción:\nSolo funciona sobre criaturas que puedan ser reparadas por el mecanismo definido al crear este rasgo.\nDESCRIPCIÓN:\nNo sana carne. Ajusta piezas, cierra placas, inyecta aceite, suelda grietas o devuelve energía a un núcleo."}, {"name": "Mandato Coordinado", "cost": 3, "costText": "3 PR", "category": "7. Rasgos de Soporte", "text": "La criatura coordina a varios aliados al mismo tiempo.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Hasta tres aliados visibles o detectables a 6 metros o menos pueden moverse 3 metros inmediatamente.\nEste movimiento no provoca Ataques de Oportunidad.\nLímite:\nUna vez por ronda.\nRestricción:\nDebe existir un mecanismo claro de coordinación: voz, feromonas, vínculo mental, señales visuales, vibraciones, tamborileo, canto, luz o control de enjambre.\nDESCRIPCIÓN:\nLa criatura mueve al grupo con una sola orden. No todos entienden el mando, pero los cuerpos correctos responden."}, {"name": "Aura Protectora", "cost": 2, "costText": "2 PR", "category": "7. Rasgos de Soporte", "text": "La criatura proyecta una presencia que ayuda a sus aliados a resistir amenazas concretas.\nCUÁNDO: Siempre activa mientras la criatura esté consciente.\nQUÉ HACE: Los aliados dentro de 6 metros tienen Ventaja en Salvaciones contra un tipo de amenaza elegido al crear la criatura.\nEjemplos: miedo, veneno, corrupción, fuego, hielo, efectos mentales, enfermedad, fatiga, control espiritual.\nRestricción:\nEl tipo de amenaza debe definirse al crear la criatura.\nCierre:\nEl aura deja de funcionar si la criatura queda Inconsciente.\nDESCRIPCIÓN:\nCerca de la criatura, sus aliados soportan mejor aquello contra lo que fue creada, bendecida o entrenada para resistir.\n8. Rasgos de Control de Terreno\nEstos rasgos permiten que una criatura altere el espacio cercano, bloquee movimiento, cree zonas peligrosas, fije enemigos, separe grupos o convierta el entorno en parte de su amenaza.\nUn rasgo de control de terreno debe indicar:\nDónde se coloca el efecto.\nQué área cubre.\nA quién afecta.\nCuándo se activa.\nCuánto dura.\nCómo termina.\nSi permite Salvación.\nSi distingue aliados de enemigos."}, {"name": "Zona Peligrosa", "cost": 2, "costText": "2 PR", "category": "8. Rasgos de Control de Terreno", "text": "La criatura crea o libera una zona dañina mediante fuego, hielo, ácido, veneno, electricidad, espinas, sombra, corrupción, raíces hirientes, vapor, cristales cortantes u otro mecanismo.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Designa un área de 3 metros de radio centrada en la criatura o en un punto visible a 12 metros o menos.\nCualquier criatura que entre en esa zona por primera vez en su turno o que inicie su turno dentro de ella sufre 1d6 de daño del tipo elegido al crear la criatura.\nDuración:\nLa zona dura hasta el inicio del próximo turno de la criatura.\nRestricción:\nEl tipo de daño y el mecanismo deben definirse al crear la criatura.\nLímite:\nUna criatura solo puede recibir daño de esta zona una vez por turno.\nDESCRIPCIÓN:\nLa criatura vuelve peligroso un trozo del campo. El suelo quema, corta, muerde, pudre o descarga a quien lo pisa."}, {"name": "Terreno Difícil", "cost": 2, "costText": "2 PR", "category": "8. Rasgos de Control de Terreno", "text": "La criatura altera el suelo mediante raíces, hielo, barro denso, piedras quebradas, huesos, telarañas, arena movediza, carne viva, escombros o energía que dificulta el paso.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Designa un área de 6 metros de radio centrada en la criatura o en un punto visible a 12 metros o menos.\nEl área se convierte en Terreno Difícil para sus enemigos.\nDuración:\nDura 3 rondas.\nCierre:\nEl efecto puede terminar antes si el terreno es destruido, disipado, quemado, congelado, limpiado o neutralizado por una acción, Técnica o condición adecuada definida por el Diseñador.\nDESCRIPCIÓN:\nEl campo deja de ser limpio. Cada paso cuesta más, cada giro pierde fuerza y la criatura que controla el terreno gana tiempo."}, {"name": "Ancla", "cost": 3, "costText": "3 PR", "category": "8. Rasgos de Control de Terreno", "text": "La criatura fija a un objetivo mediante garfios, raíces, sombra, gravedad, cadenas, tentáculos, hielo, saliva endurecida, magnetismo, mirada o presión espiritual.\nCUÁNDO: Como Acción Rápida, después de impactar a una criatura con un ataque durante su turno.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o no puede alejarse más de 3 metros de la criatura hasta el final de su próximo turno.\nEl objetivo puede acercarse, atacar, defenderse o moverse dentro del límite permitido, pero no puede aumentar la distancia más allá de 3 metros respecto de la criatura que lo ancló.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nCierre:\nEl efecto termina antes si la criatura que ancló cae Inconsciente, si el objetivo es movido fuera del alcance por una fuerza externa, o si se rompe el mecanismo físico o sobrenatural que lo mantiene fijado.\nDESCRIPCIÓN:\nLa criatura no deja ir a su presa. Algo tira, pesa, se enrolla, congela o sujeta."}, {"name": "Muro Natural", "cost": 2, "costText": "2 PR", "category": "8. Rasgos de Control de Terreno", "text": "La criatura levanta, expulsa o forma una barrera de materia: piedra, hielo, hueso, madera, carne, cristal, barro endurecido, telaraña, coral, metal vivo u otro material.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Crea una barrera de hasta 6 metros de largo y 3 metros de alto en un punto visible a 12 metros o menos.\nLa barrera bloquea el paso y otorga cobertura según su material y posición. Tiene 15 de Resistencia y Defensa 8. Si llega a 0 de Resistencia, se rompe.\nDuración:\nDura 3 rondas o hasta ser destruida.\nRestricción:\nEl material debe definirse al crear la criatura.\nDESCRIPCIÓN:\nLa criatura no solo se mueve por el terreno. Lo levanta, lo endurece o lo vomita para cerrar el camino."}, {"name": "Nube Obscurecedora", "cost": 2, "costText": "2 PR", "category": "8. Rasgos de Control de Terreno", "text": "La criatura libera humo, polvo, tinta, vapor, esporas, sombra, niebla, ceniza o un enjambre que dificulta la visión.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Crea una nube de 6 metros de radio centrada en la criatura o en un punto visible a 12 metros o menos.\nLas criaturas dentro de la nube tienen Desventaja en tiradas de Percepción basadas en la vista y en ataques a distancia que dependan de visión clara.\nDuración:\nDura hasta el inicio del próximo turno de la criatura.\nCierre:\nUn viento fuerte, una Técnica adecuada o una condición que disperse el mecanismo puede terminar el efecto antes.\nDESCRIPCIÓN:\nLa criatura llena el aire de algo que corta la vista. Lo que era campo abierto se vuelve duda."}, {"name": "Trampa de Zona", "cost": 2, "costText": "2 PR", "category": "8. Rasgos de Control de Terreno", "text": "La criatura prepara una zona que castiga el movimiento enemigo: telarañas tensas, raíces vivas, placas de presión, agujas, barro falso, runas, cristales frágiles o mandíbulas ocultas.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Designa un área de 3 metros de radio a 12 metros o menos. La primera criatura enemiga que entre en el área antes del inicio del próximo turno de la criatura debe superar una Salvación de Destreza contra ND 10 o queda Derribada.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDuración:\nDura hasta el inicio del próximo turno de la criatura o hasta activarse.\nCierre:\nEl efecto termina después de afectar a una criatura.\nDESCRIPCIÓN:\nEl peligro está puesto antes del paso. La presa no cae por el golpe, cae por pisar donde no debía."}, {"name": "Zona de Silencio", "cost": 3, "costText": "3 PR", "category": "8. Rasgos de Control de Terreno", "text": "La criatura apaga sonido, vibración, voz, canto, eco o comunicación dentro de una zona.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Designa un área de 3 metros de radio centrada en la criatura o en un punto visible a 12 metros o menos.\nDentro del área no pueden usarse efectos que dependan de voz, canto, órdenes habladas, ecolocalización, gritos o sonido.\nLas criaturas dentro del área tienen Desventaja en tiradas de Percepción basadas en oído.\nDuración:\nDura hasta el inicio del próximo turno de la criatura.\nCierre:\nEl efecto termina antes si la criatura cae Inconsciente o si el mecanismo que produce el silencio es destruido, disipado o interrumpido.\nDESCRIPCIÓN:\nLa zona queda muda. Las órdenes no salen, los ecos mueren y el oído deja de servir."}, {"name": "Zona de Presión", "cost": 3, "costText": "3 PR", "category": "8. Rasgos de Control de Terreno", "text": "La criatura aumenta gravedad, presión del aire, presión espiritual, densidad del agua, peso del barro, fuerza magnética o resistencia del entorno.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Designa un área de 3 metros de radio centrada en la criatura o en un punto visible a 12 metros o menos.\nLos enemigos que comiencen su turno dentro del área deben superar una Salvación de Cuerpo contra ND 10 o no pueden realizar Reacciones hasta el inicio de su próximo turno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDuración:\nDura hasta el inicio del próximo turno de la criatura.\nDESCRIPCIÓN:\nEl cuerpo se vuelve lento. No lo suficiente para detenerse, pero sí para reaccionar tarde."}, {"name": "Separar Presa", "cost": 2, "costText": "2 PR", "category": "8. Rasgos de Control de Terreno", "text": "La criatura usa empujones, látigos, raíces, agua, viento, sombra, presión o maniobras para aislar a un objetivo.\nCUÁNDO: Cuando impacta con un ataque cuerpo a cuerpo.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o es empujado 3 metros en dirección elegida por la criatura.\nEste movimiento no puede empujar al objetivo hacia un espacio imposible de ocupar.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nLímite:\nUna vez por turno.\nDESCRIPCIÓN:\nLa criatura no solo golpea. Coloca a su presa donde le conviene."}, {"name": "Jaula Natural", "cost": 4, "costText": "4 PR", "category": "8. Rasgos de Control de Terreno", "text": "La criatura encierra a un objetivo mediante raíces, hielo, huesos, barro endurecido, cristal, sombra, metal vivo, telarañas densas, mandíbulas del terreno o una estructura equivalente.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Elige una criatura visible a 12 metros o menos. El objetivo debe superar una Salvación de Destreza contra ND 10 o queda encerrado en una jaula de 3 metros de diámetro.\nMientras esté encerrado, no puede salir del área por movimiento normal. Puede atacar, usar Técnicas o intentar destruir la jaula.\nLa jaula tiene Defensa 8 y 20 de Resistencia. Si llega a 0 de Resistencia, se rompe.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDuración:\nDura 3 rondas o hasta ser destruida.\nCierre:\nEl efecto termina si la criatura cae Inconsciente, si la jaula es destruida o si una Técnica adecuada permite escapar.\nDESCRIPCIÓN:\nLa criatura no necesita matar de inmediato. Puede cerrar el mundo alrededor de una presa y decidir qué hacer después.\n9. Rasgos Especiales\nEstos rasgos representan capacidades excepcionales, estructuras corporales complejas, comportamientos de grupo, cambios de forma, invocaciones, reacciones finales o reglas que modifican de manera importante el funcionamiento de una criatura.\nUn rasgo especial debe usarse con cuidado. Muchos de estos rasgos cambian el ritmo de la mesa, añaden cuerpos al combate, alteran la cantidad de acciones disponibles o permiten que una criatura sobreviva más allá de lo normal."}, {"name": "Asimilar", "cost": 3, "costText": "3 PR", "category": "9. Rasgos Especiales", "text": "La criatura puede incorporar materia, cuerpos, energía o restos de otras criaturas para fortalecerse.\nCUÁNDO: En su turno, como Acción Principal, si está adyacente a una criatura reducida a 0 de Resistencia, restos compatibles o una fuente de materia apropiada definida al crearla.\nQUÉ HACE: La criatura consume o incorpora la fuente y recupera 2d6 + 1 de Resistencia.\nLa recuperación no puede superar su Resistencia máxima.\nLímite:\nUna vez por ronda.\nRestricción:\nDebe definirse qué puede asimilar: carne, metal, cadáveres, madera, piedra, energía elemental, corrupción, sangre, sombra u otra materia compatible.\nDESCRIPCIÓN:\nLa criatura no solo se alimenta. Integra aquello que toca y lo convierte en cuerpo, energía o estabilidad."}, {"name": "Dividirse", "cost": 4, "costText": "4 PR", "category": "9. Rasgos Especiales", "text": "La criatura puede partirse en cuerpos menores cuando recibe daño suficiente.\nCUÁNDO: La primera vez en un combate que la criatura queda con la mitad o menos de su Resistencia máxima.\nQUÉ HACE: La criatura se divide en dos cuerpos menores.\nCada cuerpo nuevo conserva la mitad de la Resistencia actual de la criatura original, redondeando hacia abajo, y actúa en el mismo turno de iniciativa que la criatura original.\nLos cuerpos divididos conservan los ataques naturales básicos de la criatura, pero no pueden volver a usar Dividirse.\nLímite:\nUna vez por combate.\nRestricción:\nDebe tener sentido físico o sobrenatural: cuerpo gelatinoso, enjambre, sombra viva, masa de carne, colonia de hongos, constructo modular u otro mecanismo equivalente.\nDESCRIPCIÓN:\nHerirla no siempre la reduce. A veces la multiplica."}, {"name": "Grito Reactivo", "cost": 2, "costText": "2 PR", "category": "9. Rasgos Especiales", "text": "La criatura puede responder al peligro con un grito, rugido, chillido, descarga, alarma, señal química o pulso sobrenatural.\nCUÁNDO: Como Reacción, cuando recibe daño.\nQUÉ HACE: Todas las criaturas enemigas a 6 metros o menos deben superar una Salvación de Aura contra ND 10 o sufren −1 a su próxima tirada de ataque antes del final de su próximo turno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nLímite:\nRequiere gastar su Reacción.\nCierre:\nUna criatura sorda o incapaz de percibir el mecanismo definido no se ve afectada, salvo que el grito use presión espiritual, vibración corporal u otro medio no auditivo.\nDESCRIPCIÓN:\nEl daño arranca una señal del cuerpo de la criatura. No es solo dolor: es alarma, amenaza o presión."}, {"name": "Invocador Innato", "cost": 4, "costText": "4 PR", "category": "9. Rasgos Especiales", "text": "La criatura puede llamar, producir, parir, liberar, animar o convocar aliados menores.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: Invoca hasta 1d6 criaturas de ND 1/4 o menor en espacios libres a 6 metros o menos.\nLas criaturas invocadas actúan después del turno de la criatura que las invocó.\nDuración:\nDuran 3 rondas o hasta ser reducidas a 0 de Resistencia.\nLímite:\nUna vez por combate.\nRestricción:\nLas criaturas invocadas deben definirse al crear la criatura. Deben estar ligadas a su identidad: crías, larvas, sombras, esqueletos, chispas elementales, drones, copias menores, insectos, espíritus u otro equivalente.\nDESCRIPCIÓN:\nLa criatura trae más cuerpos al conflicto. No siempre los llama desde lejos; a veces los vomita, los libera o los despierta."}, {"name": "Líder de la Manada", "cost": 2, "costText": "2 PR", "category": "9. Rasgos Especiales", "text": "La criatura coordina a sus aliados mediante rugidos, postura, feromonas, señales, disciplina o vínculo instintivo.\nCUÁNDO: Siempre activa mientras la criatura esté consciente.\nQUÉ HACE: Los aliados a 6 metros o menos que puedan verla, oírla o percibir su señal obtienen +1 a sus tiradas de ataque.\nCierre:\nEl beneficio termina si la criatura queda Inconsciente, si el aliado deja de percibirla o si el mecanismo de coordinación queda bloqueado.\nRestricción:\nDebe definirse el mecanismo de liderazgo al crear la criatura.\nDESCRIPCIÓN:\nLa criatura no solo pelea. Ordena el ritmo del grupo, aunque no use palabras."}, {"name": "Mente Colmena", "cost": 2, "costText": "2 PR", "category": "9. Rasgos Especiales", "text": "La criatura comparte impulsos, sentidos o voluntad con otras criaturas similares.\nCUÁNDO: Siempre activa mientras tenga al menos un aliado con Mente Colmena a 12 metros o menos.\nQUÉ HACE: No puede ser Sorprendida y tiene Ventaja en tiradas de Percepción.\nAdemás, si una criatura con Mente Colmena detecta un peligro, las demás criaturas con este rasgo a 12 metros o menos también lo detectan.\nCierre:\nEl beneficio termina si la criatura queda aislada de la red, si no hay aliados compatibles dentro del alcance o si el vínculo es bloqueado por una Técnica, silencio mental, interferencia o condición equivalente.\nDESCRIPCIÓN:\nLa criatura no piensa sola. Una parte de ella está en los otros cuerpos."}, {"name": "Múltiples Cabezas", "cost": 3, "costText": "3 PR", "category": "9. Rasgos Especiales", "text": "La criatura posee varias cabezas, rostros, núcleos sensoriales, ojos independientes o conciencias parciales.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Tiene Ventaja en tiradas de Percepción y no puede ser Flanqueada, sorprendida desde un ángulo muerto o afectada por efectos que dependan de distraer una sola cabeza o mirada.\nAdemás, tiene Ventaja en Salvaciones contra Cegado, Aturdido mental, Fascinado o efectos similares que afecten la percepción o atención.\nRestricción:\nDebe describirse cuántas cabezas, rostros, sensores o núcleos posee.\nDESCRIPCIÓN:\nSiempre hay otro ojo mirando. Siempre hay otra boca respirando. Siempre hay otra parte despierta."}, {"name": "Reanimar", "cost": 4, "costText": "4 PR", "category": "9. Rasgos Especiales", "text": "La criatura puede volver a levantarse después de caer.\nCUÁNDO: Al inicio de su próximo turno después de ser reducida a 0 de Resistencia.\nQUÉ HACE: La criatura recupera 2d6 + 1 de Resistencia y deja de estar fuera de combate.\nLímite:\nUna vez por combate.\nCierre:\nEste rasgo no se activa si el cuerpo fue destruido, quemado por completo, desintegrado, purificado, separado de su núcleo vital o neutralizado mediante el método definido al crear la criatura.\nRestricción:\nDebe definirse qué impide la reanimación: fuego, daño radiante, destrucción del núcleo, sal, decapitación, exorcismo, romper el tótem, separar piezas u otra condición clara.\nDESCRIPCIÓN:\nCaer no basta. Hay que saber cómo impedir que vuelva."}, {"name": "Reflejar Técnica", "cost": 4, "costText": "4 PR", "category": "9. Rasgos Especiales", "text": "La criatura puede devolver una Técnica dirigida contra ella.\nCUÁNDO: Como Reacción, cuando una Técnica con tirada de ataque falla contra la criatura.\nQUÉ HACE: La criatura refleja la Técnica contra el usuario original. El usuario original se convierte en el nuevo objetivo y debe resolver el ataque o Salvación correspondiente.\nLímite:\nUna vez por combate.\nRestricción:\nNo funciona contra Técnicas de área, Técnicas sin objetivo directo, efectos ambientales, auras ni Técnicas que no puedan ser reflejadas por el mecanismo definido.\nDESCRIPCIÓN:\nLa Técnica no se apaga. Rebota, se tuerce o vuelve por el camino que abrió."}, {"name": "Resistencia Legendaria", "cost": 5, "costText": "5 PR", "category": "9. Rasgos Especiales", "text": "La criatura posee una reserva excepcional de voluntad, cuerpo, destino o poder interno.\nCUÁNDO: Cuando falla una Salvación.\nQUÉ HACE: Puede convertir esa Salvación fallida en éxito.\nLímite:\nUna vez por combate.\nRestricción:\nDebe reservarse para criaturas de ND alto o criaturas que representen una amenaza excepcional dentro del sistema. No define a la criatura como jefe; solo indica que es difícil de someter con un único efecto decisivo.\nDESCRIPCIÓN:\nLa criatura rechaza un final que habría detenido a otra. No por suerte, sino porque su cuerpo, alma o historia todavía no cede."}, {"name": "Tamaño Cambiante", "cost": 3, "costText": "3 PR", "category": "9. Rasgos Especiales", "text": "La criatura puede alterar su tamaño dentro de límites definidos.\nCUÁNDO: En su turno, como Acción Principal.\nQUÉ HACE: La criatura puede aumentar o reducir su tamaño en una categoría.\nAl cambiar de tamaño, aplica los modificadores de tamaño correspondientes a Resistencia y Defensa. La Resistencia actual se ajusta en la misma cantidad que cambie la Resistencia máxima.\nDuración:\nDura 3 rondas.\nCierre:\nEl efecto termina antes si la criatura queda Inconsciente, si pierde el mecanismo de transformación o si decide volver a su tamaño normal como Acción Rápida en su turno.\nLímite:\nUna vez por combate.\nDESCRIPCIÓN:\nEl cuerpo cambia de escala. Huesos, masa, sombra, armadura o energía se expanden o se contraen durante unos instantes."}, {"name": "Tragar Entero", "cost": 4, "costText": "4 PR", "category": "9. Rasgos Especiales", "text": "La criatura puede engullir a una presa y mantenerla atrapada dentro de su cuerpo.\nCUÁNDO: En su turno, como Acción Principal, contra una criatura Apresada de al menos una categoría de tamaño menor.\nQUÉ HACE: El objetivo debe superar una Salvación de Cuerpo contra ND 10 o es tragado.\nMientras esté tragado, el objetivo queda Inmovilizado, tiene cobertura total contra efectos externos y sufre 1d6 de daño Corrosivo al inicio de cada uno de sus turnos.\nEl objetivo puede intentar escapar como Acción Principal realizando una Salvación de Cuerpo contra ND 10. Si tiene éxito, sale a un espacio adyacente libre.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nCierre:\nEl efecto termina si el objetivo escapa, si la criatura cae a 0 de Resistencia o si una Técnica, daño interno o condición definida permite abrir una salida.\nDESCRIPCIÓN:\nLa presa deja de estar en el campo. Ahora pelea contra dientes internos, ácido, carne, sombra o una garganta que no termina."}, {"name": "Último Aliento", "cost": 2, "costText": "2 PR", "category": "9. Rasgos Especiales", "text": "La criatura libera una última acción antes de caer.\nCUÁNDO: Cuando es reducida a 0 de Resistencia.\nQUÉ HACE: Antes de quedar fuera de combate, puede realizar inmediatamente una Acción Rápida o un ataque natural básico.\nEl ataque no suma Atributo al daño.\nLímite:\nUna vez por combate.\nRestricción:\nNo puede usar este rasgo si fue destruida de forma instantánea, desintegrada, anulada por una condición específica o si ya no conserva un cuerpo capaz de actuar.\nDESCRIPCIÓN:\nLa criatura cae, pero todavía muerde, grita, golpea o termina una orden.\n10. Rasgos de Grupo, Hábitat y Equipo\nEstos rasgos representan criaturas que funcionan mejor en conjunto, que están adaptadas a un entorno concreto o que dependen de herramientas, armas, armaduras, focos, trampas o equipo especializado.\nNo reemplazan los rasgos ofensivos, defensivos, de movimiento o soporte. Sirven para cubrir aspectos de diseño que dependen del contexto natural de la criatura o de su relación con otros miembros de su grupo.\nRasgos de Grupo"}, {"name": "Comunicación de Grupo", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura puede transmitir señales simples a otras criaturas compatibles sin usar lenguaje común.\nCUÁNDO: Siempre activa mientras la criatura esté consciente.\nQUÉ HACE: Puede comunicar órdenes simples, alertas, emociones básicas o ubicación de amenazas a aliados compatibles dentro de 12 metros.\nEsto permite coordinar emboscadas, retiradas, persecuciones o cambios de objetivo sin hablar.\nRestricción:\nDebe definirse el mecanismo: feromonas, vibraciones, chasquidos, mirada, canto, señales de cola, luces corporales, vínculo mental menor u otro sistema equivalente.\nCierre:\nEl rasgo deja de funcionar si el mecanismo de comunicación es bloqueado, si la criatura queda Inconsciente o si sus aliados no pueden percibir la señal.\nDESCRIPCIÓN:\nLa criatura no necesita palabras. Su grupo entiende señales breves, cambios de postura, olores, sonidos o impulsos que otros no interpretan."}, {"name": "Alerta Compartida", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura reacciona a las señales de peligro emitidas por sus aliados.\nCUÁNDO: Cuando un aliado compatible a 12 metros o menos detecta una amenaza, emboscada o criatura oculta.\nQUÉ HACE: La criatura también queda alertada de la amenaza.\nEsto no revela detalles que el aliado no conozca. Solo transmite la existencia y dirección aproximada del peligro.\nRestricción:\nDebe existir un medio de comunicación compatible entre las criaturas.\nDESCRIPCIÓN:\nSi uno del grupo nota el peligro, los demás se tensan. No todos entienden qué ocurre, pero saben que algo viene."}, {"name": "Táctica de Manada", "cost": 2, "costText": "2 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura está entrenada o adaptada para atacar junto a otras.\nCUÁNDO: Cuando ataca a una criatura que está adyacente a un aliado consciente de la criatura.\nQUÉ HACE: Obtiene +1 a la tirada de ataque.\nRestricción:\nDebe tener sentido para la criatura: manada, escuadra, enjambre, jauría, grupo de caza, unidad militar, colmena o vínculo coordinado.\nDESCRIPCIÓN:\nLa criatura no pelea sola aunque esté atacando con su propio cuerpo. Sus aliados abren ángulos, cierran salidas y fuerzan errores."}, {"name": "Cerco Coordinado", "cost": 2, "costText": "2 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura bloquea rutas de escape cuando actúa junto a sus aliados.\nCUÁNDO: Mientras un enemigo esté adyacente a la criatura y también adyacente a otro aliado consciente de la criatura.\nQUÉ HACE: Ese enemigo sufre −3 metros a su movimiento mientras permanezca en esa situación.\nCierre:\nEl efecto termina si el enemigo deja de estar adyacente a la criatura o al aliado, o si una de las criaturas que forman el cerco queda Inconsciente.\nDESCRIPCIÓN:\nNo basta con correr. El grupo cierra huecos, corta pasos y obliga a la presa a moverse donde no quiere."}, {"name": "Obediencia Absoluta", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura está condicionada, entrenada, programada o vinculada para seguir órdenes sin dudar.\nCUÁNDO: Cuando recibe una orden de una criatura o autoridad definida al crearla.\nQUÉ HACE: Tiene Ventaja en Salvaciones contra miedo, confusión, compulsión o efectos mentales que la obliguen a desobedecer esa orden.\nRestricción:\nDebe definirse quién o qué puede darle órdenes válidas: reina, amo, comandante, núcleo, tótem, patrón espiritual, señal alquímica, jerarquía de manada u otro equivalente.\nDESCRIPCIÓN:\nLa criatura puede sentir miedo o duda, pero su orden pesa más. Algo en ella fue hecho para obedecer."}, {"name": "Mando Natural", "cost": 2, "costText": "2 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura puede dirigir a otras criaturas compatibles mediante instinto, autoridad, señales o vínculo.\nCUÁNDO: En su turno, como Acción Rápida.\nQUÉ HACE: Un aliado compatible visible o detectable a 12 metros o menos obtiene +1 a su próxima tirada antes del inicio del próximo turno de la criatura que dio la orden.\nSi el bono no se usa antes de ese momento, se pierde.\nRestricción:\nEl aliado debe poder percibir y entender la señal de mando.\nDESCRIPCIÓN:\nUna mirada, olor, gesto o chasquido basta para corregir el movimiento de otro cuerpo.\nRasgos de Hábitat"}, {"name": "Adaptación de Hábitat", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura está especialmente adaptada a un entorno concreto.\nCUÁNDO: Cuando realiza tiradas de Percepción, rastreo, orientación, ocultamiento o supervivencia dentro de su hábitat elegido.\nQUÉ HACE: Obtiene +1 a esas tiradas.\nRestricción:\nEl hábitat debe definirse al crear la criatura: bosque, pantano, caverna, desierto, montaña, tundra, costa, ruinas, ciudad, volcán, arrecife, cementerio, laboratorio, templo u otro entorno concreto.\nDESCRIPCIÓN:\nLa criatura lee su entorno mejor que otras. Sabe dónde pisar, qué oler, qué sombra mirar y qué señales no ignorar."}, {"name": "Dominio de Hábitat", "cost": 2, "costText": "2 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura conoce su entorno como una extensión de su cuerpo.\nCUÁNDO: Cuando realiza tiradas de Percepción, rastreo, orientación, ocultamiento o supervivencia dentro de su hábitat elegido.\nQUÉ HACE: Tiene Ventaja en esas tiradas.\nRestricción:\nEl hábitat debe definirse al crear la criatura.\nNota:\nEste rasgo reemplaza Adaptación de Hábitat para el mismo entorno. No se suman.\nDESCRIPCIÓN:\nEl hábitat no es solo su hogar. Es parte de su forma de cazar, esconderse, moverse y sobrevivir."}, {"name": "Emboscador de Hábitat", "cost": 2, "costText": "2 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura usa su entorno natural para atacar desde posiciones favorables.\nCUÁNDO: Cuando ataca a una criatura que no la detectó previamente dentro de su hábitat elegido.\nQUÉ HACE: Obtiene +1 a la tirada de ataque y +1 al daño de ese ataque.\nRestricción:\nEl hábitat debe definirse al crear la criatura. La criatura debe haber estado oculta, camuflada o fuera de la atención del objetivo antes del ataque.\nDESCRIPCIÓN:\nEl ataque viene desde donde el terreno parecía quieto: barro, sombra, maleza, roca, ruina, agua o multitud."}, {"name": "Refugio Natural", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura sabe usar su entorno para cubrirse o reducir exposición.\nCUÁNDO: Mientras se encuentre dentro de su hábitat elegido y exista cobertura, irregularidad, vegetación, ruina, piedra, sombra, agua, humo, terreno elevado o elemento defensivo apropiado.\nQUÉ HACE: Obtiene +1 a Defensa.\nLímite:\nLa Defensa final de una criatura no puede superar 16.\nCierre:\nEl beneficio se pierde si la criatura abandona el hábitat elegido o queda en un espacio abierto sin elementos que justifiquen la protección.\nDESCRIPCIÓN:\nLa criatura se pega al terreno. Donde otros quedan expuestos, ella encuentra borde, piedra, rama, grieta o sombra."}, {"name": "Recuperación de Hábitat", "cost": 2, "costText": "2 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura se recupera mejor dentro de su entorno natural.\nCUÁNDO: Al inicio de su turno, mientras esté dentro de su hábitat elegido.\nQUÉ HACE: Recupera 2 puntos de Resistencia.\nLa recuperación no puede superar su Resistencia máxima.\nCierre:\nEl rasgo no funciona si la criatura está fuera de su hábitat, si el hábitat ha sido destruido o si una condición impide que pueda nutrirse, respirar o conectarse con ese entorno.\nDESCRIPCIÓN:\nEl lugar la sostiene. Agua, sombra, raíces, calor, piedra, polvo o energía local ayudan a que su cuerpo siga funcionando.\nRasgos de Equipo"}, {"name": "Uso de Equipo", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura puede usar armas, armaduras, herramientas o equipo fabricado de forma competente.\nCUÁNDO: Siempre activa.\nQUÉ HACE: La criatura puede usar equipo diseñado para su anatomía sin penalizadores.\nPuede portar armas, escudos, armaduras, herramientas, kits u objetos adecuados a su forma corporal.\nRestricción:\nEl tipo de equipo habitual debe definirse al crear la criatura.\nNota:\nEste rasgo no otorga equipo por sí mismo. Solo permite usarlo de forma competente.\nDESCRIPCIÓN:\nLa criatura entiende el equipo o fue hecha para usarlo. No pelea solo con cuerpo, sino también con herramientas."}, {"name": "Arma Simple Incorporada", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura posee un arma simple integrada en su cuerpo.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: La criatura incorpora un arma simple a su anatomía, construcción o equipo permanente.\nEsa arma no puede ser desarmada por métodos normales y debe aparecer en la ficha como una de sus acciones de ataque.\nRestricción:\nEl arma debe ser equivalente a un arma simple del sistema y debe ser razonable para el cuerpo de la criatura: cuchilla implantada, aguijón metálico, porra ósea, lanza corporal simple, pinza armada, garra artificial, dardo natural endurecido u otra forma equivalente.\nDESCRIPCIÓN:\nEl arma no se empuña. Es parte del cuerpo o está fijada a él."}, {"name": "Arma Marcial Incorporada", "cost": 2, "costText": "2 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura posee un arma marcial integrada en su cuerpo.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: La criatura incorpora un arma marcial a su anatomía, construcción o equipo permanente.\nEsa arma no puede ser desarmada por métodos normales y debe aparecer en la ficha como una de sus acciones de ataque.\nRestricción:\nEl arma debe ser equivalente a un arma marcial del sistema y debe ser razonable para el cuerpo de la criatura: hoja pesada implantada, sierra de constructo, garra mecánica compleja, cañón orgánico, lanza retráctil, cadena integrada, mandíbula reforzada como arma marcial u otra forma equivalente.\nDESCRIPCIÓN:\nLa criatura lleva un arma seria en el cuerpo. No es una garra común ni una protuberancia: es una herramienta de guerra integrada."}, {"name": "Escudo Incorporado", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura posee una protección integrada que funciona como escudo.\nCUÁNDO: Siempre activa mientras conserve la pieza integrada.\nQUÉ HACE: La criatura obtiene +1 a Defensa.\nEste bono cuenta como defensa por escudo o pieza equipada, no como Armadura Natural.\nRestricción:\nDebe definirse la pieza: placa móvil, brazo escudo, caparazón usado activamente, lámina metálica, defensa ósea, panel de constructo, ala endurecida, pinza defensiva u otra forma equivalente.\nLa Defensa final no puede superar 16.\nNota:\nA diferencia de un escudo equipado común, este escudo no puede ser desarmado por métodos normales. Puede romperse si el rasgo, el cuerpo o la pieza integrada son dañados por un efecto apropiado.\nDESCRIPCIÓN:\nLa criatura no solo resiste con piel. Tiene una pieza hecha para cubrir, desviar o recibir golpes."}, {"name": "Armadura Equipada", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura usa armadura fabricada, escudo o protección externa equipada.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: La criatura obtiene una armadura, escudo o protección equipada apropiada para su anatomía.\nEse equipo debe anotarse en la ficha y usa las reglas normales de equipo. Puede dañarse, romperse, corroerse, perderse o ser retirado si la situación lo permite.\nRestricción:\nLa criatura debe ser capaz de portar esa protección o haber sido diseñada para llevarla.\nNota:\nEste rasgo no reemplaza Armadura Natural. La Armadura Equipada puede perderse; la Armadura Natural forma parte del cuerpo.\nDESCRIPCIÓN:\nLa criatura lleva protección externa. Puede ser armadura hecha por artesanos, placas atadas, bardas, cuero endurecido, metal ritual o un escudo común."}, {"name": "Herramienta Incorporada", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura posee una herramienta integrada en su cuerpo.\nCUÁNDO: Cuando usa esa herramienta para una acción apropiada.\nQUÉ HACE: Obtiene +1 a tiradas relacionadas con el uso de esa herramienta.\nRestricción:\nLa herramienta debe definirse al crear la criatura: pinza fina, inyector, compartimento, lámpara, garfio, cerradura interna, sonda, aguja, kit de reparación integrado u otro equivalente.\nDESCRIPCIÓN:\nLa herramienta no está en una bolsa. Está en su cuerpo, su construcción o su anatomía."}, {"name": "Foco Incorporado", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura posee un foco ritual, arcano, espiritual, alquímico o energético integrado en su cuerpo.\nCUÁNDO: Cuando usa una Técnica o efecto que requiera foco, símbolo, núcleo o catalizador.\nQUÉ HACE: No puede ser desarmada de ese foco por métodos normales. Además, obtiene +1 a tiradas para mantener, canalizar o estabilizar efectos ligados a ese foco.\nRestricción:\nEl foco debe definirse al crear la criatura: cristal central, máscara ritual, sello grabado, núcleo de fuego, tótem incrustado, gema espiritual, marca divina u otro equivalente.\nDESCRIPCIÓN:\nEl foco es parte de la criatura. Puede romperse, apagarse o corromperse, pero no basta con quitarle un objeto de la mano."}, {"name": "Especialista en Arma", "cost": 2, "costText": "2 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura está entrenada o diseñada para usar un arma concreta.\nCUÁNDO: Cuando ataca con el arma elegida.\nQUÉ HACE: Obtiene +1 a las tiradas de ataque con esa arma.\nRestricción:\nEl arma debe definirse al crear la criatura.\nDESCRIPCIÓN:\nLa criatura no solo puede usar el arma. Fue entrenada, fabricada o adaptada para ese tipo de ataque."}, {"name": "Herramienta Especializada", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura posee una herramienta, kit o instrumento que amplía sus acciones fuera del combate directo.\nCUÁNDO: Cuando usa la herramienta definida para una acción apropiada.\nQUÉ HACE: Obtiene +1 a tiradas relacionadas con esa herramienta.\nRestricción:\nLa herramienta debe definirse al crear la criatura.\nDESCRIPCIÓN:\nLa criatura tiene una herramienta concreta y sabe usarla bien. No cubre un oficio completo, solo una función específica."}, {"name": "Trampa Dañina", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura dispone de una trampa simple diseñada para herir.\nCUÁNDO: Al crear la criatura o en su turno como Acción Principal, si tiene materiales y espacio adecuados.\nQUÉ HACE: Coloca una trampa en un área de 3 metros.\nLa primera criatura enemiga que entre en esa área debe superar una Salvación de Destreza contra ND 10 o sufrir 1d6 de daño.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDuración:\nLa trampa dura hasta activarse o hasta ser desarmada.\nLímite:\nLa criatura puede tener una Trampa Dañina activa a la vez.\nDESCRIPCIÓN:\nLa trampa no busca atrapar. Busca cortar, pinchar, quemar, morder o castigar el paso."}, {"name": "Trampa Derribadora", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura dispone de una trampa simple diseñada para hacer caer.\nCUÁNDO: Al crear la criatura o en su turno como Acción Principal, si tiene materiales y espacio adecuados.\nQUÉ HACE: Coloca una trampa en un área de 3 metros.\nLa primera criatura enemiga que entre en esa área debe superar una Salvación de Destreza contra ND 10 o queda Derribada.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDuración:\nLa trampa dura hasta activarse o hasta ser desarmada.\nLímite:\nLa criatura puede tener una Trampa Derribadora activa a la vez.\nDESCRIPCIÓN:\nLa trampa corta el paso, tira de la pierna, suelta una cuerda o vuelve falso el suelo."}, {"name": "Trampa Inmovilizadora", "cost": 2, "costText": "2 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura dispone de una trampa diseñada para sujetar.\nCUÁNDO: Al crear la criatura o en su turno como Acción Principal, si tiene materiales y espacio adecuados.\nQUÉ HACE: Coloca una trampa en un área de 3 metros.\nLa primera criatura enemiga que entre en esa área debe superar una Salvación de Destreza contra ND 10 o queda Inmovilizada hasta el final de su próximo turno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDuración:\nLa trampa dura hasta activarse o hasta ser desarmada.\nLímite:\nLa criatura puede tener una Trampa Inmovilizadora activa a la vez.\nDESCRIPCIÓN:\nLa trampa cierra, pega, atrapa o fija. No mata rápido, pero deja a la presa donde la criatura la quiere."}, {"name": "Trampa de Entorpecimiento", "cost": 1, "costText": "1 PR", "category": "10. Rasgos de Grupo, Hábitat y Equipo", "text": "La criatura dispone de una trampa simple diseñada para frenar.\nCUÁNDO: Al crear la criatura o en su turno como Acción Principal, si tiene materiales y espacio adecuados.\nQUÉ HACE: Coloca una trampa en un área de 3 metros.\nLa primera criatura enemiga que entre en esa área debe superar una Salvación de Destreza contra ND 10 o reduce su movimiento en 3 metros hasta el final de su próximo turno.\nPotencia de Salvación:\nSi la criatura posee Potencia de Salvación, esta ND puede subir a 12 o 14.\nDuración:\nLa trampa dura hasta activarse o hasta ser desarmada.\nLímite:\nLa criatura puede tener una Trampa de Entorpecimiento activa a la vez.\nDESCRIPCIÓN:\nLa trampa no detiene por completo. Basta con que haga perder tiempo, equilibrio o velocidad.\n11. Rasgos de Interacción, Presencia y Utilidad\nEstos rasgos cubren capacidades que no pertenecen directamente al combate, movimiento, defensa, soporte o control de terreno.\nSirven para criaturas que tienen presencia social, inteligencia práctica, rasgos intimidantes, capacidades comunicativas, memoria, autoridad natural, belleza perturbadora, talento para engañar, utilidad de oficio, conocimiento instintivo o funciones especiales fuera del combate.\nUn rasgo de esta categoría debe indicar con claridad en qué tipo de tiradas aplica. No debe dar bonos amplios a “todo lo social” ni reemplazar Conceptos. Debe reforzar una forma concreta en que la criatura interactúa con el mundo."}, {"name": "Presencia Intimidante", "cost": 1, "costText": "1 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura posee rasgos físicos, voz, tamaño, postura, mirada, cicatrices, olor, aura o reputación que la vuelven naturalmente intimidante.\nCUÁNDO: Cuando realiza tiradas para intimidar, amenazar, imponer presencia o hacer retroceder a una criatura mediante miedo directo.\nQUÉ HACE: Obtiene +1 a esas tiradas.\nRestricción:\nDebe definirse qué produce la intimidación: tamaño, rostro, rugido, cráneo expuesto, marcas de depredador, aura oscura, fama, armadura, olor a sangre u otro elemento claro.\nDESCRIPCIÓN:\nLa criatura no necesita explicar la amenaza. Su cuerpo, voz o presencia ya la anuncia."}, {"name": "Presencia Dominante", "cost": 2, "costText": "2 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura impone autoridad con facilidad. No solo asusta: obliga a otros a prestar atención.\nCUÁNDO: Cuando realiza tiradas para intimidar, ordenar, imponerse, exigir obediencia o controlar una conversación desde una posición de autoridad.\nQUÉ HACE: Tiene Ventaja en esas tiradas.\nRestricción:\nDebe definirse el origen de la autoridad: jerarquía de manada, nobleza, porte militar, mandato espiritual, voz sobrenatural, tamaño, feromonas de mando, presencia divina, programación de comando u otro mecanismo equivalente.\nNota:\nEste rasgo no obliga a obedecer automáticamente. Solo mejora tiradas donde la criatura intenta imponer su voluntad de forma directa.\nDESCRIPCIÓN:\nLa criatura ocupa espacio incluso cuando no se mueve. Otros cuerpos entienden que conviene escucharla."}, {"name": "Apariencia Confiable", "cost": 1, "costText": "1 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura posee rasgos que facilitan que otros bajen la guardia: rostro amable, voz suave, apariencia inocente, conducta domesticada, gestos familiares, belleza tranquila o aspecto inofensivo.\nCUÁNDO: Cuando realiza tiradas para calmar, persuadir, pedir ayuda, parecer inofensiva o generar confianza inicial.\nQUÉ HACE: Obtiene +1 a esas tiradas.\nRestricción:\nEl rasgo no funciona si la criatura ya atacó, amenazó o mostró una conducta claramente hostil ante el objetivo durante la misma interacción.\nDESCRIPCIÓN:\nAlgo en la criatura invita a no levantar el arma de inmediato."}, {"name": "Encanto Natural", "cost": 2, "costText": "2 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura tiene una presencia atractiva, magnética o emocionalmente envolvente.\nCUÁNDO: Cuando realiza tiradas para persuadir, agradar, seducir, fascinar socialmente, entretener o conseguir buena disposición sin usar control mental.\nQUÉ HACE: Tiene Ventaja en esas tiradas.\nRestricción:\nDebe definirse el mecanismo: belleza, voz, danza, plumaje, perfume, gestos, carisma, luz suave, canto, gracia corporal o presencia sobrenatural.\nNota:\nEste rasgo no permite controlar la mente ni imponer estados alterados por sí mismo. Para eso se usan rasgos como Influencia Mental, Aura Encantadora u otros efectos con Salvación.\nDESCRIPCIÓN:\nLa criatura atrae atención. No obliga, pero hace que escucharla parezca una buena idea."}, {"name": "Rostro Inquietante", "cost": 1, "costText": "1 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura tiene una apariencia difícil de interpretar o profundamente incómoda.\nCUÁNDO: Cuando una criatura intenta leer sus emociones, intenciones inmediatas o estado anímico mediante observación social.\nQUÉ HACE: La criatura que intenta leerla sufre −1 a esa tirada.\nRestricción:\nDebe definirse el rasgo: rostro inmóvil, máscara natural, ojos múltiples, sonrisa fija, ausencia de expresión, rostro cadavérico, cara animal, piel sin gestos, voz plana u otro elemento equivalente.\nDESCRIPCIÓN:\nMirarla no ayuda. Su cara no entrega las pistas que debería entregar."}, {"name": "Voz Hipnótica", "cost": 2, "costText": "2 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La voz, canto, zumbido o ritmo verbal de la criatura facilita que otros la escuchen y sigan el hilo de sus palabras.\nCUÁNDO: Cuando realiza tiradas sociales mediante voz, canto, discurso, relato, negociación o sugestión no mágica.\nQUÉ HACE: Obtiene +1 a la tirada. Si el objetivo no puede oírla, el rasgo no aplica.\nRestricción:\nDebe definirse el mecanismo vocal: canto, tono grave, zumbido, eco, ritmo, vibración, armonía, voz doble, timbre sobrenatural u otro equivalente.\nNota:\nEste rasgo no impone estados mentales. Si la voz causa Fascinado, Asustado, Controlado u otro estado, debe usarse un rasgo con Salvación.\nDESCRIPCIÓN:\nLa voz tira de la atención. Quien la oye tarda un poco más en cortar la conversación."}, {"name": "Imitador de Voces", "cost": 2, "costText": "2 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura puede imitar voces, sonidos, llamadas, palabras, llantos, rugidos o señales auditivas.\nCUÁNDO: Cuando intenta engañar, atraer, confundir o comunicarse imitando un sonido que haya escuchado antes.\nQUÉ HACE: Tiene Ventaja en tiradas para imitar ese sonido de forma convincente.\nRestricción:\nNo permite conocer idiomas, recuerdos, claves o información que la criatura no posea. Solo imita el sonido.\nDESCRIPCIÓN:\nLa criatura repite lo que oyó. Puede sonar como una persona, una presa, una cría, una orden o una puerta vieja abriéndose."}, {"name": "Memoria Exacta", "cost": 1, "costText": "1 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura recuerda con precisión lugares, rostros, olores, sonidos, rutas, patrones o instrucciones.\nCUÁNDO: Cuando realiza tiradas para recordar información que haya percibido directamente.\nQUÉ HACE: Obtiene +1 a esas tiradas.\nRestricción:\nDebe definirse qué tipo de memoria destaca: rutas, rostros, olores, voces, símbolos, mapas, presas, órdenes, rituales o patrones.\nDESCRIPCIÓN:\nLa criatura conserva detalles que otros olvidarían: un olor viejo, un símbolo torcido, un paso escuchado una vez."}, {"name": "Memoria Perfecta", "cost": 2, "costText": "2 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura conserva información con una precisión anormal.\nCUÁNDO: Cuando realiza tiradas para recordar información que haya percibido directamente.\nQUÉ HACE: Tiene Ventaja en esas tiradas.\nRestricción:\nEste rasgo reemplaza Memoria Exacta para el mismo campo de memoria. No se suman.\nDebe definirse qué tipo de memoria destaca.\nDESCRIPCIÓN:\nLo que la criatura percibe queda grabado con una claridad incómoda."}, {"name": "Olfato Social", "cost": 1, "costText": "1 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura detecta cambios corporales, olor, tensión, sudor, respiración, miedo o excitación emocional.\nCUÁNDO: Cuando intenta percibir miedo, nerviosismo, agresividad, enfermedad visible, deseo de huir o tensión emocional mediante señales corporales.\nQUÉ HACE: Obtiene +1 a esas tiradas.\nRestricción:\nNo lee pensamientos ni revela mentiras complejas por sí mismo. Solo detecta señales corporales o emocionales.\nDESCRIPCIÓN:\nEl cuerpo ajeno habla aunque la boca mienta. La criatura huele o nota esa diferencia."}, {"name": "Lectura Instintiva", "cost": 2, "costText": "2 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura interpreta instintivamente postura, respiración, mirada, olor, tono o microgestos.\nCUÁNDO: Cuando intenta leer intenciones inmediatas, detectar hostilidad, anticipar traición o notar miedo en una criatura presente.\nQUÉ HACE: Tiene Ventaja en esas tiradas.\nRestricción:\nNo revela planes complejos, recuerdos, pensamientos ocultos ni información que no se manifieste en conducta observable.\nDESCRIPCIÓN:\nLa criatura sabe cuándo un cuerpo está por huir, mentir, atacar o quebrarse."}, {"name": "Rastreador Social", "cost": 1, "costText": "1 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura puede seguir rastros sociales: rumores, movimientos de grupos, señales de paso, marcas de gremio, patrones de comercio, olores de multitud o huellas de actividad urbana.\nCUÁNDO: Cuando intenta seguir a una persona o grupo dentro de un asentamiento, mercado, campamento, puerto, caravana o zona habitada.\nQUÉ HACE: Obtiene +1 a tiradas para rastrear, ubicar o reconstruir el paso de ese objetivo en entornos sociales.\nRestricción:\nDebe definirse el método principal: olfato, lectura de multitudes, contactos, marcas, patrones de comercio, residuos, pisadas, rumores o señales urbanas.\nDESCRIPCIÓN:\nLa criatura no busca huellas en barro. Busca compras, miradas, rumores, olores, marcas y silencios."}, {"name": "Oficio Natural", "cost": 1, "costText": "1 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura posee una función práctica o productiva incorporada a su biología, crianza, programación o entrenamiento.\nCUÁNDO: Cuando realiza una tarea concreta de oficio definida al crear la criatura.\nQUÉ HACE: Obtiene +1 a tiradas relacionadas con esa tarea.\nRestricción:\nLa tarea debe ser específica: cavar túneles, hilar seda, producir tinta, limpiar heridas, detectar minerales, clasificar objetos, transportar carga, vigilar puertas, encender hornos, fabricar nidos, reparar piezas simples u otra función clara.\nNota:\nEste rasgo no reemplaza un Concepto completo. Solo cubre una tarea concreta.\nDESCRIPCIÓN:\nLa criatura tiene una utilidad concreta fuera del combate. Su cuerpo o entrenamiento fue hecho para eso."}, {"name": "Auxiliar de Oficio", "cost": 2, "costText": "2 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura está adaptada para cumplir una función práctica con eficacia notable.\nCUÁNDO: Cuando realiza una tarea concreta de oficio definida al crear la criatura.\nQUÉ HACE: Tiene Ventaja en tiradas relacionadas con esa tarea.\nRestricción:\nEste rasgo reemplaza Oficio Natural para la misma tarea. No se suman.\nLa tarea debe ser específica y estar definida al crear la criatura.\nDESCRIPCIÓN:\nLa criatura no solo ayuda en una tarea. Está hecha para realizarla bien."}, {"name": "Carga Poderosa", "cost": 1, "costText": "1 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura está adaptada para cargar, arrastrar o transportar peso.\nCUÁNDO: Cuando realiza tiradas para cargar peso, arrastrar objetos, mover carga, tirar de vehículos o resistir agotamiento por transporte.\nQUÉ HACE: Obtiene +1 a esas tiradas.\nRestricción:\nNo aumenta su daño ni su capacidad de combate. Solo aplica a esfuerzo físico utilitario relacionado con carga.\nDESCRIPCIÓN:\nLa criatura puede llevar peso, tirar carros, arrastrar presas o soportar carga mejor que otras de su tamaño."}, {"name": "Cargador Mayor", "cost": 2, "costText": "2 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura posee fuerza, estructura corporal o resistencia diseñada para transporte pesado.\nCUÁNDO: Cuando realiza tiradas para cargar peso, arrastrar objetos, mover carga, tirar de vehículos o resistir agotamiento por transporte.\nQUÉ HACE: Tiene Ventaja en esas tiradas.\nRestricción:\nEste rasgo reemplaza Carga Poderosa para tareas de transporte. No se suman.\nNo aumenta su daño ni su capacidad de combate.\nDESCRIPCIÓN:\nLa criatura puede ser usada como bestia de carga, motor vivo, arrastrador de piezas o transporte pesado."}, {"name": "Apariencia Inofensiva", "cost": 1, "costText": "1 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura parece menos peligrosa de lo que realmente es.\nCUÁNDO: Cuando una criatura intenta evaluar si representa una amenaza antes de verla atacar o usar una capacidad peligrosa.\nQUÉ HACE: La criatura que evalúa su amenaza sufre −1 a esa tirada.\nCierre:\nEl rasgo deja de aplicar ante criaturas que ya hayan visto a la criatura atacar, usar Técnicas ofensivas o revelar su verdadera capacidad.\nDESCRIPCIÓN:\nParece débil, tierna, torpe, vieja, enferma o demasiado pequeña para ser un problema. Hasta que deja de parecerlo."}, {"name": "Presencia Noble", "cost": 1, "costText": "1 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura posee porte, señales, ornamentos, postura, olor, marcas, voz o comportamiento asociado a jerarquía.\nCUÁNDO: Cuando interactúa con criaturas capaces de reconocer esa jerarquía.\nQUÉ HACE: Obtiene +1 a tiradas para exigir respeto, solicitar audiencia, reclamar autoridad o actuar dentro de una estructura jerárquica.\nRestricción:\nLa jerarquía debe definirse al crear la criatura: nobleza, casta, rango militar, manada, culto, colmena, autoridad espiritual, linaje, gremio, corte o mandato artificial.\nDESCRIPCIÓN:\nLa criatura lleva señales de rango. No siempre son coronas o joyas; a veces son olor, cicatrices, postura o coloración."}, {"name": "Señal de Advertencia", "cost": 1, "costText": "1 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura puede comunicar peligro sin atacar: colores vivos, siseo, cresta, chasquidos, luz, olor, postura, amenaza ritual o marcas visibles.\nCUÁNDO: Cuando intenta advertir, disuadir, marcar territorio o evitar un conflicto mediante amenaza no verbal.\nQUÉ HACE: Obtiene +1 a tiradas para disuadir acercamientos, evitar ataques inmediatos o comunicar que cruzar cierto límite tendrá consecuencias.\nRestricción:\nSolo funciona ante criaturas capaces de percibir e interpretar la señal como advertencia.\nDESCRIPCIÓN:\nEl cuerpo de la criatura dice “no sigas” antes de que empiece la violencia."}, {"name": "Presencia Perturbadora", "cost": 2, "costText": "2 PR", "category": "11. Rasgos de Interacción, Presencia y Utilidad", "text": "La criatura altera la calma de quienes intentan tratar con ella.\nCUÁNDO: Cuando una criatura intenta persuadirla, engañarla, calmarla o negociar con ella.\nQUÉ HACE: La criatura que intenta la interacción sufre −1 a esa tirada.\nRestricción:\nDebe definirse el origen de la perturbación: mirada fija, olor a muerte, voz quebrada, movimientos antinaturales, aura opresiva, silencio absoluto, rostro inexpresivo u otro elemento claro.\nDESCRIPCIÓN:\nHablar con ella resulta incómodo. La criatura no necesita amenazar para volver difícil la conversación.\n12. Rasgos de Técnicas\nEstos rasgos modifican la relación de una criatura con sus Técnicas.\nPueden representar entrenamiento, biología canalizadora, núcleos energéticos, afinidad elemental, corrupción interna, torpeza ritual, inestabilidad mágica, cuerpos mal adaptados al uso de poder o criaturas creadas específicamente para resistir una Fuerza.\nEstos rasgos no entregan Técnicas por sí mismos salvo que lo indiquen. Para obtener PC adicionales, se usa Afinidad con Técnicas."}, {"name": "Canalización Eficiente", "cost": 2, "costText": "2 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura usa sus Técnicas con menor desgaste.\nCUÁNDO: Cuando paga el coste de Resistencia de una Técnica.\nQUÉ HACE: Reduce en 1 el coste de Resistencia de sus Técnicas.\nEl coste de una Técnica nunca puede bajar de 1.\nRestricción:\nDebe definirse el origen de la eficiencia: respiración entrenada, núcleo estable, cuerpo conductor, ritual biológico, programación precisa, sangre elemental u otro mecanismo equivalente.\nDESCRIPCIÓN:\nLa criatura no desperdicia fuerza al canalizar. El poder pasa por su cuerpo con menos resistencia."}, {"name": "Canalización Superior", "cost": 3, "costText": "3 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura está especialmente optimizada para usar Técnicas.\nCUÁNDO: Cuando paga el coste de Resistencia de una Técnica.\nQUÉ HACE: Reduce en 2 el coste de Resistencia de sus Técnicas.\nEl coste de una Técnica nunca puede bajar de 1.\nRestricción:\nEste rasgo reemplaza Canalización Eficiente. No se suman.\nDESCRIPCIÓN:\nSu cuerpo, núcleo o entrenamiento convierten las Técnicas en movimientos casi naturales."}, {"name": "Técnica Precisa", "cost": 2, "costText": "2 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura ejecuta sus Técnicas con gran control.\nCUÁNDO: Cuando realiza una tirada de ataque con una Técnica.\nQUÉ HACE: Obtiene +1 a esa tirada de ataque.\nRestricción:\nSolo aplica a Técnicas que requieran tirada de ataque. No aplica a ataques naturales, armas comunes ni rasgos.\nDESCRIPCIÓN:\nLa Técnica sale limpia. No se dispersa, no tiembla, no pierde dirección."}, {"name": "Técnica Imponente", "cost": 2, "costText": "2 PR", "category": "12. Rasgos de Técnicas", "text": "Las Técnicas de la criatura son más difíciles de resistir.\nCUÁNDO: Cuando una Técnica de la criatura impone una Salvación.\nQUÉ HACE: La ND de Salvación de esa Técnica aumenta en +1.\nRestricción:\nNo afecta rasgos ofensivos ni auras. Solo afecta Técnicas.\nDESCRIPCIÓN:\nLa Técnica cae con más peso. El cuerpo, la mente o el espíritu del objetivo tienen menos margen para resistirla."}, {"name": "Técnica Brutal", "cost": 2, "costText": "2 PR", "category": "12. Rasgos de Técnicas", "text": "Las Técnicas dañinas de la criatura golpean con más fuerza.\nCUÁNDO: Cuando una Técnica de la criatura inflige daño directo.\nQUÉ HACE: Esa Técnica inflige +2 de daño.\nRestricción:\nNo aumenta daño persistente, veneno, sangrado, terreno peligroso, auras ni daño causado por rasgos.\nDESCRIPCIÓN:\nLa Técnica no es más compleja. Solo golpea más duro."}, {"name": "Técnica Sostenida", "cost": 2, "costText": "2 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura mantiene mejor sus Técnicas temporales.\nCUÁNDO: Cuando usa una Técnica con duración de 1 ronda o más.\nQUÉ HACE: La duración de esa Técnica aumenta en 1 ronda.\nRestricción:\nNo puede aplicarse a Técnicas instantáneas, Técnicas de recuperación inmediata, invocaciones que ya tengan duración fija superior a 3 rondas ni efectos que duren hasta descanso.\nDESCRIPCIÓN:\nLa Técnica tarda más en apagarse. El cuerpo de la criatura la sostiene un poco más allá de lo normal."}, {"name": "Técnica Instintiva", "cost": 1, "costText": "1 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura puede usar una Técnica simple con rapidez instintiva.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: Elige una Técnica de coste 1 de Resistencia. Esa Técnica puede usarse como Acción Rápida.\nRestricción:\nLa Técnica elegida debe definirse al crear la criatura. No puede ser una Técnica que ya requiera Acción Rápida, Reacción o que invoque criaturas.\nDESCRIPCIÓN:\nLa criatura no piensa la Técnica. La ejecuta como una mordida, un pestañeo o un reflejo."}, {"name": "Técnica Reactiva", "cost": 3, "costText": "3 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura puede responder con una Técnica ante el peligro.\nCUÁNDO: Como Reacción, cuando recibe
