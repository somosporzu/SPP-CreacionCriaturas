 daño.\nQUÉ HACE: Puede usar una Técnica definida al crear la criatura.\nLa Técnica debe tener coste de Resistencia 1 o 2 y no puede invocar criaturas ni crear zonas persistentes.\nLímite:\nRequiere gastar su Reacción. Solo puede usarse una vez por ronda.\nDESCRIPCIÓN:\nEl daño activa una respuesta inmediata. La criatura contesta con poder antes de que el enemigo pueda retirarse."}, {"name": "Reserva Técnica", "cost": 2, "costText": "2 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura posee una reserva separada para alimentar sus Técnicas.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: La criatura obtiene una reserva de 6 puntos de Resistencia que solo puede gastar para pagar Técnicas.\nEsta reserva no cuenta como Resistencia normal. No evita que la criatura caiga a 0 de Resistencia.\nCierre:\nLa reserva se recupera al terminar un descanso largo o por el método de recuperación definido para la criatura.\nDESCRIPCIÓN:\nLa criatura guarda poder en un núcleo, órgano, cristal, respiración, memoria o reserva energética separada de su cuerpo principal."}, {"name": "Afinidad con una Fuerza", "cost": 2, "costText": "2 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura está adaptada a una Fuerza concreta.\nCUÁNDO: Cuando recibe daño de una Técnica perteneciente a la Fuerza elegida.\nQUÉ HACE: Recibe la mitad del daño de esa Técnica.\nRestricción:\nLa Fuerza debe definirse al crear la criatura: Destrucción, Conservación, Transformación, Creación, Orden o Caos.\nEste rasgo solo reduce daño de Técnicas. No reduce daño de ataques naturales, armas, terreno, rasgos o auras, aunque compartan descripción narrativa.\nDESCRIPCIÓN:\nEsa Fuerza no le entra limpia. Su cuerpo, alma o núcleo la reconoce y la soporta mejor."}, {"name": "Absorción de una Fuerza", "cost": 4, "costText": "4 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura se alimenta de una Fuerza concreta.\nCUÁNDO: Cuando recibe daño de una Técnica perteneciente a la Fuerza elegida.\nQUÉ HACE: La criatura es inmune al daño de esa Técnica. Además, recupera Resistencia igual a la mitad del daño que habría recibido, redondeando hacia abajo.\nLa recuperación no puede superar su Resistencia máxima.\nRestricción:\nLa Fuerza debe definirse al crear la criatura: Destrucción, Conservación, Transformación, Creación, Orden o Caos.\nEste rasgo solo funciona contra Técnicas. No funciona contra ataques, rasgos, auras, terreno peligroso ni daño ambiental.\nDESCRIPCIÓN:\nLa Fuerza que debería dañarla la alimenta. La Técnica se convierte en calor, memoria, materia, orden, impulso o pura recuperación."}, {"name": "Refuerzo por Técnica", "cost": 2, "costText": "2 PR", "category": "12. Rasgos de Técnicas", "text": "El cuerpo de la criatura se fortalece al usar poder.\nCUÁNDO: Después de usar una Técnica.\nQUÉ HACE: Obtiene +1 a Defensa hasta el inicio de su próximo turno.\nLa Defensa final no puede superar 16.\nLímite:\nSolo puede beneficiarse de este rasgo una vez por ronda.\nDESCRIPCIÓN:\nCada Técnica endurece el cuerpo de la criatura por un momento. La energía usada deja una capa, postura o tensión defensiva."}, {"name": "Hambre de Técnica", "cost": 2, "costText": "2 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura se vuelve más peligrosa después de canalizar poder.\nCUÁNDO: Después de usar una Técnica.\nQUÉ HACE: Su próximo ataque natural antes del final de su turno inflige +1d6 de daño.\nLímite:\nSolo puede beneficiarse de este rasgo una vez por turno.\nDESCRIPCIÓN:\nLa Técnica despierta el cuerpo. Después de canalizar, la criatura muerde, golpea o corta con más hambre."}, {"name": "Técnica Segura", "cost": 2, "costText": "2 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura está protegida contra los fallos de su propia canalización.\nCUÁNDO: Cuando una de sus Técnicas tendría un efecto negativo sobre sí misma por fallo, inestabilidad o retroceso.\nQUÉ HACE: Tiene Ventaja en la tirada o Salvación para evitar ese efecto negativo.\nRestricción:\nSolo aplica a Técnicas que indiquen una consecuencia negativa para el usuario.\nDESCRIPCIÓN:\nLa criatura tiene válvulas, sellos, entrenamiento o instinto suficiente para no romperse con su propio poder."}, {"name": "Ecos de Técnica", "cost": 2, "costText": "2 PR", "category": "12. Rasgos de Técnicas", "text": "La criatura deja una resonancia menor después de usar una Técnica.\nCUÁNDO: Después de usar una Técnica que inflija daño directo.\nQUÉ HACE: El siguiente ataque natural de la criatura antes del final de su próximo turno inflige +2 de daño.\nLímite:\nSolo puede beneficiarse de este rasgo una vez por ronda.\nRestricción:\nNo se activa con Técnicas de curación, soporte, invocación, terreno, aura o daño persistente.\nDESCRIPCIÓN:\nLa Técnica deja algo vibrando en el cuerpo. El siguiente golpe todavía lleva parte de esa fuerza."}, {"name": "Potencia de Salvación", "cost": 1, "costText": "1 PR por compra, máximo 2", "category": "1. Rasgos de Desarrollo, Conceptos y Naturalezas", "text": "Primera compra: la ND de Salvación de sus rasgos aumenta a 12. Segunda compra: la sube a 14. Solo afecta rasgos que indiquen expresamente que pueden beneficiarse de Potencia de Salvación."}], "disadvantages": [{"name": "Torpeza Sensorial", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura tiene un sentido limitado, atrofiado, confuso o poco confiable.\nCUÁNDO: Cuando realiza tiradas de Percepción usando el sentido elegido.\nQUÉ HACE: Tiene Desventaja en esas tiradas.\nRestricción:\nEl sentido afectado debe definirse al crear la criatura: vista, oído, olfato, tacto, percepción térmica, percepción espiritual u otro sentido relevante.\nCierre:\nNo aplica si la criatura usa otro sentido no afectado para percibir el mismo estímulo.\nDESCRIPCIÓN:\nLa criatura percibe mal una parte del mundo. Puede ver borroso, oír poco, no detectar olores, confundir vibraciones o interpretar mal señales que otras criaturas notarían de inmediato."}, {"name": "Movimiento Lento", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura se mueve con lentitud por peso, torpeza, rigidez, arrastre, edad, heridas, tamaño o diseño corporal.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Su movimiento se reduce en 3 metros.\nLímite:\nPuede tomarse varias veces, pero el movimiento final de la criatura no puede quedar por debajo de 3 metros.\nDESCRIPCIÓN:\nLa criatura avanza despacio. No necesariamente es débil, pero le cuesta perseguir, reposicionarse o escapar."}, {"name": "Cuerpo Ruidoso", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura hace demasiado ruido al moverse o existir.\nCUÁNDO: Cuando intenta ocultarse, moverse en silencio, emboscar o pasar desapercibida mediante silencio físico.\nQUÉ HACE: Tiene Desventaja en esas tiradas.\nSi el ruido hace imposible el sigilo en una situación concreta, el Director de Juego puede determinar que la criatura no puede intentar la tirada.\nRestricción:\nDebe definirse el origen del ruido: placas que chocan, respiración pesada, chasquidos, cadenas, zumbido, goteo, crujidos, maquinaria, huesos, olor acompañado de moscas u otro rasgo claro.\nDESCRIPCIÓN:\nLa criatura anuncia su presencia incluso cuando intenta evitarlo."}, {"name": "Aversión a la Luz", "pr": 1, "category": "13. Desventajas Menores", "text": "La luz intensa interfiere con la criatura.\nCUÁNDO: Mientras esté bajo luz intensa, luz solar directa o una fuente de iluminación equivalente definida por el Diseñador.\nQUÉ HACE: Tiene Desventaja en tiradas de ataque y Percepción basadas en la vista.\nCierre:\nEl efecto termina cuando la criatura sale de la luz intensa, se cubre, entra en sombra suficiente o la fuente de luz desaparece.\nDESCRIPCIÓN:\nLa luz hiere sus ojos, quema su piel, desordena su percepción o la obliga a moverse con incomodidad."}, {"name": "Dependencia Elemental", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura necesita contacto frecuente con un elemento, sustancia o condición ambiental para mantenerse estable.\nCUÁNDO: Si pasa más de 3 rondas completas sin contacto con el elemento definido.\nQUÉ HACE: Al inicio de cada uno de sus turnos, sufre 1d6 de daño.\nEl tipo de daño debe definirse al crear la criatura según la naturaleza de la dependencia.\nCierre:\nEl daño deja de aplicarse cuando la criatura vuelve a estar en contacto con el elemento requerido.\nRestricción:\nEl elemento o condición debe definirse al crear la criatura: agua, fuego, sombra, tierra, aire puro, frío, calor, electricidad, corrupción, luz, oscuridad, sangre, metal, humedad u otro equivalente.\nDESCRIPCIÓN:\nLa criatura no solo prefiere ese elemento. Lo necesita. Sin él, su cuerpo se seca, apaga, deshace, enfría, quema o pierde cohesión."}, {"name": "Instinto Compulsivo", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura posee un impulso instintivo fuerte ante un estímulo concreto.\nCUÁNDO: Cuando percibe el estímulo definido y no está bajo una amenaza inmediata más importante.\nQUÉ HACE: Debe superar una Salvación de Aura contra ND 10. Si falla, durante su turno debe dedicar su Acción Principal a acercarse al estímulo, alejarse de él, protegerlo, atacarlo o investigarlo, según se defina al crear la criatura.\nDuración:\nEl impulso dura hasta el final de ese turno.\nCierre:\nEl efecto termina antes si el estímulo desaparece, deja de ser detectable o una amenaza directa obliga a la criatura a responder para sobrevivir.\nRestricción:\nEl estímulo y la conducta deben definirse al crear la criatura.\nEjemplos:\nHuir del fuego.\nProteger huevos.\nPerseguir sangre fresca.\nAtacar luces brillantes.\nInvestigar objetos metálicos.\nDefender a una reina.\nComer carroña visible.\nDESCRIPCIÓN:\nLa criatura no siempre decide con calma. Hay estímulos que la arrastran a actuar, aunque no sea la opción más inteligente."}, {"name": "Canalización Costosa", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura gasta más energía de lo normal al usar Técnicas.\nCUÁNDO: Cuando paga el coste de Resistencia de una Técnica.\nQUÉ HACE: El coste de Resistencia de sus Técnicas aumenta en 1.\nRestricción:\nSolo puede tomarse si la criatura posee al menos una Técnica.\nDESCRIPCIÓN:\nEl poder no fluye limpio. Cada Técnica exige más respiración, sangre, calor, memoria, energía o estabilidad de la que debería."}, {"name": "Técnica Imprecisa", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura canaliza Técnicas con poca precisión.\nCUÁNDO: Cuando realiza una tirada de ataque con una Técnica.\nQUÉ HACE: Sufre −1 a esa tirada de ataque.\nRestricción:\nSolo aplica a Técnicas que requieran tirada de ataque.\nDESCRIPCIÓN:\nLa Técnica sale torcida, tiembla, se dispersa o tarda una fracción de más en cerrarse sobre el objetivo."}, {"name": "Técnica Lenta", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura necesita preparación para canalizar Técnicas.\nCUÁNDO: Cuando usa una Técnica.\nQUÉ HACE: No puede usar Técnicas como Acción Rápida ni Reacción.\nLas Técnicas que normalmente se usarían como Acción Rápida pasan a requerir Acción Principal. Las Técnicas que normalmente se usarían como Reacción no pueden usarse.\nRestricción:\nSolo puede tomarse si la criatura posee Técnicas rápidas o reactivas.\nDESCRIPCIÓN:\nEl poder requiere postura, respiración, palabras, carga interna o concentración lenta. No brota como reflejo."}, {"name": "Vulnerable a una Fuerza", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura es débil ante Técnicas de una Fuerza concreta.\nCUÁNDO: Cuando recibe daño directo de una Técnica perteneciente a la Fuerza definida.\nQUÉ HACE: Recibe +1d6 de daño adicional.\nRestricción:\nLa Fuerza debe definirse al crear la criatura.\nNo aumenta daño de rasgos, armas, auras ni terreno aunque compartan descripción narrativa.\nDESCRIPCIÓN:\nEsa Fuerza entra demasiado bien en su cuerpo, alma o núcleo."}, {"name": "Debilidad de Concentración", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura pierde estabilidad cuando recibe daño.\nCUÁNDO: Mientras mantiene una Técnica con duración activa y recibe daño.\nQUÉ HACE: Debe superar una Salvación de Aura contra ND 10. Si falla, la Técnica termina.\nRestricción:\nSolo puede tomarse si la criatura posee Técnicas con duración.\nDESCRIPCIÓN:\nLa criatura puede sostener poder, pero no soporta bien hacerlo mientras la hieren."}, {"name": "Técnica Condicionada", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura solo puede usar Técnicas bajo una condición concreta.\nCUÁNDO: Mientras no se cumpla la condición definida.\nQUÉ HACE: No puede usar Técnicas.\nCierre:\nPuede usar Técnicas cuando la condición vuelva a cumplirse.\nRestricción:\nLa condición debe definirse al crear la criatura y debe ser relevante en juego: estar en agua, estar bajo sombra, tocar tierra, tener línea de visión, estar herida, estar junto a aliados, estar en su hábitat, haber recibido daño este combate u otra condición concreta.\nDESCRIPCIÓN:\nEl poder de la criatura no siempre está disponible. Necesita un lugar, estado, postura, estímulo o vínculo para activarlo."}, {"name": "Ceguera en Oscuridad", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura ve muy mal en ausencia de luz.\nCUÁNDO: Mientras esté en oscuridad total o penumbra intensa.\nQUÉ HACE: Tiene Desventaja en tiradas de Percepción basadas en la vista y en ataques que dependan de ver al objetivo.\nCierre:\nTermina cuando entra en una zona suficientemente iluminada o usa otro sentido capaz de sustituir la vista.\nDESCRIPCIÓN:\nLa oscuridad le roba forma al mundo. Sin luz, la criatura duda, falla distancias y pierde detalles."}, {"name": "Cuerpo Seco", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura se deteriora en calor, sequedad o ambientes áridos.\nCUÁNDO: Mientras permanezca en un ambiente seco, desértico, muy caluroso o sin humedad suficiente durante 3 rondas completas.\nQUÉ HACE: Sufre −1 a sus tiradas de Cuerpo y Destreza mientras siga en ese ambiente.\nCierre:\nEl efecto termina cuando recupera humedad, entra en agua, sombra húmeda, lluvia, pantano o un entorno adecuado.\nDESCRIPCIÓN:\nEl cuerpo se agrieta, se tensa o se vuelve torpe cuando pierde humedad."}, {"name": "Cuerpo Empapado", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura funciona mal al mojarse.\nCUÁNDO: Mientras esté empapada, sumergida o bajo lluvia intensa.\nQUÉ HACE: Sufre −1 a sus tiradas de ataque y a tiradas relacionadas con movimiento preciso.\nCierre:\nEl efecto termina cuando se seca o sale del ambiente que la empapa.\nDESCRIPCIÓN:\nEl agua pesa, apaga, hincha, enfría o vuelve torpe aquello que mantiene estable a la criatura."}, {"name": "Reacción al Dolor", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura pierde precisión cuando recibe daño.\nCUÁNDO: Después de recibir daño.\nQUÉ HACE: Sufre −1 a su próxima tirada de ataque antes del final de su próximo turno.\nLímite:\nEste penalizador no se acumula consigo mismo.\nDESCRIPCIÓN:\nEl dolor la distrae. No la detiene, pero ensucia su próximo golpe."}, {"name": "Fobia Específica", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura teme un estímulo concreto.\nCUÁNDO: Cuando percibe el estímulo definido a 12 metros o menos.\nQUÉ HACE: Debe superar una Salvación de Aura contra ND 10 o queda Asustada hasta el final de su turno.\nRestricción:\nEl estímulo debe definirse al crear la criatura: fuego, luz, metal, sangre, agua profunda, símbolos sagrados, cadáveres, depredadores, sonido agudo u otro elemento concreto.\nDESCRIPCIÓN:\nAlgo específico atraviesa su instinto. Puede ser irracional, heredado, programado o aprendido."}, {"name": "Naturaleza Inflexible", "pr": 1, "category": "13. Desventajas Menores", "text": "La criatura solo actúa bien usando su Naturaleza principal.\nCUÁNDO: Cuando intenta justificar una acción con una Naturaleza distinta a su Naturaleza principal.\nQUÉ HACE: Sufre −1 a esa tirada.\nRestricción:\nSolo debe usarse en criaturas inteligentes, entrenadas o complejas que podrían cambiar de enfoque, pero que tienen una conducta rígida.\nDESCRIPCIÓN:\nLa criatura sabe actuar de una manera. Cuando intenta desviarse de esa forma, pierde claridad."}, {"name": "Canalización Ruidosa", "pr": 1, "category": "13. Desventajas Menores", "text": "Las Técnicas de la criatura producen señales evidentes.\nCUÁNDO: Cuando usa una Técnica.\nQUÉ HACE: Hasta el inicio de su próximo turno, la criatura no puede beneficiarse de Sigilo, Camuflaje, Mimetismo ni efectos similares de ocultamiento.\nRestricción:\nSolo puede tomarse si la criatura posee al menos una Técnica.\nDESCRIPCIÓN:\nSu poder cruje, brilla, huele, canta, vibra o deja una marca fácil de seguir."}, {"name": "Dolor de Movimiento", "pr": 1, "category": "13. Desventajas Menores", "text": "Moverse demasiado fuerza el cuerpo de la criatura.\nCUÁNDO: Si la criatura se mueve más de 6 metros durante su turno.\nQUÉ HACE: Sufre −1 a su próxima tirada antes del final de su próximo turno.\nCierre:\nEl penalizador se pierde si no se usa antes del final de su próximo turno.\nDESCRIPCIÓN:\nCada desplazamiento largo tira de tendones, placas, heridas, engranajes o articulaciones mal formadas.\n14. Desventajas Medias\nLas desventajas medias otorgan +2 PR.\nRepresentan limitaciones importantes. Afectan de forma frecuente a la criatura, condicionan su forma de actuar o crean una debilidad clara que los personajes pueden explotar."}, {"name": "Sin Reacción", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura reacciona mal ante oportunidades rápidas, carece de reflejos tácticos o su cuerpo no puede responder fuera de su propio turno.\nCUÁNDO: Siempre activa.\nQUÉ HACE: No puede realizar Ataques de Oportunidad ni usar rasgos, Técnicas o efectos que requieran gastar su Reacción.\nDESCRIPCIÓN:\nLa criatura puede ser fuerte, peligrosa o resistente, pero no responde bien a los cambios inmediatos del combate. Sus enemigos pueden rodearla, retirarse o forzar movimientos con menos riesgo."}, {"name": "Vulnerabilidad a Daño", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura es especialmente vulnerable a un tipo de daño concreto.\nCUÁNDO: Cuando recibe daño del tipo elegido al crearla.\nQUÉ HACE: Recibe +1d6 de daño adicional de ese tipo.\nRestricción:\nEl tipo de daño debe definirse al crear la criatura: Fuego, Hielo, Corrosivo, Radiante, Sombra, Mental, Contundente, Cortante, Penetrante u otro tipo permitido por el sistema.\nDESCRIPCIÓN:\nSu cuerpo, espíritu o estructura falla ante cierto daño. El fuego la abre, el hielo la quiebra, la luz la purga, el metal la desgarra o la corrupción la envenena con más fuerza."}, {"name": "Fragilidad Física", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura tiene un cuerpo menos resistente de lo esperado para su ND.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: Reduce su Resistencia máxima en 10.\nLa Resistencia final nunca puede quedar por debajo de 5.\nDESCRIPCIÓN:\nLa criatura puede ser rápida, peligrosa o difícil de alcanzar, pero su cuerpo no soporta castigo prolongado."}, {"name": "Defensa Deficiente", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura es fácil de impactar por tamaño, torpeza, lentitud, exceso de confianza, cuerpo expuesto o movimientos predecibles.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Reduce su Defensa en 2.\nDESCRIPCIÓN:\nNo evita bien los golpes. Puede que sea enorme, rígida, demasiado agresiva o que simplemente no entienda cómo proteger sus puntos vulnerables."}, {"name": "Torpeza Motriz", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura tiene problemas para moverse con precisión.\nCUÁNDO: Cuando realiza tiradas de Destreza relacionadas con equilibrio, acrobacias, sigilo físico, maniobras finas, esquiva, trepar con precisión o movimientos delicados.\nQUÉ HACE: Tiene Desventaja en esas tiradas.\nDESCRIPCIÓN:\nSu cuerpo no está hecho para movimientos finos. Puede ser demasiado pesado, rígido, desigual, tembloroso, viejo, segmentado o simplemente torpe."}, {"name": "Debilidad de Cuerpo", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura tiene poca fuerza bruta o mala capacidad para resistir esfuerzo físico directo.\nCUÁNDO: Cuando realiza tiradas de Cuerpo para empujar, cargar, levantar, forcejear, resistir desplazamientos, romper objetos, mantener presas o soportar esfuerzo físico directo.\nQUÉ HACE: Tiene Desventaja en esas tiradas.\nDESCRIPCIÓN:\nLa criatura no falla por falta de agilidad, sino por falta de fuerza útil. Puede ser liviana, hueca, frágil, blanda, atrofiada o estar hecha para precisión y no para potencia."}, {"name": "Debilidad de Aura", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura tiene poca estabilidad mental, espiritual o emocional.\nCUÁNDO: Cuando realiza Salvaciones de Aura contra miedo, control, fascinación, confusión, compulsión, presión espiritual o efectos mentales equivalentes.\nQUÉ HACE: Tiene Desventaja en esas Salvaciones.\nDESCRIPCIÓN:\nSu voluntad se rompe con facilidad. Puede ser una mente simple, un espíritu incompleto, una criatura demasiado emocional o un cuerpo sin centro interno firme."}, {"name": "Dependencia Ambiental", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura necesita permanecer en un ambiente concreto para funcionar correctamente.\nCUÁNDO: Si pasa más de 3 rondas completas fuera del ambiente definido.\nQUÉ HACE: Mientras permanezca fuera de ese ambiente, sufre −1 a todas sus tiradas y su movimiento se reduce en 3 metros.\nCierre:\nEl efecto termina cuando vuelve al ambiente requerido.\nRestricción:\nEl ambiente debe definirse al crear la criatura: agua profunda, oscuridad, frío extremo, calor intenso, humedad, tierra blanda, corrupción, luz solar, vegetación densa, niebla, fuego cercano u otro entorno concreto.\nDESCRIPCIÓN:\nLa criatura puede sobrevivir fuera de su ambiente, pero no funciona bien. Se seca, se enfría, se asfixia, pierde ritmo, se vuelve torpe o se debilita."}, {"name": "Exposición de Núcleo", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura posee un punto vulnerable evidente o parcialmente expuesto.\nCUÁNDO: Cuando una criatura atacante declara que apunta al núcleo, órgano, gema, máscara, corazón externo, ojo central, sello, cicatriz o punto vulnerable definido.\nQUÉ HACE: El ataque contra la criatura obtiene +1 a la tirada de ataque.\nRestricción:\nEl punto vulnerable debe definirse al crear la criatura y debe poder ser percibido o descubierto razonablemente.\nDESCRIPCIÓN:\nAlgo importante está demasiado a la vista. Quien entienda la anatomía de la criatura sabe dónde golpear."}, {"name": "Compulsión Sostenida", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura está dominada por una conducta persistente ante cierto estímulo.\nCUÁNDO: Mientras perciba el estímulo definido y no esté bajo una amenaza inmediata más importante.\nQUÉ HACE: Debe superar una Salvación de Aura contra ND 10 al inicio de su turno. Si falla, debe dedicar su Acción Principal de ese turno a cumplir la conducta definida.\nDuración:\nSe repite al inicio de cada turno mientras el estímulo siga presente y detectable.\nCierre:\nLa compulsión deja de aplicarse si el estímulo desaparece, deja de ser detectable, la criatura queda Inconsciente o aparece una amenaza directa que exija responder para sobrevivir.\nRestricción:\nEl estímulo y la conducta deben definirse al crear la criatura.\nDESCRIPCIÓN:\nLa criatura no solo reacciona una vez. Su conducta vuelve una y otra vez mientras el estímulo esté presente: proteger, perseguir, alimentarse, huir, cavar, cantar, custodiar, destruir o acercarse."}, {"name": "Equipo Dependiente", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura depende de una pieza de equipo, foco, arma, máscara, armadura, cristal, sello, herramienta o componente externo para usar parte de sus capacidades.\nCUÁNDO: Si pierde, rompe o se le retira el objeto definido.\nQUÉ HACE: Mientras no tenga ese objeto, pierde acceso a un rasgo, Técnica o acción especial definida al crear la criatura.\nCierre:\nEl efecto termina si recupera el objeto, lo repara, lo reemplaza o vuelve a conectarse con él mediante el método definido.\nRestricción:\nEl objeto y la capacidad afectada deben definirse al crear la criatura.\nDESCRIPCIÓN:\nNo todo poder está en el cuerpo. Algunas criaturas dependen de máscaras, armas, núcleos, sellos, jaulas, tótems, cristales o herramientas sin las cuales quedan incompletas."}, {"name": "Canalización Agotadora", "pr": 2, "category": "14. Desventajas Medias", "text": "El poder desgasta severamente a la criatura.\nCUÁNDO: Cuando paga el coste de Resistencia de una Técnica.\nQUÉ HACE: El coste de Resistencia de sus Técnicas aumenta en 2.\nRestricción:\nEste rasgo reemplaza Canalización Costosa. No se suman.\nSolo puede tomarse si la criatura posee al menos una Técnica.\nDESCRIPCIÓN:\nCada Técnica arranca más del cuerpo de lo normal. La criatura paga poder con aliento, sangre, calor o estabilidad."}, {"name": "Técnica Inestable", "pr": 2, "category": "14. Desventajas Medias", "text": "Las Técnicas de la criatura pueden fallar al activarse.\nCUÁNDO: Cuando intenta usar una Técnica.\nQUÉ HACE: Antes de resolver la Técnica, debe superar una Salvación de Aura contra ND 10.\nSi falla, la Técnica no se activa, pero la criatura paga igualmente su coste de Resistencia.\nRestricción:\nSolo puede tomarse si la criatura posee al menos una Técnica.\nDESCRIPCIÓN:\nEl poder no siempre responde. A veces se corta antes de tomar forma, aunque el desgaste ya se haya pagado."}, {"name": "Foco Necesario", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura necesita un foco, órgano, cristal, tótem, máscara, sello, arma, canto o núcleo para usar Técnicas.\nCUÁNDO: Mientras no tenga acceso al foco definido.\nQUÉ HACE: No puede usar Técnicas.\nCierre:\nPuede volver a usar Técnicas cuando recupere, repare, regenere o vuelva a conectar con el foco.\nRestricción:\nEl foco debe definirse al crear la criatura y debe poder ser dañado, retirado, silenciado, bloqueado o neutralizado de alguna forma clara.\nDESCRIPCIÓN:\nLa Técnica no nace solo de la voluntad. Necesita un punto de canalización, y sin él la criatura queda muda de poder."}, {"name": "Técnica Vulnerable", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura se abre al canalizar poder.\nCUÁNDO: Después de usar una Técnica.\nQUÉ HACE: Sufre −1 a Defensa hasta el inicio de su próximo turno.\nRestricción:\nSolo puede tomarse si la criatura posee al menos una Técnica.\nDESCRIPCIÓN:\nAl usar poder, baja la guardia. Su cuerpo se tensa, sus sentidos se enfocan o sus defensas se abren."}, {"name": "Técnica Dolorosa", "pr": 2, "category": "14. Desventajas Medias", "text": "Usar Técnicas daña el cuerpo de la criatura.\nCUÁNDO: Después de usar una Técnica.\nQUÉ HACE: Sufre 1d6 de daño.\nEste daño no puede reducirse, resistirse ni absorberse.\nRestricción:\nSolo puede tomarse si la criatura posee al menos una Técnica.\nDESCRIPCIÓN:\nCada Técnica raspa por dentro. No es solo cansancio: el poder hiere al salir."}, {"name": "Rechazo de Fuerza", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura tiene una incompatibilidad con una Fuerza concreta.\nCUÁNDO: Cuando intenta usar una Técnica perteneciente a la Fuerza definida.\nQUÉ HACE: Sufre Desventaja en la tirada de ataque de esa Técnica o el objetivo tiene Ventaja en la Salvación contra esa Técnica.\nRestricción:\nLa Fuerza debe definirse al crear la criatura: Destrucción, Conservación, Transformación, Creación, Orden o Caos.\nSolo puede tomarse si la criatura posee al menos una Técnica de esa Fuerza.\nDESCRIPCIÓN:\nLa Fuerza no encaja bien con su cuerpo, alma, núcleo o entrenamiento. La Técnica sale débil, torcida o fácil de resistir."}, {"name": "Vulnerable a Técnicas", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura recibe peor las Técnicas que otros cuerpos.\nCUÁNDO: Cuando recibe daño directo de una Técnica.\nQUÉ HACE: Recibe +1d6 de daño adicional.\nRestricción:\nNo aumenta daño persistente, terreno peligroso, veneno, sangrado ni efectos que no sean daño directo de una Técnica.\nDESCRIPCIÓN:\nSu cuerpo aguanta golpes, pero el poder trabajado le entra demasiado profundo."}, {"name": "Ruptura de Concentración", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura mantiene mal sus Técnicas bajo presión.\nCUÁNDO: Mientras mantiene una Técnica con duración activa y recibe daño.\nQUÉ HACE: La Técnica termina inmediatamente.\nRestricción:\nEste rasgo reemplaza Debilidad de Concentración. No se suman.\nSolo puede tomarse si la criatura posee Técnicas con duración.\nDESCRIPCIÓN:\nCuando la hieren, el poder sostenido se rompe. La criatura no puede mantener ambas cosas: dolor y control."}, {"name": "Sensible a la Luz Intensa", "pr": 2, "category": "14. Desventajas Medias", "text": "La luz intensa daña o desestabiliza a la criatura.\nCUÁNDO: Mientras esté bajo luz intensa o luz solar directa.\nQUÉ HACE: Al inicio de su turno, sufre 1d6 de daño.\nCierre:\nEl daño deja de aplicarse cuando entra en sombra suficiente, se cubre o la fuente de luz desaparece.\nDESCRIPCIÓN:\nLa luz no solo molesta. Quema, disuelve, seca, purga o rompe la cohesión de la criatura."}, {"name": "Cuerpo Inflamable", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura prende con facilidad.\nCUÁNDO: Cuando recibe daño de Fuego.\nQUÉ HACE: Además del daño normal, queda Quemada hasta el final de su próximo turno.\nMientras esté Quemada por esta desventaja, sufre 1d6 de daño de Fuego al inicio de su turno.\nDESCRIPCIÓN:\nPiel seca, aceite, pelaje, resina, papel, madera o gases internos hacen que el fuego se agarre a la criatura con facilidad."}, {"name": "Cuerpo Conductivo", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura conduce electricidad, energía o descargas con facilidad.\nCUÁNDO: Cuando recibe daño de Rayo, Electricidad o una descarga equivalente.\nQUÉ HACE: Además del daño normal, pierde su Reacción hasta el inicio de su próximo turno.\nDESCRIPCIÓN:\nLa descarga corre por su cuerpo y retrasa su respuesta. Músculos, cables, fluidos o metales internos se traban durante un instante."}, {"name": "Sin Voz", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura no puede producir voz, canto, rugidos complejos ni sonidos articulados.\nCUÁNDO: Siempre activa.\nQUÉ HACE: No puede usar Técnicas, rasgos, órdenes, engaños o interacciones que requieran voz o sonido articulado.\nRestricción:\nNo impide comunicarse por otros medios si la criatura posee un rasgo apropiado.\nDESCRIPCIÓN:\nLa criatura puede ser inteligente o expresiva, pero no puede usar la voz como herramienta."}, {"name": "Sin Manos Funcionales", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura no posee manos, dedos, pinzas finas ni apéndices capaces de manipulación precisa.\nCUÁNDO: Siempre activa.\nQUÉ HACE: No puede usar herramientas finas, armas que requieran empuñadura, cerraduras, escritura manual, gestos complejos ni acciones que requieran manipulación precisa.\nDESCRIPCIÓN:\nEl cuerpo sirve para correr, morder, golpear o arrastrar, pero no para trabajo fino."}, {"name": "Dependencia de Grupo", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura funciona peor cuando está aislada.\nCUÁNDO: Mientras no tenga aliados conscientes a 6 metros o menos.\nQUÉ HACE: Sufre −1 a todas sus tiradas.\nCierre:\nEl efecto termina cuando vuelve a tener al menos un aliado consciente a 6 metros o menos.\nDESCRIPCIÓN:\nLa criatura necesita señales, presencia, olor, ánimo o coordinación de otros. Sola pierde seguridad."}, {"name": "Recuperación Bloqueada", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura no puede recuperar Resistencia con facilidad.\nCUÁNDO: Siempre activa.\nQUÉ HACE: No puede recuperar Resistencia mediante rasgos de recuperación o regeneración propios.\nPuede recibir curación externa normalmente, salvo que otra desventaja diga lo contrario.\nDESCRIPCIÓN:\nEl cuerpo no se repara por sí mismo. No cierra, no regenera, no recompone piezas o no recupera energía interna sin ayuda."}, {"name": "Curación Específica", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura solo puede recuperar Resistencia mediante un método concreto.\nCUÁNDO: Siempre activa.\nQUÉ HACE: No puede recuperar Resistencia salvo mediante la fuente definida al crearla.\nRestricción:\nLa fuente debe ser concreta: sangre, fuego, agua, sombra, reparación mecánica, energía corrupta, luz sagrada, tierra fértil, electricidad, carne fresca, canto de la colmena u otra fuente equivalente.\nDESCRIPCIÓN:\nLa criatura no sana con cualquier medio. Necesita una sustancia, energía, rito, reparación o entorno específico."}, {"name": "Herida Persistente", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura se deteriora cuando queda herida.\nCUÁNDO: Cuando queda por debajo de la mitad de su Resistencia máxima.\nQUÉ HACE: Sufre −1 a sus tiradas de Cuerpo hasta que recupere Resistencia por encima de la mitad de su máximo.\nDESCRIPCIÓN:\nCuando el daño pasa cierto punto, el cuerpo ya no responde igual. Músculos, placas, órganos o piezas internas empiezan a fallar."}, {"name": "Territorio Obligado", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura evita abandonar un lugar, nido, altar, puerta, cadáver, tesoro, fuente o zona definida.\nCUÁNDO: Cuando intenta alejarse más de 12 metros del punto definido.\nQUÉ HACE: Debe superar una Salvación de Aura contra ND 10. Si falla, no puede alejarse voluntariamente más de esa distancia durante ese turno.\nCierre:\nLa restricción deja de aplicar si el punto definido es destruido, trasladado, reclamado por la criatura o deja de ser relevante.\nDESCRIPCIÓN:\nLa criatura está atada a un lugar o cosa. No por cadenas visibles necesariamente, sino por instinto, orden, hambre, magia, memoria o deber."}, {"name": "Vulnerabilidad a Material", "pr": 2, "category": "14. Desventajas Medias", "text": "Un material concreto atraviesa mejor las defensas de la criatura.\nCUÁNDO: Cuando recibe daño de un arma, herramienta o efecto hecho principalmente con el material definido.\nQUÉ HACE: Recibe +1d6 de daño adicional.\nRestricción:\nEl material debe definirse al crear la criatura: hierro, plata, madera, hueso, sal, obsidiana, cobre, cristal, piedra consagrada u otro material relevante del mundo.\nDESCRIPCIÓN:\nNo todo daño iguala. Cierto material rompe sus defensas con demasiada facilidad."}, {"name": "Sensible a Estados", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura resiste mal los estados alterados.\nCUÁNDO: Cuando realiza una Salvación contra un estado alterado físico o mental.\nQUÉ HACE: Sufre −1 a esa Salvación.\nDESCRIPCIÓN:\nSu cuerpo o mente se altera con facilidad. Toxinas, miedo, presión, control, inmovilización o confusión le entran mejor que a otras criaturas."}, {"name": "Hambre Distractora", "pr": 2, "category": "14. Desventajas Medias", "text": "La criatura se distrae ante comida, sangre, carroña, energía, metal, madera, luz u otra sustancia que desea consumir.\nCUÁNDO: Cuando percibe la fuente de alimento definida a 12 metros o menos y no está bajo una amenaza inmediata más importante.\nQUÉ HACE: Debe superar una Salvación de Aura contra ND 10. Si falla, sufre −1 a todas sus tiradas hasta el inicio de su próximo turno, salvo tiradas hechas para acercarse, consumir, proteger o reclamar esa fuente.\nCierre:\nEl efecto termina si la fuente desaparece, deja de ser detectable o aparece una amenaza directa que exija responder para sobrevivir.\nRestricción:\nLa fuente de alimento debe definirse al crear la criatura.\nDESCRIPCIÓN:\nNo es hambre simple. Es una distracción física, mental o espiritual que tira de la criatura incluso cuando debería concentrarse.\n15. Desventajas Mayores\nLas desventajas mayores otorgan +3 PR.\nRepresentan limitaciones severas. Una desventaja mayor debe cambiar de forma clara cómo se diseña, se usa o se enfrenta la criatura. No debe ser un detalle menor ni una debilidad rara vez aplicable."}, {"name": "Vulnerabilidad Grave", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura reacciona de forma catastrófica ante un tipo de daño concreto.\nCUÁNDO: Cuando recibe daño del tipo elegido al crearla.\nQUÉ HACE: Recibe +2d6 de daño adicional de ese tipo.\nRestricción:\nEl tipo de daño debe definirse al crear la criatura: Fuego, Hielo, Corrosivo, Radiante, Sombra, Mental, Contundente, Cortante, Penetrante u otro tipo permitido por el sistema.\nDESCRIPCIÓN:\nEse daño no solo hiere: rompe la estructura misma de la criatura. La quema desde dentro, la purga, la congela, la agrieta o deshace sus defensas."}, {"name": "Cuerpo Quebradizo", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura tiene una estructura física extremadamente frágil para su ND.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: Reduce su Resistencia máxima en 20.\nLa Resistencia final nunca puede quedar por debajo de 5.\nDESCRIPCIÓN:\nSu cuerpo puede tener poder, velocidad o capacidades peligrosas, pero no está hecho para recibir castigo. Vidrio, hueso hueco, carne seca, mecanismos delicados o energía inestable sostienen su forma."}, {"name": "Defensa Abierta", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura es muy fácil de impactar por tamaño, lentitud, torpeza, exceso de exposición o incapacidad para protegerse.\nCUÁNDO: Siempre activa.\nQUÉ HACE: Reduce su Defensa en 3.\nDESCRIPCIÓN:\nSu cuerpo deja demasiadas aberturas. Puede ser enorme, rígida, lenta, demasiado agresiva o incapaz de reaccionar a ataques simples."}, {"name": "Torpeza Motriz Grave", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura tiene una limitación severa de coordinación, equilibrio o precisión corporal, hasta el punto de que moverse con cuidado la vuelve vulnerable.\nCUÁNDO: Cuando realiza tiradas de Destreza relacionadas con equilibrio, esquiva, acrobacias, sigilo físico, movimientos precisos, trepar con cuidado, evitar trampas o maniobras delicadas.\nQUÉ HACE: Tiene Desventaja en esas tiradas.\nAdemás, mientras esté bajo una condición que limite su movimiento, como Derribado, Inmovilizado, Apresado o terreno que le impida moverse con normalidad, sufre −1 a Defensa.\nCierre:\nEl penalizador a Defensa termina cuando deja de estar bajo la condición que limita su movimiento.\nDESCRIPCIÓN:\nSu cuerpo no está hecho para precisión. Cuando pierde ritmo o posición, deja demasiadas aberturas."}, {"name": "Debilidad Física Grave", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura tiene una limitación severa para fuerza bruta y esfuerzo corporal directo.\nCUÁNDO: Cuando realiza tiradas de Cuerpo para empujar, cargar, levantar, romper, forcejear, mantener presas, resistir desplazamientos o soportar esfuerzo físico directo.\nQUÉ HACE: Tiene Desventaja en esas tiradas.\nAdemás, cuando falla una Salvación de Cuerpo contra un efecto que la empuje, derribe, aprese o inmovilice, también pierde 3 metros de movimiento hasta el final de su próximo turno.\nDESCRIPCIÓN:\nLa criatura puede ser precisa, rápida o peligrosa por otros medios, pero falla cuando debe imponer fuerza directa. Si algo la mueve o la retiene, le cuesta recomponerse."}, {"name": "Voluntad Fracturada", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura tiene una mente, alma o voluntad extremadamente inestable.\nCUÁNDO: Cuando realiza Salvaciones de Aura contra miedo, control, fascinación, confusión, compulsión, presión espiritual o efectos mentales equivalentes.\nQUÉ HACE: Tiene Desventaja en esas Salvaciones.\nAdemás, cuando falla una Salvación de Aura contra uno de esos efectos, sufre −1 a todas sus tiradas hasta el final de su próximo turno.\nDESCRIPCIÓN:\nSu voluntad no resiste bien. Cuando algo entra en su mente, no solo la afecta: la desordena."}, {"name": "Dependencia Vital", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura necesita un elemento, sustancia, vínculo o ambiente para seguir funcionando.\nCUÁNDO: Si pasa más de 3 rondas completas sin contacto con la fuente definida.\nQUÉ HACE: Al inicio de cada uno de sus turnos, sufre 2d6 de daño.\nEste daño no puede reducirse, resistirse ni absorberse.\nCierre:\nEl daño deja de aplicarse cuando la criatura vuelve a estar en contacto con la fuente requerida.\nRestricción:\nLa fuente debe definirse al crear la criatura: agua, fuego, sombra, tierra, aire puro, frío, calor, electricidad, corrupción, luz, oscuridad, sangre, metal, humedad, núcleo externo, tótem, canto, manada, reina u otro equivalente.\nDESCRIPCIÓN:\nSin esa fuente, la criatura no solo se debilita: empieza a fallar. Su cuerpo se seca, apaga, quiebra, pudre, pierde cohesión o se deshace."}, {"name": "Núcleo Expuesto", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura posee un punto vital evidente y vulnerable.\nCUÁNDO: Cuando una criatura atacante declara que apunta al núcleo, órgano, gema, máscara, corazón externo, ojo central, sello, cicatriz o punto vulnerable definido.\nQUÉ HACE: El ataque contra la criatura obtiene +2 a la tirada de ataque.\nSi el ataque impacta, inflige +1d6 de daño adicional.\nRestricción:\nEl punto vulnerable debe definirse al crear la criatura y debe poder ser percibido o descubierto razonablemente.\nDESCRIPCIÓN:\nLa criatura lleva su debilidad a la vista. Puede ser un ojo central, cristal vital, sello roto, costura abierta, corazón externo, máscara ritual o núcleo luminoso."}, {"name": "Compulsión Dominante", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura está dominada por una conducta intensa ante un estímulo concreto.\nCUÁNDO: Mientras perciba el estímulo definido y no exista una amenaza inmediata que pueda destruirla o impedirle actuar.\nQUÉ HACE: Al inicio de su turno, debe superar una Salvación de Aura contra ND 10.\nSi falla, debe usar su Acción Principal y su movimiento disponible para cumplir la conducta definida.\nDuración:\nSe repite al inicio de cada turno mientras el estímulo siga presente y detectable.\nCierre:\nLa compulsión deja de aplicarse si el estímulo desaparece, deja de ser detectable, la criatura queda Inconsciente o aparece una amenaza directa que pueda destruirla o anularla si no responde.\nRestricción:\nEl estímulo y la conducta deben definirse al crear la criatura.\nEjemplos:\nPerseguir sangre fresca.\nProteger una cría, reina, tótem o núcleo.\nHuir de la luz solar.\nAlimentarse de cadáveres visibles.\nDestruir fuego.\nAtacar a quien porte un símbolo concreto.\nDefender una entrada aunque sea tácticamente inútil.\nDESCRIPCIÓN:\nNo es un impulso pasajero. Es una orden escrita en el cuerpo, una obsesión de especie o una falla de voluntad que vuelve predecible a la criatura."}, {"name": "Equipo Vital", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura depende de una pieza de equipo, foco, armadura, núcleo, máscara, cristal, arma, sello, herramienta o componente externo para mantenerse completa.\nCUÁNDO: Si pierde, rompe o se le retira el objeto definido.\nQUÉ HACE: Mientras no tenga ese objeto, pierde acceso a dos rasgos, dos Técnicas o una acción especial mayor definidas al crear la criatura.\nAdemás, sufre −1 a todas sus tiradas mientras permanezca separada del objeto.\nCierre:\nEl efecto termina si recupera el objeto, lo repara, lo reemplaza o vuelve a conectarse con él mediante el método definido.\nRestricción:\nEl objeto y las capacidades afectadas deben definirse al crear la criatura.\nDESCRIPCIÓN:\nEl poder de la criatura no está completo en su cuerpo. Una máscara, núcleo, arma, cristal, jaula, sello o reliquia sostiene parte de lo que es."}, {"name": "Debilidad a Terreno", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura funciona muy mal en un tipo de terreno concreto.\nCUÁNDO: Mientras se mueve o permanece sobre el terreno definido.\nQUÉ HACE: Ese terreno cuenta como Terreno Peligroso para la criatura. Al entrar en él por primera vez en su turno o comenzar su turno dentro, sufre 1d6 de daño.\nAdemás, el terreno cuenta como Terreno Difícil para ella.\nRestricción:\nEl terreno debe definirse al crear la criatura: agua profunda, arena, hielo, roca, metal, madera viva, tierra consagrada, corrupción, vegetación, pantano, ceniza, luz solar directa u otro entorno claro.\nCierre:\nEl efecto termina cuando la criatura abandona el terreno definido.\nDESCRIPCIÓN:\nEse suelo no la sostiene: la hiere. Puede quemarla, hundirla, desorientarla, romper su cohesión o interferir con su forma de moverse."}, {"name": "Criatura Menor", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura es una versión débil, joven, enferma, incompleta, degradada o poco desarrollada de su especie.\nCUÁNDO: Al crear la criatura.\nQUÉ HACE: La criatura sufre todos estos efectos:\nSu Resistencia máxima se reduce a la mitad, redondeando hacia abajo.\n−1 a Defensa.\n−3 metros de movimiento.\nNo puede usar Reacciones.\nLa Resistencia final nunca puede quedar por debajo de 5.\nRestricción:\nUna criatura con esta desventaja no puede tomar Criatura Superior.\nLímite:\nEsta desventaja solo puede tomarse una vez.\nDESCRIPCIÓN:\nEs una forma incompleta, joven o degradada. Puede seguir siendo peligrosa en número, en emboscada o en terreno favorable, pero individualmente está por debajo del ejemplar estándar."}, {"name": "Técnica Descontrolada", "pr": 3, "category": "15. Desventajas Mayores", "text": "Las Técnicas de la criatura son peligrosas incluso para ella.\nCUÁNDO: Cuando intenta usar una Técnica.\nQUÉ HACE: Antes de resolver la Técnica, debe superar una Salvación de Aura contra ND 10.\nSi falla, la Técnica no se activa, la criatura paga igualmente su coste de Resistencia y sufre 1d6 de daño.\nEste daño no puede reducirse, resistirse ni absorberse.\nRestricción:\nEste rasgo reemplaza Técnica Inestable. No se suman.\nSolo puede tomarse si la criatura posee al menos una Técnica.\nDESCRIPCIÓN:\nEl poder puede romperse dentro de la criatura antes de salir. Cuando falla, no solo pierde la Técnica: se daña a sí misma."}, {"name": "Sobrecarga Final", "pr": 3, "category": "15. Desventajas Mayores", "text": "Las Técnicas de la criatura desgastan su cuerpo hasta el colapso.\nCUÁNDO: Cada vez que usa una Técnica después de la primera durante un mismo combate.\nQUÉ HACE: Después de resolver la Técnica, sufre 1 nivel de Fatiga.\nRestricción:\nSolo puede tomarse si la criatura posee al menos dos Técnicas o una forma de usar Técnicas varias veces por combate.\nDESCRIPCIÓN:\nLa criatura puede usar poder, pero no muchas veces. Cada Técnica adicional le acerca el cuerpo al límite."}, {"name": "Soledad Incapacitante", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura no está hecha para actuar sola.\nCUÁNDO: Mientras no tenga aliados conscientes a 6 metros o menos.\nQUÉ HACE: Tiene Desventaja en todas sus tiradas.\nCierre:\nEl efecto termina cuando vuelve a tener al menos un aliado consciente a 6 metros o menos.\nRestricción:\nEste rasgo reemplaza Dependencia de Grupo. No se suman.\nDESCRIPCIÓN:\nAislada, la criatura se desordena. Pierde ritmo, confianza, señales, olor de grupo o conexión de colmena."}, {"name": "Vulnerabilidad Grave a Material", "pr": 3, "category": "15. Desventajas Mayores", "text": "Un material concreto resulta devastador para la criatura.\nCUÁNDO: Cuando recibe daño de un arma, herramienta o efecto hecho principalmente con el material definido.\nQUÉ HACE: Recibe +2d6 de daño adicional.\nRestricción:\nEste rasgo reemplaza Vulnerabilidad a Material. No se suman.\nEl material debe definirse al crear la criatura.\nDESCRIPCIÓN:\nEse material no solo atraviesa sus defensas: las deshace. Plata, sal, hierro, madera sagrada, hueso, cobre o cristal pueden ser más que una herramienta contra ella."}, {"name": "Estado Agravado", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura empeora cuando sufre estados alterados.\nCUÁNDO: Mientras esté afectada por un estado alterado.\nQUÉ HACE: Sufre −1 a Defensa y −1 a sus tiradas.\nCierre:\nEl penalizador termina cuando deja de estar afectada por estados alterados.\nDESCRIPCIÓN:\nCuando la criatura pierde control, pierde demasiado. Veneno, miedo, inmovilidad, confusión o fatiga abren fallas en todo su cuerpo."}, {"name": "Poder Incompatible", "pr": 3, "category": "15. Desventajas Mayores", "text": "La criatura posee Técnicas que dañan su propia estabilidad interna.\nCUÁNDO: Cuando usa una Técnica de una Fuerza definida al crear la criatura.\nQUÉ HACE: Después de resolver la Técnica, la criatura sufre 1d6 de daño y pierde 3 metros de movimiento hasta el final de su próximo turno.\nEste daño no puede reducirse, resistirse ni absorberse.\nRestricción:\nLa Fuerza debe definirse al crear la criatura: Destrucción, Conservación, Transformación, Creación, Orden o Caos.\nSolo puede tomarse si la criatura posee al menos una Técnica de esa Fuerza.\nDESCRIPCIÓN:\nLa criatura puede usar esa Fuerza, pero no está hecha para contenerla. Cada uso deja grietas, quemaduras internas, ruido en el núcleo o daño espiritual."}], "natures": [{"name": "Apasionadamente", "desc": "Te mueves con emoción intensa, dejando que los sentimientos guíen tus acciones."}, {"name": "Astutamente", "desc": "Aprovechas oportunidades, actúas con ingenio rápido y cálculo oportunista."}, {"name": "Brutalmente", "desc": "Entras con fuerza cruda, sin sutilezas ni contención."}, {"name": "Caóticamente", "desc": "Actúas sin seguir patrones, improvisando de forma impredecible."}, {"name": "Carismáticamente", "desc": "Te expresas con encanto, presencia y una comunicación magnética."}, {"name": "Cautelosamente", "desc": "Te mueves con cuidado, evaluando riesgos antes de actuar."}, {"name": "Compasivamente", "desc": "Actúas movido por empatía genuina, priorizando el bienestar de quienes te rodean."}, {"name": "Curiosamente", "desc": "Investigas, observas y te acercas a lo desconocido con interés natural."}, {"name": "Despiadadamente", "desc": "Actúas sin compasión ni freno, enfocándote solo en el resultado."}, {"name": "Devotamente", "desc": "Actúas desde la fe, la convicción o un código sagrado que guía cada decisión."}, {"name": "Discretamente", "desc": "Evitas llamar la atención sin desaparecer; pasas desapercibido por actitud y postura."}, {"name": "Elegantemente", "desc": "Te mueves con gracia, estilo y precisión estética."}, {"name": "Ferozmente", "desc": "Actúas desde el instinto puro y depredador, visceral y sin freno racional."}, {"name": "Fervientemente", "desc": "Actúas con intensidad apasionada y ardor, como si cada acción fuera una causa mayor."}, {"name": "Fríamente", "desc": "Actúas sin emoción, evaluando todo desde la lógica o la distancia emocional."}, {"name": "Impulsivamente", "desc": "Saltas a la acción sin pensarlo mucho, guiado por instinto inmediato."}, {"name": "Metódicamente", "desc": "Sigues procedimientos, pasos claros y lógica ordenada."}, {"name": "Orgullosamente", "desc": "Actúas desde el honor, el ego o la reputación, sin doblegarte ante nadie."}, {"name": "Rápidamente", "desc": "Te adelantas con velocidad, actuando sin demora."}, {"name": "Silenciosamente", "desc": "Te mueves sin generar ruido, ideal para el sigilo físico."}, {"name": "Siniestramente", "desc": "Actúas con presencia intimidante, oscura o inquietante."}, {"name": "Sutilmente", "desc": "Influencias o actúas de forma casi imperceptible, con gestos o palabras mínimas."}, {"name": "Tenazmente", "desc": "Persistes sin rendirte, incluso ante fracasos repetidos."}, {"name": "Valientemente", "desc": "Enfrentas peligro, riesgo o miedo con firmeza y corazón."}], "typeAbilities": {"Bestia": [["Instinto Primario", "Cuando realiza tiradas para detectar peligro, presas, depredadores, emboscadas o cambios inmediatos en su entorno, tiene Ventaja."], ["Presa Marcada", "Al inicio de un combate o persecución, elige un objetivo visible como presa. Mientras pueda detectarlo, obtiene +1 a ataques contra ese objetivo."], ["Manada", "Cuando ataca a un objetivo adyacente a otra Bestia aliada, el ataque inflige +1 de daño."], ["Reflejo Salvaje", "Cuando supera una Salvación de Destreza, puede moverse 3 m sin provocar Ataques de Oportunidad. Una vez por ronda."], ["Olfato de Sangre", "Contra una criatura visible o rastreable bajo la mitad de su Resistencia máxima obtiene +1 a rastreo, persecución y ataque."]], "Monstruo": [["Presencia Aterradora", "Cuando un enemigo ve al Monstruo por primera vez en combate, Salvación de Aura ND 10 o queda Asustado hasta el final de su próximo turno."], ["Anatomía Aberrante", "Reduce en 1 punto todo daño recibido."], ["Hambre Insaciable", "Cuando reduce a una criatura enemiga a 0 de Resistencia con ataque cuerpo a cuerpo, recupera 1d6 Resistencia."], ["Golpe Deformante", "Cuando impacta cuerpo a cuerpo y supera la Defensa por 4 o más, el objetivo queda Derribado."], ["Cuerpo Imposible", "Tiene Ventaja para resistir Apresar, Empujar o Derribar."]], "Espíritu": [["Cuerpo Incorpóreo", "Tiene Resistencia contra daño Cortante, Penetrante y Contundente de fuentes no mágicas."], ["Eco del Pasado", "Una vez por combate, cuando falla una tirada propia, puede repetirla y quedarse con el segundo resultado."], ["Presencia Etérea", "Cuando una criatura intenta hacerle un Ataque de Oportunidad, falla automáticamente."], ["Terror Frío", "Una criatura que comienza su turno adyacente debe superar Salvación de Aura ND 10 o sufre −1 a su próxima tirada antes del final de su turno."], ["Paso Fantasmal", "Durante su movimiento puede atravesar espacios ocupados por criaturas, pero no terminar dentro de ellas ni atravesar objetos sólidos."]], "Exaltado": [["Toque Divino", "Cuando impacta con ataque natural o arma cuerpo a cuerpo, inflige +1d6 Radiante."], ["Escudo de Fe", "Una vez por ronda, cuando recibe daño, lo reduce en 1d6."], ["Aura Bendita", "Aliados a 6 m o menos tienen Ventaja en Salvaciones contra miedo, corrupción, veneno o maldiciones."], ["Juicio Radiante", "Cuando impacta a una criatura Corrupta, No-muerta o profanada, inflige +2 daño adicional."], ["Luz Purificadora", "Como Acción Rápida, un aliado visible a 6 m puede repetir Salvación fallida contra Envenenado, Asustado o corrupción. Una vez por ronda."]], "Corrupto": [["Toque Profano", "Cuando impacta con ataque natural o arma cuerpo a cuerpo, inflige +1d6 Corrosivo."], ["Podredumbre Contagiosa", "Cuando una criatura falla una Salvación causada por el Corrupto, reduce su Defensa en 1 hasta el final de su próximo turno."], ["Maldición Persistente", "Cuando el Corrupto llega a 0 Resistencia, quien lo redujo debe superar Salvación de Cuerpo ND 10 o queda Envenenado hasta el final de su próximo turno."], ["Carne Impura", "Cuando una criatura impacta al Corrupto con ataque cuerpo a cuerpo natural o sin arma, recibe 1d6 Corrosivo. Una vez por ronda."], ["Aliento de Ruina", "Acción Principal contra criatura visible a 6 m: Salvación de Cuerpo ND 10 o −1 a ataques hasta el final de su próximo turno."]], "Elemental": [["Toque Elemental", "Cuando impacta con ataque natural o cuerpo a cuerpo, inflige +1d6 del tipo asociado a su elemento."], ["Forma Pura", "Es inmune al daño de su propio elemento."], ["Explosión Elemental", "Una vez por combate, cuando impacta con su primer ataque del turno, también afecta a criaturas adyacentes al objetivo principal."], ["Movimiento Elemental", "Ignora Terreno Difícil causado por su propio elemento."], ["Desborde Elemental", "Cuando queda bajo la mitad de Resistencia, hasta el inicio de su próximo turno, criaturas que comiencen adyacentes reciben 1d6 del elemento."]], "Artificial": [["Mente Mecánica", "Es inmune al daño Mental, al estado Asustado y a venenos."], ["Protocolo de Combate", "Elige Cuerpo o Destreza. Obtiene +1 a to  −1 Defensa contra ataques a distancia."}, "Defensivo": {"res": 0, "def": 0, "mov": -3, "pc": 0, "note": "+1 Defensa mientras no se haya movido voluntariamente desde el inicio de su último turno; movimiento −3 m."}, "Acechador": {"res": 0, "def": 0, "mov": 0, "pc": 0, "note": "+1 ataque contra objetivos sin aliados adyacentes; −1 daño contra objetivos junto a aliados."}, "Hostigador": {"res": -10, "def": 0, "mov": 3, "pc": 0, "note": "Movimiento +3 m; Resistencia máxima −10."}, "Controlador": {"res": 0, "def": 0, "mov": 0, "pc": 0, "note": "+1 ND de Salvación de Técnicas de control; −1 daño directo."}, "Artillero": {"res": 0, "def": 0, "mov": 0, "pc": 0, "note": "+1 ataques a distancia; −1 Defensa contra ataques cuerpo a cuerpo."}, "Auxiliador": {"res": 0, "def": 0, "mov": 0, "pc": 0, "note": "Acción Rápida: +1 a próxima tirada de aliado visible a 6 m; −1 daño."}, "Invocador": {"res": 0, "def": 0, "mov": 0, "pc": 5, "note": "+5 PC solo para Técnicas de invocación; invocados pierden su siguiente acción si queda Aturdida, Inconsciente o Silenciada."}}, "ndTable": [["1/8", 6, 7, 0, "1d6 − 3", 0, 0], ["1/4", 10, 8, 0, "1d6 − 2", 1, 0], ["1/2", 18, 8, 1, "1d6 − 1", 1, 0], ["1", 26, 8, 2, "1d6", 2, 0], ["2", 40, 8, 3, "1d6 + 1", 3, 0], ["3", 55, 9, 4, "2d6 − 1", 4, 5], ["4", 75, 9, 4, "2d6", 5, 5], ["5", 100, 10, 5, "2d6 + 1", 6, 5], ["6", 115, 10, 5, "2d6 + 2", 7, 10], ["7", 125, 11, 6, "2d6 + 2", 8, 10], ["8", 138, 11, 6, "2d6 + 3", 9, 10], ["9", 153, 12, 7, "3d6", 10, 15], ["10", 168, 12, 7, "3d6 + 1", 10, 15], ["11", 183, 12, 7, "3d6 + 1", 11, 15], ["12", 198, 13, 8, "3d6 + 2", 11, 20], ["13", 213, 13, 8, "4d6", 12, 20], ["14", 228, 14, 9, "4d6 + 1", 13, 20], ["15", 243, 14, 9, "4d6 + 2", 14, 25]], "sizes": {"Minúsculo": [-5, 3], "Pequeño": [-5, 1], "Mediano": [0, 0], "Grande": [15, -1], "Enorme": [30, -2], "Colosal": [60, -4]}, "techniquesCatalog": [{"name": "Mordida Desgarradora", "level": 0, "type": "Acción especial ofensiva", "force": "Destrucción", "cost": "1 Resistencia", "req": "La criatura debe tener mordida, mandíbulas, colmillos o pico cortante.", "when": "En su turno, cuando realiza un ataque de mordida.", "effect": "La criatura realiza un ataque de mordida. Si impacta, además del daño normal, el objetivo sufre 1 punto de daño Cortante al inicio de su próximo turno. Este daño representa sangrado, desgarro o tejido abierto. No se repite más de una vez.", "desc": "La criatura no solo muerde: tira, rasga y abre la carne. La herida queda viva incluso después de que la mandíbula se suelta."}, {"name": "Escupir Bilis", "level": 0, "type": "Acción especial a distancia", "force": "Destrucción / Caos", "cost": "1 Resistencia", "req": "La criatura debe producir bilis, ácido leve, saliva irritante, tinta, veneno ocular o secreción similar.", "when": "En su turno, como Acción Principal.", "effect": "La criatura escupe una sustancia irritante contra una criatura visible a 10 metros o menos. El objetivo debe superar una Salvación de Destreza ND 9. Si falla, sufre −1 a su próxima tirada de ataque antes del final de su próximo turno. Si supera la Salvación, no sufre efecto.", "desc": "Un chorro desagradable sale disparado de la boca o glándulas de la criatura. No quema profundamente, pero irrita ojos, nariz, boca o respiración."}, {"name": "Golpe de Cola", "level": 0, "type": "Acción especial defensiva o de control", "force": "Destrucción", "cost": "1 Resistencia", "req": "La criatura debe tener cola fuerte, tentáculo posterior, abdomen articulado o apéndice de barrido.", "when": "En su turno, como Acción Principal.", "effect": "La criatura barre con su cola a una criatura dentro de 3 metros que esté detrás o a un costado de ella. El objetivo debe superar una Salvación de Destreza ND 9. Si falla, queda Derribado. Si supera la Salvación, se mantiene en pie.", "desc": "La cola barre el suelo con fuerza instintiva. No es un golpe preciso, sino un movimiento amplio que castiga a quien se acerca por mal ángulo."}, {"name": "Zarpazo Veloz", "level": 0, "type": "Acción especial ofensiva", "force": "Destrucción", "cost": "1 Resistencia", "req": "La criatura debe tener garras, cuchillas naturales, patas delanteras fuertes o extremidades de ataque rápido.", "when": "En su turno, después de moverse al menos 3 metros.", "effect": "La criatura realiza un ataque cuerpo a cuerpo con +2 a la tirada de ataque, pero el ataque inflige −1 al daño. Solo puede usarse si la criatura se movió al menos 3 metros durante ese turno antes de atacar.", "desc": "La criatura aprovecha el impulso del desplazamiento para lanzar un golpe rápido. No es el golpe más fuerte, pero sí uno difícil de anticipar."}, {"name": "Aullido Intimidante", "level": 0, "type": "Acción especial de presión", "force": "Orden", "cost": "1 Resistencia", "req": "La criatura debe poder rugir, aullar, chillar, bramar o emitir una señal intimidante audible.", "when": "En su turno, como Acción Principal.", "effect": "La criatura emite un sonido intimidante. Hasta 2 enemigos a 8 metros o menos que puedan oírla deben superar una Salvación de Aura ND 9. Quien falle sufre −1 a su próxima tirada de ataque antes del final de su próximo turno. Las criaturas sordas o incapaces de percibir el sonido no son afectadas.", "desc": "El sonido no contiene palabras. Es una advertencia primitiva que hace que el cuerpo dude antes de atacar."}, {"name": "Paso Sigiloso", "level": 0, "type": "Movimiento especial", "force": "Orden / Transformación", "cost": "1 Resistencia", "req": "La criatura debe tener anatomía silenciosa, patas blandas, camuflaje, instinto de acecho o movimiento depredador.", "when": "En su turno, antes de moverse.", "effect": "Hasta el final de su turno, el movimiento de la criatura no provoca ataques de oportunidad. Además, si termina su movimiento en cobertura, penumbra, vegetación, ruinas, agua turbia u otro entorno que permita ocultarse, obtiene +1 a su próxima tirada de Sigilo antes del inicio de su próximo turno.", "desc": "La criatura avanza sin romper ramas, sin raspar piedra y sin anunciar su peso. No desaparece: simplemente se mueve como algo hecho para acechar."}, {"name": "Espinas Reflejas", "level": 0, "type": "Reacción defensiva", "force": "Transformación", "cost": "1 Resistencia", "req": "La criatura debe tener espinas, púas, placas cortantes, cerdas rígidas, escamas afiladas o exoesqueleto punzante.", "when": "Como Reacción, cuando una criatura adyacente la impacta con un ataque cuerpo a cuerpo.", "effect": "El atacante sufre 1d6−2 de daño Penetrante. Este daño no requiere tirada de ataque. No se activa contra ataques a distancia ni contra efectos de área.", "desc": "Golpear a la criatura provoca una respuesta inmediata: espinas que se tensan, púas que se abren o placas que castigan el contacto."}, {"name": "Baba Resbaladiza", "level": 0, "type": "Control menor de terreno", "force": "Transformación", "cost": "1 Resistencia", "req": "La criatura debe producir baba, mucosa, aceite corporal, secreción viscosa o rastro resbaladizo.", "when": "En su turno, como Acción Principal.", "effect": "La criatura cubre el suelo en un radio de 2 metros centrado en ella. El área se convierte en terreno difícil hasta el inicio de su próximo turno. La criatura que generó la baba no se ve afectada por este terreno difícil.", "desc": "Un fluido espeso cubre la zona. Las patas resbalan, las botas se hunden y cada paso exige cuidado."}, {"name": "Mimetismo Básico", "level": 0, "type": "Cualidad activable de camuflaje", "force": "Creación / Transformación", "cost": "1 Resistencia 5", "req": "La criatura debe tener piel cambiante, placas miméticas, pigmentos reactivos, pelaje adaptable o magia natural de ocultamiento.", "when": "En su turno, como Acción Principal.", "effect": "La criatura adapta su aspecto al entorno. Obtiene Ventaja en la próxima tirada de Sigilo que realice antes del inicio de su próximo turno. Si se mueve más de 3 metros antes de hacer la tirada, pierde la Ventaja.", "desc": "La piel de la criatura copia colores, manchas y sombras cercanas. Mientras permanezca casi inmóvil, resulta difícil distinguirla del entorno."}, {"name": "Destello Cegador", "level": 0, "type": "Acción especial de distracción", "force": "Caos", "cost": "1 Resistencia", "req": "La criatura debe producir bioluminiscencia, chispas, destellos, escamas reflectantes, energía ocular o luz caótica.", "when": "En su turno, como Acción Principal.", "effect": "Un objetivo visible a 6 metros o menos debe superar una Salvación de Aura ND 9. Si falla, sufre −1 a sus tiradas de ataque hasta el final de su próximo turno. Si el objetivo no depende de la vista, tiene Ventaja en esta Salvación.", "desc": "La luz estalla desde el cuerpo de la criatura sin patrón lógico. El brillo dura un instante, pero deja la vista confundida. Técnicas de Nivel"}, {"name": "Carga Aplastante", "level": 1, "type": "Acción especial ofensiva", "force": "Destrucción", "cost": "2 Resistencia 6", "req": "La criatura debe ser capaz de embestir: masa corporal, cuernos, hombros fuertes, caparazón, cráneo duro o cuerpo robusto.", "when": "En su turno, como Acción Principal.", "effect": "La criatura se mueve hasta 8 metros en línea recta y realiza un ataque cuerpo a cuerpo al final del movimiento. Si impacta, el ataque inflige +2 al daño. Además, el objetivo debe superar una Salvación de Cuerpo ND 12 o queda Derribado. La criatura necesita al menos 4 metros libres para tomar impulso.", "desc": "La criatura carga con todo su peso. El golpe no solo hiere: intenta arrancar al enemigo de su posición."}, {"name": "Rugido Aterrador", "level": 1, "type": "Acción especial de miedo", "force": "Orden", "cost": "2 Resistencia", "req": "La criatura debe poder emitir un rugido, chillido, bramido, zumbido o señal de dominio.", "when": "En su turno, como Acción Principal.", "effect": "Hasta 3 enemigos a 10 metros o menos que puedan oír a la criatura deben superar una Salvación de Aura ND 12. Quien falle queda Asustado hasta el final de su próximo turno. Quien supere la Salvación no puede ser afectado por el Rugido Aterrador de esa misma criatura hasta el final de la ronda.", "desc": "No es solo ruido. Es una demostración de dominio que hace que los instintos del objetivo reconozcan a un depredador superior."}, {"name": "Veneno Paralizante", "level": 1, "type": "Ataque especial con toxina", "force": "Caos", "cost": "2 Resistencia 7", "req": "La criatura debe tener veneno, aguijón, colmillos, saliva paralizante, esporas nerviosas o toxina de contacto.", "when": "En su turno, cuando impacta con un ataque de mordida, aguijón, garra o contacto.", "effect": "El objetivo debe superar una Salvación de Cuerpo ND 12. Si falla, queda Inmovilizado hasta el final de su próximo turno. Si supera la Salvación, su movimiento se reduce a la mitad hasta el final de su próximo turno.", "desc": "El veneno no destruye el cuerpo: interrumpe sus órdenes. Los músculos siguen ahí, pero dejan de responder con normalidad."}, {"name": "Nube de Esporas", "level": 1, "type": "Área biológica", "force": "Caos", "cost": "2 Resistencia", "req": "La criatura debe producir esporas, polen tóxico, polvo irritante, gas interno o partículas infecciosas.", "when": "En su turno, como Acción Principal.", "effect": "La criatura libera esporas en un cono de 5 metros. Todas las criaturas enemigas en el área deben superar una Salvación de Cuerpo ND 12. Quien falle queda Envenenado durante 1 ronda. Mientras esté Envenenado de esta forma, sufre 1d6 de daño Corrosivo al inicio de su turno. Quien supere la Salvación no sufre efecto.", "desc": "Una nube fina sale del cuerpo de la criatura. Parece polvo, pero al entrar en la piel o los pulmones comienza a quemar desde dentro."}, {"name": "Regeneración de Campo", "level": 1, "type": "Cualidad regenerativa activable", "force": "Conservación", "cost": "2 Resistencia 8", "req": "La criatura debe tener regeneración natural, carne vegetal, metabolismo acelerado, tejido mutable o biología restaurativa.", "when": "En su turno, como Acción Principal.", "effect": "La criatura activa su regeneración durante 2 rondas. Al inicio de cada uno de sus turnos mientras dure el efecto, recupera 1d6 puntos de Resistencia. Si la criatura recibe daño de Fuego, Ácido o daño especialmente contrario a su biología, la regeneración termina al final de esa ronda. El Diseñador debe definir qué tipo de daño interrumpe la regeneración al crear la criatura.", "desc": "La carne se cierra, la corteza vuelve a crecer o el tejido se recompone. El cuerpo parece rechazar la idea de permanecer herido."}, {"name": "Telaraña Lanzada", "level": 1, "type": "Acción especial de captura", "force": "Creación", "cost": "2 Resistencia", "req": "La criatura debe producir seda, red, baba endurecida, filamentos, lianas pegajosas o material de captura.", "when": "En su turno, como Acción Principal.", "effect": "La criatura lanza una red o masa pegajosa contra un objetivo visible a 12 metros o menos. El objetivo debe superar una Salvación de Destreza ND 12. Si falla, queda Inmovilizado hasta el final de su próximo turno. El objetivo puede terminar el efecto antes usando su Acción Principal para superar una tirada de Cuerpo ND 12.", "desc": "Una masa pegajosa sale disparada y se abre al impactar. En segundos se endurece, anclando brazos, piernas o alas."}, {"name": "Pisotón Sísmico", "level": 1, "type": "Área de derribo", "force": "Transformación / Destrucción 9", "cost": "2 Resistencia", "req": "La criatura debe ser Grande o mayor, o tener fuerza suficiente para sacudir el terreno.", "when": "En su turno, como Acción Principal.", "effect": "La criatura golpea el suelo. Todos los enemigos en un radio de 4 metros deben superar una Salvación de Destreza ND 12. Quien falle queda Derribado. Además, el área afectada se convierte en terreno difícil hasta el inicio del próximo turno de la criatura. No funciona si la criatura no está apoyada sobre una superficie sólida.", "desc": "El suelo vibra, se agrieta o se hunde bajo la fuerza del impacto. Quien no reacciona a tiempo cae entre polvo, piedra y temblor."}, {"name": "Absorción de Impacto", "level": 1, "type": "Reacción defensiva", "force": "Conservación", "cost": "2 Resistencia", "req": "La criatura debe tener cuerpo elástico, gelatinoso, acolchado, mineral, absorbente, regenerativo o blindaje flexible.", "when": "Como Reacción, cuando recibe daño de un ataque.", "effect": "La criatura reduce el daño recibido en 1d6+2 puntos. No puede reducir daño Mental ni efectos que no representen impacto, corte, presión, perforación o energía física absorbible.", "desc": "El golpe entra en el cuerpo de la criatura y pierde fuerza. La carne, placas o mucosa absorben parte del impacto antes de que llegue al centro vital."}, {"name": "Sello de Ralentización", "level": 1, "type": "Ataque especial de control", "force": "Orden", "cost": "2 Resistencia 10", "req": "La criatura debe marcar, tocar, mirar, emitir una señal de control o imponer un patrón sobre el objetivo.", "when": "En su turno, como Acción Principal.", "effect": "La criatura realiza un ataque de contacto contra un objetivo. Si impacta, el objetivo debe superar una Salvación de Aura ND 12. Si falla, su movimiento se reduce a la mitad hasta el final de su próximo turno y pierde su Reacción hasta el inicio de su próximo turno. Si supera la Salvación, solo pierde su Reacción hasta el inicio de su próximo turno.", "desc": "Una marca, vibración o presión invisible se fija al cuerpo del enemigo. Sus movimientos se vuelven pesados, como si cada gesto tuviera que pedir permiso."}, {"name": "Duplicado Fantasmal", "level": 1, "type": "Defensa ilusoria", "force": "Creación", "cost": "2 Resistencia", "req": "La criatura debe producir ilusiones, reflejos, sombras dobles, vibraciones visuales o duplicación parcial.", "when": "En su turno, como Acción Principal.", "effect": "La criatura genera un duplicado ilusorio adyacente que dura hasta el inicio de su próximo turno. La primera vez que un ataque cuerpo a cuerpo o a distancia impactaría a la criatura mientras el duplicado esté activo, lanza 1d6: 1–3: el ataque golpea al duplicado y no afecta a la criatura. 4–6: el ataque golpea a la criatura normalmente. El duplicado desaparece después de resolver ese primer ataque, impacte o no.", "desc": "Dos cuerpos se mueven al mismo tiempo con la misma respiración y la misma sombra. Solo uno tiene carne, pero descubrirlo exige atacar. • • 11 Técnicas de Nivel"}, {"name": "Avalancha de Golpes", "level": 2, "type": "Acción ofensiva de presión", "force": "Destrucción", "cost": "4 Resistencia", "req": "La criatura debe tener múltiples extremidades, gran velocidad, brazos poderosos, tentáculos, garras dobles o capacidad natural de golpear repetidamente.", "when": "En su turno, como Acción Principal.", "effect": "La criatura realiza dos ataques contra uno o dos objetivos dentro de su alcance cuerpo a cuerpo. Cada ataque inflige −1 al daño. Si ambos ataques impactan al mismo objetivo, ese objetivo debe superar una Salvación de Cuerpo ND 14 o queda Aturdido hasta el final de su próximo turno. Después de usar esta técnica, la criatura no puede moverse voluntariamente hasta el final de su turno.", "desc": "La criatura descarga golpes en una secuencia brutal. No busca precisión elegante: busca saturar la defensa del enemigo hasta romper su equilibrio y concentración."}, {"name": "Grito de Mando", "level": 2, "type": "Acción de liderazgo de criatura", "force": "Orden", "cost": "4 Resistencia", "req": "La criatura debe ser líder, alfa, reina, comandante natural, mente de enjambre o criatura con autoridad sobre aliados.", "when": "En su turno, como Acción Principal.", "effect": "Hasta 4 criaturas aliadas a 15 metros o menos que puedan oír o percibir la orden recuperan 2 puntos de Resistencia y obtienen +1 a su próxima tirada de ataque antes del inicio del próximo turno de la criatura. No afecta a criaturas que no reconozcan su autoridad, no compartan vínculo de manada, colmena, tribu, control mental o subordinación. 12", "desc": "No es un simple ruido. Es una orden biológica, social o instintiva. Los cuerpos aliados responden antes de pensar."}, {"name": "Infección Corrosiva", "level": 2, "type": "Ataque especial debilitante", "force": "Caos", "cost": "4 Resistencia", "req": "La criatura debe producir infección, ácido, toxina necrosante, parásitos, moho corrosivo o veneno avanzado.", "when": "En su turno, cuando impacta con un ataque de contacto, mordida, aguijón o garra contaminada.", "effect": "El objetivo debe superar una Salvación de Cuerpo ND 14. Si falla, queda Envenenado durante 3 rondas. Mientras dure, sufre 1d6 de daño Corrosivo al inicio de cada turno y la curación que reciba se reduce en 3 puntos. Si supera la Salvación, sufre solo 1d6 de daño Corrosivo inmediato.", "desc": "La toxina no solo daña. Ensucia la carne, bloquea la recuperación y obliga al cuerpo a gastar fuerzas combatiendo la infección."}, {"name": "Velo de Terror", "level": 2, "type": "Aura de presión psicológica", "force": "Caos / Orden", "cost": "4 Resistencia", "req": "La criatura debe tener presencia sobrenatural, aura depredadora, emanación psíquica, feromonas de miedo o aspecto aterrador.", "when": "En su turno, como Acción Principal.", "effect": "La criatura proyecta un aura de terror en un radio de 8 metros durante 3 rondas. La primera vez que un enemigo entre en el área o comience su turno dentro de ella, debe superar una Salvación de Aura ND 12. Si falla, sufre −1 a todas sus tiradas mientras permanezca dentro del aura. 13 El penalizador no se acumula. El efecto termina para todos si la criatura queda Inconsciente, Aturdida o Agotada.", "desc": "El miedo no ruge ni muestra dientes. Está en el aire, en la presión del pecho y en la certeza instintiva de que acercarse es un error."}, {"name": "Enraizamiento", "level": 2, "type": "Control de área", "force": "Transformación", "cost": "4 Resistencia", "req": "La criatura debe tener raíces, tentáculos, extremidades extensibles, apéndices subterráneos, lianas, mucosa endurecida o control físico del terreno.", "when": "En su turno, como Acción Principal.", "effect": "La criatura extiende raíces, tentáculos o apéndices en un radio de 5 metros. Todos los enemigos en el área deben superar una Salvación de Cuerpo ND 14. Quien falle queda Inmovilizado hasta el final de su próximo turno. Mientras mantiene esta técnica, la criatura también queda Inmovilizada. Puede terminar el efecto voluntariamente al inicio de su turno. El efecto termina automáticamente si la criatura queda Inconsciente, Aturdida o es desplazada a la fuerza.", "desc": "El suelo o el cuerpo de la criatura se abren en apéndices que atrapan todo a su alrededor. La criatura sacrifica movimiento propio para convertir el terreno cercano en una trampa viva."}]};
